	[[module.entry]]
	name = "KPB"
	uuid = UUIDREG_STR_KPB4
	affinity_mask = "0x1"
	instance_count = "4"
	domain_types = "0"
	load_type = "0"
	module_type = "0xB"
	auto_start = "0"
	sched_caps = [1, 0x00008000]

	REM # pin = [dir, type, sample rate, size, container, channel-cfg]
	REM # 1 source, 2 sinks: kpb.c drives a sel_sink (buf_id 0, the real-time
	REM # feed to the detectors) and a host_sink (buf_id 1, the drain that
	REM # bursts pre-roll to the host). Only one sink was declared here, so
	REM # the drain path could not be bound from topology.
	pin = [0, 0, 0xfeef, 0xf, 0xf, 0x45ff,
			1, 0, 0xfeef, 0xf, 0xa, 0x45ff,
			1, 0, 0xfeef, 0xf, 0xa, 0x45ff]

	REM # mod_cfg [PAR_0 PAR_1 PAR_2 PAR_3 IS_BYTES CPS IBS OBS MOD_FLAGS CPC OBLS]
	mod_cfg = [0, 0, 0, 0, 14400, 1114000, 16, 16, 0, 0, 0]

	index = __COUNTER__
