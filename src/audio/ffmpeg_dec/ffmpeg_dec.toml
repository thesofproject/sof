#ifndef LOAD_TYPE
#define LOAD_TYPE "0"
#endif

	REM # FFmpeg audio decoder module config
	[[module.entry]]
	REM # NOTE: module name is limited to 8 chars (manifest name field);
	REM # it must match the SOF_LLEXT_MODULE_MANIFEST() name in ffmpeg_dec.c.
	name = "FFMPGDEC"
	uuid = UUIDREG_STR_FFMPEG_DEC
	affinity_mask = "0x1"
	instance_count = "40"
	domain_types = "0"
	load_type = LOAD_TYPE
	module_type = "9"
	auto_start = "0"
	sched_caps = [1, 0x00008000]
	REM # pin = [dir, type, sample rate, size, container, channel-cfg]
	pin = [0, 0, 0xfeef, 0xf, 0xf, 0x45ff, 1, 0, 0xfeef, 0xf, 0xf, 0x1ff]
	REM # mod_cfg [PAR_0 PAR_1 PAR_2 PAR_3 IS_BYTES CPS IBS OBS MOD_FLAGS CPC OBLS]
	REM # Decoder: input is a small compressed chunk, output is larger PCM, so
	REM # OBS (output buffer size) is sized well above IBS (input buffer size).
	mod_cfg = [0, 0, 0, 0, 8192, 5000000, 4096, 16384, 0, 5000, 0]

	index = __COUNTER__
