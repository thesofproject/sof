	pin = [0, 0, 0xfeef, 0xf, 0xf, 0x45ff, 1, 0, 0xfeef, 0xf, 0xf, 0x45ff]
	REM # mod_cfg: RNNoise ~30KB state, ~10ms latency, 48kHz stereo S32
	REM # [PAR_0 PAR_1 PAR_2 PAR_3 IS_BYTES CPS IBS OBS MOD_FLAGS CPC OBLS]
	mod_cfg = [0, 0, 0, 0, 0, 5000000, 16384, 16384, 0, 5000, 0]

	index = __COUNTER__
