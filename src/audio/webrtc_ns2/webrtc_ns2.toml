	name = "WRTCNS2"
	uuid = UUIDREG_STR_WEBRTC_NS2
	affinity_mask = "0x1"
	instance_count = "40"
	domain_types = "0"
	load_type = LOAD_TYPE
	module_type = "9"
	auto_start = "0"
	sched_caps = [1, 0x00008000]
