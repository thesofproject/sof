#ifndef LOAD_TYPE
#define LOAD_TYPE "0"
#endif

	REM # WebRTC Noise Suppression module config
	[[module.entry]]
	REM # Module name limited to 8 chars; must match SOF_LLEXT_MODULE_MANIFEST() in webrtc_ns.c.
	name = "WRTCNS"
	uuid = UUIDREG_STR_WEBRTC_NS
	affinity_mask = "0x1"
	instance_count = "40"
	domain_types = "0"
	load_type = LOAD_TYPE
	module_type = "9"
	auto_start = "0"
	sched_caps = [1, 0x00008000]
	REM # pin = [dir, type, sample rate, size, container, channel-cfg]
	REM # Single input pin (PCM), single output pin (denoised PCM). Pass-through topology.
	pin = [0, 0, 0xfeef, 0xf, 0xf, 0x45ff, 1, 0, 0xfeef, 0xf, 0xf, 0x45ff]
	REM # mod_cfg [PAR_0 PAR_1 PAR_2 PAR_3 IS_BYTES CPS IBS OBS MOD_FLAGS CPC OBLS]
	REM # NS adds ~10ms buffering latency; IBS/OBS sized for 2×10ms at 48kHz stereo S32.
	mod_cfg = [0, 0, 0, 0, 0, 3000000, 16384, 16384, 0, 3000, 0]

	index = __COUNTER__
