CONFIG_ZTEST=y
CONFIG_SOF_FULL_ZEPHYR_APPLICATION=n
# printk()/zassert messages in this suite print doubles (%g, %e); without
# this, printk silently emits the format string literally instead of the value.
CONFIG_CBPRINTF_FP_SUPPORT=y
# The DRC SIMD level choice depends on COMP_DRC. On native_sim it defaults to
# DRC_HIFI_NONE, which selects the generic drc_math_generic.c implementation.
CONFIG_COMP_DRC=y
