CONFIG_ZTEST=y
CONFIG_SOF_FULL_ZEPHYR_APPLICATION=n
CONFIG_FORMAT_S16LE=y
CONFIG_FORMAT_S24LE=y
CONFIG_FORMAT_S32LE=y
# Route the SOF heap to the host malloc()/free() of the native simulator, so
# that ASan and LSan can see it. They cannot see blocks carved out of the
# static sys_heap arena that zephyr/lib/alloc.c uses by default.
CONFIG_SOF_NATIVE_SIM_HOST_HEAP=y
# The sys_heap arena is still reserved and initialised by heap_init(), and its
# 256 KiB are too large for SYS_HEAP_SMALL_ONLY (see app/boards/native_sim.conf)
CONFIG_SYS_HEAP_BIG_ONLY=y
