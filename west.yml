---
# SOF west manifest
manifest:
  version: "0.13"

  defaults:
    remote: thesofproject

  remotes:
    - name: thesofproject
      url-base: https://github.com/thesofproject
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos
    # FFmpeg source for the ffmpeg_dec module (CONFIG_COMP_FFMPEG_DEC). Points at
    # a SOF fork carrying SOF-local FFmpeg patches (branch sof-ffmpeg-dec, based
    # on release/7.1). To move versions or add patches, update the branch and bump
    # the 'revision:' SHA below.
    - name: ffmpeg
      url-base: https://github.com/lgirdwood
    # libshine fixed-point MP3 encoder for FFMPEG_ENC_MP3 (upstream mirror).
    - name: shine
      url-base: https://github.com/toots
    # libfvad: pure-C BSD-3 extraction of the WebRTC GMM VAD for the
    # webrtc_vad module (CONFIG_COMP_WEBRTC_VAD). Cross-built by
    # src/audio/webrtc_vad/webrtc_vad.cmake.
    - name: libfvad
      url-base: https://github.com/dpirch
    # webrtc-apm: webrtc-audio-processing 0.3.x source used for the classic
    # WebRTC Noise Suppression module (CONFIG_COMP_WEBRTC_NS). Pure-C subset,
    # no abseil. Cross-built by src/audio/webrtc_ns/webrtc_ns.cmake.
    - name: webrtc-apm
      url-base: https://gitlab.freedesktop.org/gstreamer
    # rnnoise: xiph/rnnoise deep-learning noise suppressor used by webrtc_ns2.
    # Pure C, BSD-3-Clause. Pinned at Feb-2025 tip.
    - name: rnnoise
      url-base: https://github.com/xiph

  # When upgrading projects here please run git log --oneline in the
  # project and if not too long then include the output in your commit
  # message. See examples of good commit messages at
  # https://github.com/thesofproject/sof/commits/4e1d3ba61abd3/rimage
  # (git log 4e1d3ba61abd3 -- rimage/)

  # WARNING: for backwards compatibility with non-Zephyr platforms,
  # rimage and toml99 are STILL git submodules! Every time you change
  # their `revision` revision here you MUST keep their git submodules in
  # sync. This is as simple as `git add rimage` before committing (+
  # `git commit --amend` if you forgot and already committed this
  # west manifest file).

  # When a submodule is out of sync then both `git status` and `git
  # describe` notice and a "-dirty" suffix appears in the SOF version.
  # It is generally very bad practice to git push without looking
  # at "git status"; even without submodules.
  # rimage and tomlc99 to Zephyr's west manifest discussion:
  # https://github.com/zephyrproject-rtos/zephyr/issues/58212

  projects:
    # West convenience for Zephyr people who forgot --recursive when
    # cloning sof.git.  This adds the burden of keeping both tomlc99
    # SHA1s synchronized but in practice it barely ever moves.
    - name: tomlc99
      repo-path: tomlc99
      path: sof/tools/rimage/tomlc99
      revision: e3a03f5ec7d8d33be705c5ce8a632d998ce9b4d1

    # FFmpeg (libavcodec) source for the ffmpeg_dec module. Cross-built by
    # src/audio/ffmpeg_dec/ffmpeg.cmake, enabling only the Kconfig-selected
    # decoders. SOF fork branch sof-hifi (release/7.1 + av_tx table-size cap that drops
    # the module .bss from ~17MB to ~415KB, + Xtensa HiFi float_dsp). Bump to move
    # versions.
    - name: ffmpeg
      repo-path: FFmpeg
      path: modules/audio/ffmpeg
      revision: a600a78acded219a98c426af0e353e6f2d689b9d
      remote: ffmpeg

    # libshine: small fixed-point MP3 encoder for FFMPEG_ENC_MP3 (FFmpeg has no
    # native MP3 encoder). Cross-built by ffmpeg.cmake.
    - name: shine
      repo-path: shine
      path: modules/audio/shine
      revision: ab5e3526b64af1a2eaa43aa6f441a7312e013519
      remote: shine

    # libfvad: standalone WebRTC GMM VAD for the webrtc_vad module.
    # Cross-built by src/audio/webrtc_vad/webrtc_vad.cmake.
    - name: libfvad
      repo-path: libfvad
      path: modules/audio/libfvad
      revision: 532ab666c20d3cfda38bca63abbb0f152706c369
      remote: libfvad

    # webrtc-audio-processing 0.3.1 — classic WebRTC APM for webrtc_ns module.
    # Pure-C NS subset only; no C++ or abseil dependency.
    # Cross-built by src/audio/webrtc_ns/webrtc_ns.cmake.
    - name: webrtc-apm
      repo-path: webrtc-audio-processing
      path: modules/audio/webrtc-apm
      revision: v0.3.1
      remote: webrtc-apm

    # rnnoise — xiph/rnnoise deep-learning noise suppressor (webrtc_ns2).
    # Pure C, BSD-3-Clause. Pinned at Feb-2025 tip (post RNNoise 2.0 refactor).
    - name: rnnoise
      repo-path: rnnoise
      path: modules/audio/rnnoise
      revision: 70f1d256acd4b34a572f999a05c87bf00b67730d
      remote: rnnoise

    - name: zephyr
      repo-path: zephyr
      revision: ef5cfd369f4a0ab3601db9a23c1da8c406cc1a72
      remote: zephyrproject

      # Import some projects listed in zephyr/west.yml@revision
      #
      # Warning: changes to zephyr/west.yml or to any other _imported_
      # west.yml file are _ignored_ by design!  Only the above
      # 'revision:' of zephyr/west.yml is used.
      import:
        name-whitelist:
          - hal_xtensa
          - hal_nxp
          - mbedtls
          - mipi-sys-t
          - lz4
          - tinycrypt
          - cmsis_6

  self:
    # Changes to submanifests/*.yml files _are_ effective; these have no
    # specified 'revision:'
    import: submanifests
