Define {
	DMIC0_PCM_ID	10
	DMIC0_PCM_CAPS	"Gain Capture 10"

	DMIC1_PCM_ID	11
	DMIC1_PCM_CAPS	"Gain Capture 11"

	DMIC_DAI_INDEX	0
	DMIC_NAME	"dmic01"

	FORMAT		"s32le"
}

# ===========================================================================
# Host Pipeline 1 -> PCM 10 (DMIC Port 0 / PDM0: Channels 0 & 1)
# ===========================================================================
Object.Pipeline.host-gateway-capture [
	{
		format	$FORMAT
		rate	48000
		rate_min 48000
		rate_max 48000
		index	1

		Object.Widget.host-copier.1 {
			stream_name $DMIC0_PCM_CAPS
			pcm_id $DMIC0_PCM_ID
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_rate	48000
					out_channels	2
					out_ch_cfg	$CHANNEL_CONFIG_STEREO
					out_ch_map	$CHANNEL_MAP_STEREO
					out_bit_depth	32
					out_valid_bit_depth 32
				}
			]
		}
	}
]

# ===========================================================================
# Host Pipeline 3 -> PCM 11 (DMIC Port 1 / PDM1: Channels 2 & 3)
# ===========================================================================
Object.Pipeline.host-gateway-capture [
	{
		format	$FORMAT
		rate	48000
		rate_min 48000
		rate_max 48000
		index	3

		Object.Widget.host-copier.1 {
			stream_name $DMIC1_PCM_CAPS
			pcm_id $DMIC1_PCM_ID
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_channels		2
					in_ch_cfg		$CHANNEL_CONFIG_STEREO
					in_ch_map		0xFFFFFF32
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate	48000
					out_channels	2
					out_ch_cfg	$CHANNEL_CONFIG_STEREO
					out_ch_map	$CHANNEL_MAP_STEREO
					out_bit_depth	32
					out_valid_bit_depth 32
				}
			]
		}
	}
]

# ===========================================================================
# DAI Copier Pipeline 2 -> Captures 4ch from PDM0 + PDM1 at 48kHz
# Pin 0: Channels 0,1 (Port 0) -> Host Copier 10
# Pin 1: Channels 2,3 (Port 1) -> Host Copier 11
# ===========================================================================
Object.Pipeline.dai-copier-be [
	{
		direction	"capture"
		format		$FORMAT
		rate		48000
		rate_min	48000
		rate_max	48000
		index		2

		Object.Widget.dai-copier.1 {
			dai_index		$DMIC_DAI_INDEX
			type			"dai_out"
			dai_type		"DMIC"
			copier_type		"DMIC"
			stream_name		$DMIC_NAME
			direction		"capture"
			node_type		$DMIC_LINK_INPUT_CLASS
			num_output_pins		2
			num_input_audio_formats	1
			num_output_audio_formats 2

			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_channels		4
					in_ch_cfg		$CHANNEL_CONFIG_3_POINT_1
					in_ch_map		$CHANNEL_MAP_3_POINT_1
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		48000
					out_channels		2
					out_ch_cfg		$CHANNEL_CONFIG_STEREO
					out_ch_map		$CHANNEL_MAP_STEREO
					out_bit_depth		32
					out_valid_bit_depth	32
				}
				{
					out_rate		48000
					out_channels		2
					out_ch_cfg		$CHANNEL_CONFIG_STEREO
					out_ch_map		0xFFFFFF32
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "host-copier.10.capture"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "host-copier.11.capture"
			}
		}
	}
]

Object.Widget.virtual [
	{ name "codec0_in"  type input  index 1 }
	{ name "codec1_in"  type input  index 2 }
	{ name "codec0_out" type output index 3 }
	{ name "codec1_out" type output index 4 }
	{ name "codec2_in"  type input  index 5 }
	{ name "codec2_out" type output index 6 }
	{ name "iDisp1_out" type output index 7 }
	{ name "iDisp2_out" type output index 8 }
	{ name "iDisp3_out" type output index 9 }
	{ name "iDisp3 Tx"             type out_drv index 0 }
	{ name "iDisp2 Tx"             type out_drv index 1 }
	{ name "iDisp1 Tx"             type out_drv index 2 }
	{ name "Analog CPU Playback"   type out_drv index 3 }
	{ name "Digital CPU Playback"  type out_drv index 4 }
	{ name "Alt Analog CPU Playback" type out_drv index 5 }
	{ name "Analog CPU Capture"    type input   index 6 }
	{ name "Digital CPU Capture"   type input   index 7 }
	{ name "Alt Analog CPU Capture" type input  index 8 }
]

Object.Base.route [
	{
		source "dai-copier.DMIC.$DMIC_NAME.capture"
		sink "host-copier.$DMIC0_PCM_ID.capture"
	}
	{
		source "dai-copier.DMIC.$DMIC_NAME.capture"
		sink "host-copier.$DMIC1_PCM_ID.capture"
	}
]

Object.Dai.DMIC [
	{
		name			$DMIC_NAME
		dai_index		$DMIC_DAI_INDEX
		id			6
		driver_version		1
		io_clk			38400000
		sample_rate		48000
		clk_min			500000
		clk_max			4800000
		unmute_ramp_time_ms	200
		num_pdm_active		2

		Object.Base.hw_config.1 {
			id	0
			name	"DMIC0"
		}

		Object.Base.pdm_config.1 {
			ctrl_id		0
			mic_a_enable	1
			mic_b_enable	1
		}
		Object.Base.pdm_config.2 {
			ctrl_id		1
			mic_a_enable	1
			mic_b_enable	1
		}
	}
]

Object.Base.manifest.1 {
	name "sof_manifest"
	Object.Base.data.1 {
		name "SOF ABI"
		bytes "0x03,0x00,0x1d,0x00,0x01,0x00"
	}
}

Object.PCM.pcm."$DMIC0_PCM_ID" {
	name	"DMIC0 48k 2ch"
	id	$DMIC0_PCM_ID
	direction "capture"
	Object.Base.fe_dai."$DMIC0_PCM_CAPS" {}
	Object.PCM.pcm_caps."capture" {
		name		$DMIC0_PCM_CAPS
		formats		"S32_LE,S16_LE"
		rates		"48000"
		channels_min	2
		channels_max	2
	}
}

Object.PCM.pcm."$DMIC1_PCM_ID" {
	name	"DMIC1 48k 2ch"
	id	$DMIC1_PCM_ID
	direction "capture"
	Object.Base.fe_dai."$DMIC1_PCM_CAPS" {}
	Object.PCM.pcm_caps."capture" {
		name		$DMIC1_PCM_CAPS
		formats		"S32_LE,S16_LE"
		rates		"48000"
		channels_min	2
		channels_max	2
	}
}
