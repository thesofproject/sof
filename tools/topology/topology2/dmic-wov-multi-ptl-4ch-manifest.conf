# ---------------------------------------------------------------------------
# Pipeline 100 — DAI Capture (Core 0, LL 1ms)
# DMIC DAI copier (16k 4ch in -> 16k 4ch out) -> Mixin.100.1
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      100
		format     $FORMAT
		rate       16000

		Object.Widget.dai-copier.1 {
			dai_index   $DMIC_DAI_INDEX
			type        "dai_out"
			dai_type    "DMIC"
			copier_type "DMIC"
			stream_name $DMIC_NAME
			direction   "capture"
			node_type   $DMIC_LINK_INPUT_CLASS

			num_input_pins           1
			num_output_pins          1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate            16000
					in_channels        4
					in_bit_depth       32
					in_valid_bit_depth 32
					in_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					in_ch_map          $CHANNEL_MAP_3_POINT_1
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        4
					out_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					out_ch_map          $CHANNEL_MAP_3_POINT_1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.mixin.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         4
					in_ch_cfg           $CHANNEL_CONFIG_3_POINT_1
					in_ch_map           $CHANNEL_MAP_3_POINT_1
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        4
					out_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					out_ch_map          $CHANNEL_MAP_3_POINT_1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   0
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 105 — ECNS DP Pipeline (Core 0, 20ms DP, Static)
# Mixout.105.1 -> ECNS.105.1
# Output Pin 0: Ch 0 mono (16k) -> Mixin.105.1 ("KPB mixin")
# Output Pin 1: Ch 0,1 stereo (16k) -> Mixin.105.2 ("Host mixin")
# ---------------------------------------------------------------------------
Object.Pipeline."custom-dp-capture" [
	{
		index      105
		format     $FORMAT
		rate       16000

		Object.Widget.mixout.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         4
					in_ch_cfg           $CHANNEL_CONFIG_3_POINT_1
					in_ch_map           $CHANNEL_MAP_3_POINT_1
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        4
					out_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					out_ch_map          $CHANNEL_MAP_3_POINT_1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.ecns.1 {
			uuid $ECNS_UUID
			num_input_pins  1
			num_output_pins 2
			num_input_audio_formats  1
			num_output_audio_formats 2

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         4
					in_ch_cfg           $CHANNEL_CONFIG_3_POINT_1
					in_ch_map           $CHANNEL_MAP_3_POINT_1
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 2560
				}
			]
			Object.Base.output_audio_format [
				# Pin 0: Ch 0 mono clean to KPB mixin
				{
					output_pin_index    0
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 640
				}
				# Pin 1: Ch 0,1 stereo clean to Host mixin
				{
					output_pin_index    1
					out_rate            16000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 1280
				}
			]
		}

		# Mixin 105.1: Mono clean output (Pin 0) to KPB
		Object.Widget.mixin.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		# Mixin 105.2: Stereo clean output (Pin 1) to Host Copier
		Object.Widget.mixin.2 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   1
			core_id   0
		}
	}
]

