# ---------------------------------------------------------------------------
# Custom dynamic pipeline classes
# ---------------------------------------------------------------------------
Class.Pipeline."custom-capture" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  0
	}

	direction        "capture"
	time_domain      "timer"
	dynamic_pipeline 1
}

Class.Pipeline."custom-dp-capture" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  1
	}

	direction        "capture"
	time_domain      "timer"
	dynamic_pipeline 1
}

