# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------
Object.Base.route [
	# DMIC 4ch capture to ECNS
	{ source "dai-copier.DMIC.$DMIC_NAME.capture" sink "mixin.100.1" }
	{ source "mixin.100.1"                        sink "mixout.105.1" }
	{ source "mixout.105.1"                       sink "ecns.105.1" }

	# ECNS Output Pin 0 (mono) to KPB mixin
	{ source "ecns.105.1"                         sink "mixin.105.1" }
	{ source "mixin.105.1"                        sink "mixout.106.1" }
	{ source "mixout.106.1"                       sink "kpb.106.1" }
	{ source "kpb.106.1"                          sink "mixin.106.1" }

	# ECNS Output Pin 1 (stereo) to Host Copier 10
	{ source "ecns.105.1"                         sink "mixin.105.2" }
	{ source "mixin.105.2"                        sink "mixout.107.1" }
	{ source "mixout.107.1"                       sink "host-copier.$ECNS_PCM_ID.capture" }

	# KPB mixin fanning out to 3 WOV detector slots (MFCC + MWW -> WOV Arbiter)
	{ source "mixin.106.1"                        sink "mixout.101.1" }
	{ source "mixout.101.1"                       sink "mfcc.101.1" }
	{ source "mfcc.101.1"                         sink "mww.101.1" }
	{ source "mww.101.1"                          sink "wov-arbiter.104.1" }

	{ source "mixin.106.1"                        sink "mixout.102.1" }
	{ source "mixout.102.1"                       sink "mfcc.102.1" }
	{ source "mfcc.102.1"                         sink "mww.102.1" }
	{ source "mww.102.1"                          sink "wov-arbiter.104.1" }

	{ source "mixin.106.1"                        sink "mixout.103.1" }
	{ source "mixout.103.1"                       sink "mfcc.103.1" }
	{ source "mfcc.103.1"                         sink "mww.103.1" }
	{ source "mww.103.1"                          sink "wov-arbiter.104.1" }

	# WOV Arbiter output to Host Copier 11
	{ source "wov-arbiter.104.1"                  sink "host-copier.$DMIC_PCM_ID.capture" }
]

