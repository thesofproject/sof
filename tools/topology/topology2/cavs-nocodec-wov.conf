Class.Pipeline."custom-capture" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  0
	}

	period           1000
	direction        "capture"
	time_domain      "timer"
	dynamic_pipeline 1
}

# ---------------------------------------------------------------------------
# Default parameters
# ---------------------------------------------------------------------------
Define {
	MCLK				24576000
	PLATFORM			"ptl"
	# PCAN-normalized 8-bit Mel features by default; set MWW_PCAN=false
	# for the classic 32-bit Mel path.
	MWW_PCAN			"true"

	WOV_ARBITER_UUID		"7d:6c:5b:4a:9f:8e:1b:4a:2c:3d:4e:5f:60:71:82:93"

	# Playback (passthrough)
	SSP0_PLAYBACK_PCM_ID		0
	SSP0_PLAYBACK_HOST_PIPELINE_ID	1
	SSP0_PLAYBACK_DAI_PIPELINE_ID	2

	# Capture DAI feeding the Wake-on-Voice branch
	SSP0_CAPTURE_DAI_PIPELINE_ID	3

	# Wake-on-Voice branch pipeline IDs (aligning with sdw-dmic-wov-single.conf)
	WOV_SLOT0_PIPELINE_ID		111
	WOV_ARB_PIPELINE_ID		114
	WOV_KPB_PIPELINE_ID		116

	WOV_CORE_ID			0
	KWD_CPC				100000
	WOV_ARB_CPC			20000
	KPB_BUFF_TIME_MS		"2000"

	# WoV Capture PCM definitions
	SSP0_WOV_PCM_NAME		"Microphone WoV"
	SSP0_WOV_PCM_ID			12
	SSP0_WOV_PCM_CAPS		"Gain Capture 12"
	SSP0_WOV_FORMAT			"s16le"

	# Control names
	SSP0_WOV_MICSEL_BYTES_NAME	"SSP0 WoV Micsel bytes"
	SSP0_WOV_MFCC_BYTES_NAME	"Microphone MFCC bytes"
	SSP0_WOV_MFCC_VAD_NAME		"Microphone MFCC VAD"
	SSP0_WOV_MWW_BYTES_NAME		"Microphone MWW bytes"
	SSP0_WOV_MWW_SCORE_NAME		"Microphone MWW Score"
	SSP0_WOV_PHRASE_DETECT_ID_NAME	"DMIC Phrase Detect ID"
}

IncludeByKey.MWW_PCAN {
	"true" {
		Define {
			MFCC_FRAME_BYTES 64
			MWW_INPUT_BYTES 64
		}
	}
	"false" {
		Define {
			MFCC_FRAME_BYTES 184
			MWW_INPUT_BYTES 184
		}
	}
}

# override defaults with platform-specific config
IncludeByKey.PLATFORM {
	"tgl"	"platform/intel/tgl.conf"
	"adl"	"platform/intel/tgl.conf"
	"mtl"	"platform/intel/mtl.conf"
	"lnl"	"platform/intel/lnl.conf"
	"ptl"	"platform/intel/ptl.conf"
	"nvl"	"platform/intel/ptl.conf"
}

#
# SSP0 DAI (duplex) with loopback mode (LBM)
#
Object.Dai.SSP [
	{
		id			0
		dai_index		0
		direction		"duplex"
		name			NoCodec-0
		default_hw_conf_id	0
		sample_bits		32
		quirks			"lbm_mode"
		io_clk			$MCLK

		Object.Base.hw_config.1 {
			name		"SSP0"
			id		0
			fsync_freq	48000
			bclk_freq	3072000
			tdm_slot_width	32
			# TODO: remove this. Needs alsaptlg change.
			Object.Base.link_config.1 {
				clock_source	1
			}
		}
	}
]

#
# Playback: host -> dai (passthrough)
#
Object.Pipeline.host-gateway-playback [
	{
		index	$SSP0_PLAYBACK_HOST_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name	'SSP0 Playback'
			pcm_id		$SSP0_PLAYBACK_PCM_ID
			num_input_audio_formats 2
			Object.Base.input_audio_format [
				{
					in_channels		2
					in_ch_cfg		$CHANNEL_CONFIG_STEREO
					in_ch_map		$CHANNEL_MAP_STEREO
					in_rate			$SSP0_RATE
					in_bit_depth		16
					in_valid_bit_depth	16
				}
				{
					in_channels		2
					in_ch_cfg		$CHANNEL_CONFIG_STEREO
					in_ch_map		$CHANNEL_MAP_STEREO
					in_rate			$SSP0_RATE
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_channels		2
					out_ch_cfg		$CHANNEL_CONFIG_STEREO
					out_ch_map		$CHANNEL_MAP_STEREO
					out_rate		$SSP0_RATE
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

Object.Pipeline.io-gateway [
	{
		index		$SSP0_PLAYBACK_DAI_PIPELINE_ID
		direction	playback

		Object.Widget.dai-copier.1 {
			dai_index	0
			dai_type	"SSP"
			copier_type	"SSP"
			stream_name	"NoCodec-0"
			node_type	$I2S_LINK_OUTPUT_CLASS
			num_input_pins	1
			num_input_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			$SSP0_RATE
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_rate		$SSP0_RATE
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

#
# Capture DAI feeding the Wake-on-Voice branch
#
Object.Pipeline.io-gateway-capture [
	{
		index		$SSP0_CAPTURE_DAI_PIPELINE_ID
		direction	capture

		Object.Widget.dai-copier.1 {
			dai_index	0
			dai_type	"SSP"
			type		dai_out
			copier_type	"SSP"
			stream_name	"NoCodec-0"
			node_type	$I2S_LINK_INPUT_CLASS
			num_input_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels		2
					in_rate			$SSP0_RATE
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_channels		2
					out_rate		$SSP0_RATE
					out_bit_depth		16
					out_valid_bit_depth	16
				}
			]
		}
	}
]

#
# Pipeline 116 — Micsel (stereo -> mono), SRC (48k -> 16k), KPB (Core 0, LL 1ms)
# Splits from SSP0 capture DAI. KPB sel_sink feeds module-copier.111.1 and
# host_sink feeds wov-arbiter.114.1, both cross-pipeline.
#
Object.Pipeline."custom-capture" [
	{
		index      $WOV_KPB_PIPELINE_ID
		format     "s16le"
		rate       16000

		Object.Widget.micsel.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Control {
				bytes."1" {
					name $SSP0_WOV_MICSEL_BYTES_NAME
					<include/components/micsel/downmix_stereo_to_mono.conf>
				}
			}

			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            48000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.src.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.kpb.1 {
			history_depth_ms $KPB_BUFF_TIME_MS
			num_input_pins  1
			num_output_pins 2
			num_input_audio_formats  1
			num_output_audio_formats 2

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 32
				}
			]
			Object.Base.output_audio_format [
				# Pin 0: real-time feed to the detector slots
				{
					output_pin_index    0
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 32
				}
				# Pin 1: drain path to the WOV arbiter
				{
					output_pin_index    1
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 32
				}
			]

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "module-copier.$WOV_SLOT0_PIPELINE_ID.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "wov-arbiter.$WOV_ARB_PIPELINE_ID.1"
			}
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

#
# Pipeline 111 — Slot 0 microWakeWord Detector (Core 0, DP 10ms)
#
Object.Pipeline."custom-capture" [
	{
		index      $WOV_SLOT0_PIPELINE_ID
		format     "s16le"
		rate       16000

		Object.Widget.module-copier.1 {
			# Pass-through 16-bit audio from KPB to MFCC
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 32
				}
			]
		}

		Object.Widget.mfcc.1 {
			scheduler_domain "DP"
			domain_id        0
			core_id          $WOV_CORE_ID
			stack_bytes_requirement 8192
			heap_bytes_requirement  24576
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Control {
				bytes."1" {
					name $SSP0_WOV_MFCC_BYTES_NAME
					IncludeByKey.MWW_PCAN {
						"true"  "include/components/mfcc/mel40_10ms_pcan_compress.conf"
						"false" "include/components/mfcc/mel40_10ms_compress.conf"
					}
				}
				mixer."1" {
					name $SSP0_WOV_MFCC_VAD_NAME
				}
			}

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 320
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 $MFCC_FRAME_BYTES
				}
			]
		}

		Object.Widget.mww.1 {
			scheduler_domain "DP"
			domain_id        0
			core_id          $WOV_CORE_ID
			stack_bytes_requirement 8192
			heap_bytes_requirement  24576
			num_input_pins   1
			num_output_pins  1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Control {
				bytes."1" {
					name $SSP0_WOV_MWW_BYTES_NAME
					max  65536
				}
				bytes."2" {
					name $SSP0_WOV_MWW_SCORE_NAME
					max  512
				}
			}

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $MWW_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 $MWW_INPUT_BYTES
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

#
# Pipeline 114 — WOV Arbiter & Host Copier 12 (Core 0, Mono Output)
#
Object.Pipeline."custom-capture" [
	{
		index      $WOV_ARB_PIPELINE_ID
		format     $SSP0_WOV_FORMAT
		rate       16000

		Object.Widget.wov-arbiter.1 {
			uuid $WOV_ARBITER_UUID
			num_input_pins  2
			num_output_pins 1
			num_input_audio_formats  2
			num_output_audio_formats 1

			Object.Control.enum."1" {
				name $SSP0_WOV_PHRASE_DETECT_ID_NAME
			}

			Object.Base.input_pin_binding.1 {
				input_pin_binding_name "kpb.116.1"
			}
			Object.Base.input_pin_binding.2 {
				input_pin_binding_name "mww.111.1"
			}

			Object.Base.input_audio_format [
				# Pin 0: Audio from KPB host_sink (16-bit PCM, 16kHz mono)
				{
					input_pin_index     0
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 32
				}
				# Pin 1: Features from MWW slot 0 (8-bit PCAN, 16kHz mono)
				{
					input_pin_index     1
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $MWW_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 32
				}
			]
		}

		Object.Widget.host-copier.1 {
			stream_name $SSP0_WOV_PCM_CAPS
			pcm_id      $SSP0_WOV_PCM_ID
			node_type   $HDA_HOST_INPUT_CLASS
			direction   "capture"
			type        "aif_out"
			num_input_pins 1

			# IPC4 reads SOF_TKN_STREAM_CAPTURE_COMPATIBLE_D0I3 from the
			# host-copier widget tuples for low-power D0i3 WoV capture across S0iX
			capture_compatible_d0i3 true

			num_input_audio_formats  1
			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]

			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

#
# Routes
#
Object.Base.route [
	# Playback: host -> dai
	{
		source	"host-copier.$SSP0_PLAYBACK_PCM_ID.playback"
		sink	"dai-copier.SSP.NoCodec-0.playback"
	}
	# Capture: SSP0 DAI -> micsel
	{
		source	"dai-copier.SSP.NoCodec-0.capture"
		sink	"micsel.$WOV_KPB_PIPELINE_ID.1"
	}
	{ source "micsel.$WOV_KPB_PIPELINE_ID.1"                 sink "src.$WOV_KPB_PIPELINE_ID.1" }
	{ source "src.$WOV_KPB_PIPELINE_ID.1"                    sink "kpb.$WOV_KPB_PIPELINE_ID.1" }

	# KPB Output Pin 0 (16k mono 16-bit) direct to Detector Copier (pipeline 111)
	{ source "kpb.$WOV_KPB_PIPELINE_ID.1"                   sink "module-copier.$WOV_SLOT0_PIPELINE_ID.1" }

	# Audio path from KPB host_sink (pin 1) to WOV Arbiter audio input (pin 0)
	{ source "kpb.$WOV_KPB_PIPELINE_ID.1"                   sink "wov-arbiter.$WOV_ARB_PIPELINE_ID.1" }

	# Detector slot pipeline 111: copier -> MFCC -> MWW -> WOV Arbiter pin 1
	{ source "module-copier.$WOV_SLOT0_PIPELINE_ID.1"         sink "mfcc.$WOV_SLOT0_PIPELINE_ID.1" }
	{ source "mfcc.$WOV_SLOT0_PIPELINE_ID.1"                  sink "mww.$WOV_SLOT0_PIPELINE_ID.1" }
	{ source "mww.$WOV_SLOT0_PIPELINE_ID.1"                   sink "wov-arbiter.$WOV_ARB_PIPELINE_ID.1" }

	# WOV Arbiter output to Host Copier
	{ source "wov-arbiter.$WOV_ARB_PIPELINE_ID.1"           sink "host-copier.$SSP0_WOV_PCM_ID.capture" }
]

#
# PCM Definitions:
# PCM 0: SSP0 Passthrough Playback (48 kHz)
# PCM 12: WOV Arbiter Mono Capture (16 kHz)
#
Object.PCM.pcm [
	{
		name		"Port0"
		id		$SSP0_PLAYBACK_PCM_ID
		direction	"playback"

		Object.Base.fe_dai.1 {
			name	"Port0"
		}

		Object.PCM.pcm_caps.1 {
			name		"SSP0 Playback"
			formats		'S16_LE,S32_LE'
			rates		'48000'
			channels_min	2
			channels_max	2
		}
	}
	{
		name		$SSP0_WOV_PCM_NAME
		id		$SSP0_WOV_PCM_ID
		direction	"capture"
		capture_compatible_d0i3 true

		Object.Base.fe_dai.1 {
			name	"$SSP0_WOV_PCM_CAPS"
		}

		Object.PCM.pcm_caps.1 {
