# SPDX-License-Identifier: BSD-3-Clause
#
# Lean NoCodec (SSP0) topology for microWakeWord (MWW) bring-up on PTL / TGL.
#
# Playback (passthrough):
#   PCM0 "Port0" -> host-copier -> dai-copier -> SSP0 (with LBM loopback mode)
#
# Capture (Wake-on-Voice with WOV Arbiter):
#   SSP0 (LBM loopback) -> dai-copier (48kHz 2ch S16_LE) ->
#   micsel (stereo -> mono 48kHz 16-bit) ->
#   SRC (48kHz -> 16kHz mono 16-bit) ->
#   KPB (2000ms 16kHz mono 16-bit) ->
#     pin 0 -> detector copier (16-bit -> 16-bit) ->
#              MFCC (Mel-40 10ms) ->
#              microWakeWord (MWW) ->
#              WOV Arbiter (pin 1)
#     pin 1 -> WOV Arbiter (pin 0, 16-bit) ->
#              host-copier -> PCM 12 (D0i3-compatible, S16_LE)
#
# Everything the base cavs-nocodec.conf carries for codecs, DMIC, mixers,
# gain, smart-amp and deep buffer is intentionally dropped.

<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/dais>
<searchdir:include/pipelines>
<searchdir:include/pipelines/cavs>
<searchdir:platform>
<searchdir:platform/intel>
<searchdir:include/controls>

<vendor-token.conf>
<tokens.conf>
<virtual.conf>
<output_pin_binding.conf>
<input_pin_binding.conf>
<host-gateway-playback.conf>
<host-gateway-capture.conf>
<io-gateway.conf>
<io-gateway-capture.conf>
<dai-copier.conf>
<host-copier.conf>
<module-copier.conf>
<pipeline.conf>
<dai.conf>
<host.conf>
<kpb.conf>
<wov-arbiter.conf>
<micsel.conf>
<src.conf>
<mfcc.conf>
<mww.conf>
<bytes.conf>
<enum.conf>
<mixer.conf>
<data.conf>
<pcm.conf>
<pcm_caps.conf>
