# hw_config for i.MX DAIs (SAI/ESAI/MICFIL): carries the DAI format and
# clock providers, which the kernel applies as the BE link dai_fmt.
#
# Object.Base.hw_config.1 {
# 	name		"SAI3"
# 	id		0
# 	format		"I2S"
# 	mclk		"codec_mclk_in"
# 	mclk_freq	12288000
# 	bclk		"codec_provider"
# 	bclk_freq	3072000
# 	fsync		"codec_provider"
# 	fsync_freq	48000
# 	tdm_slots	2
# 	tdm_slot_width	32
# 	tx_slots	3
# 	rx_slots	3
# }

Class.Base."hw_config" {
	#
	# Argument used to construct hw config (hw config ID)
	#
	DefineAttribute."id" {}
	DefineAttribute."instance" {}

	DefineAttribute."name" {
		type	"string"
	}

	DefineAttribute."format" {
		type	"string"
		constraints {
			!valid_values [
				"I2S"
				"DSP_A"
				"DSP_B"
			]
		}
	}

	# mclk direction: "codec_mclk_in" (SoC outputs MCLK to codec) or
	# "codec_mclk_out"
	DefineAttribute."mclk" {
		type	"string"
	}

	DefineAttribute."mclk_freq" {}

	# bclk provider: "codec_provider" or "codec_consumer"
	DefineAttribute."bclk" {
		type	"string"
	}

	DefineAttribute."bclk_freq" {}

	# fsync provider: "codec_provider" or "codec_consumer"
	DefineAttribute."fsync" {
		type	"string"
	}

	DefineAttribute."fsync_freq" {}

	DefineAttribute."tdm_slots" {}

	DefineAttribute."tdm_slot_width" {}

	DefineAttribute."tx_slots" {}

	DefineAttribute."rx_slots" {}

	attributes {
		!constructor [
			"id"
		]
		!mandatory [
			"name"
		]
		#
		# hw_config objects instantiated within the same alsaconf node must
		# have unique 'instance' attribute
		unique	"instance"
	}
}
