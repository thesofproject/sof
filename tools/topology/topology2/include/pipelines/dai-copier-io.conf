#
# DAI-only pipeline: a dai-copier with its own scheduler (e.g. i.MX SAI).
#
# Set dai_index/dai_type/copier_type/stream_name/node_type only at the
# instantiation site; anything else makes alsatplg drop the uuid tuple.
#
# Usage:
#
# Object.Pipeline.dai-copier-io-playback."N" {
# 	Object.Widget.dai-copier.1 {
# 		dai_index	$SAI_DAI_INDEX
# 		dai_type	"SAI"
# 		copier_type	"SAI"
# 		stream_name	$STREAM_CODEC_NAME
# 		node_type	$SAI_LINK_OUTPUT_CLASS
# 	}
# }
#
# Where N is the unique pipeline ID within the same alsaconf node.
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/dai-copier.conf>
<include/components/pipeline.conf>

Class.Pipeline."dai-copier-io-playback" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		dai-copier."1" {
			type				dai_in
			direction			"playback"
			num_input_audio_formats	1
			num_output_audio_formats	1
			num_input_pins			1

			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	dynamic_pipeline 1
	time_domain	"timer"
}

Class.Pipeline."dai-copier-io-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		dai-copier."1" {
			type				dai_out
			direction			"capture"
			num_input_audio_formats	1
			num_output_audio_formats	1
			num_output_pins			1

			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	dynamic_pipeline 1
	time_domain	"timer"
}
