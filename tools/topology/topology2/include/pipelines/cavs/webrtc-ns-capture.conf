#
# cAVS webrtc-hpf + webrtc-vad + webrtc-ns + webrtc-agc capture pipeline
#
# DAI-copier → webrtc-hpf → webrtc-vad → webrtc-ns → webrtc-agc → module-copier → host
#
# webrtc-hpf removes DC offset and sub-80 Hz rumble first.
# webrtc-vad runs next so the VAD event fires on high-passed mic audio.
# webrtc-ns removes stationary noise, and webrtc-agc normalizes speech
# levels before the host receives the stream.
#
# Usage:
#   Object.Pipeline.webrtc-ns-capture."N" {
#       format    "s16le"
#       period    1000
#       time_domain "timer"
#   }
#

<include/components/dai-copier.conf>
<include/components/pipeline.conf>
<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/webrtc-hpf.conf>
<include/components/webrtc-vad.conf>
<include/components/webrtc-ns.conf>
<include/components/webrtc-agc.conf>
<include/components/module-copier.conf>

Class.Pipeline."webrtc-ns-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		!immutable [
			"direction"
		]

		unique	"instance"
	}

	Object.Widget {
		pipeline."1" {
			priority	0
			lp_mode		0
			direction	"capture"
		}

		# DAI → S32 on capture; convert to S16 for NS processing
		module-copier."1" {
			period_sink_count   1
			period_source_count 1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			16000
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		16000
					out_bit_depth		16
					out_valid_bit_depth	16
				}
			]
		}

		# HPF: 2nd-order Butterworth high-pass filter (<80 Hz rejection)
		webrtc-hpf."1" {
			Object.Control.mixer.1 {
				name 'WebRTC HPF Switch'
			}
		}

		# VAD: pass-through + VAD event
		webrtc-vad."1" {
		}

		# NS: spectral noise reduction
		webrtc-ns."1" {
		}

		# AGC: digital automatic gain control + saturation limiter
		webrtc-agc."1" {
			Object.Control.mixer.1 {
				name 'WebRTC AGC Switch'
			}
		}

		# Output copier: S16 → S32 for host
		module-copier."2" {
			period_sink_count   1
			period_source_count 1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			16000
					in_bit_depth		16
					in_valid_bit_depth	16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		16000
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}

	Object.Base {
		route.1 {
			source	module-copier.$index.1
			sink	webrtc-hpf.$index.1
		}
		route.2 {
			source	webrtc-hpf.$index.1
			sink	webrtc-vad.$index.1
		}
		route.3 {
			source	webrtc-vad.$index.1
			sink	webrtc-ns.$index.1
		}
		route.4 {
			source	webrtc-ns.$index.1
			sink	webrtc-agc.$index.1
		}
		route.5 {
			source	webrtc-agc.$index.1
			sink	module-copier.$index.2
		}
	}

	direction	"capture"
	dynamic_pipeline 1
	time_domain	"timer"
}
