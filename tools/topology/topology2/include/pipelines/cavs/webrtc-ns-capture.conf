#
# cAVS webrtc-vad + webrtc-ns capture pipeline
#
# DAI-copier → webrtc-vad → webrtc-ns → module-copier → host
#
# webrtc-vad runs first so the VAD event fires on unprocessed mic audio.
# webrtc-ns follows to remove stationary noise before the host receives it.
# Either module can be omitted by editing routes; the component confs are
# independent and can be used separately.
#
# Usage:
#   Object.Pipeline.webrtc-ns-capture."N" {
#       format    "s16le"
#       period    1000
#       time_domain "timer"
#   }
#

<include/components/dai-copier.conf>
<include/components/pipeline.conf>
<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/webrtc-vad.conf>
<include/components/webrtc-ns.conf>
<include/components/module-copier.conf>

Class.Pipeline."webrtc-ns-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		!immutable [
			"direction"
		]

		unique	"instance"
	}

	Object.Widget {
		pipeline."1" {
			priority	0
			lp_mode		0
		}

		# DAI → S32 on capture; convert to S16 for NS processing
		module-copier."1" {
			period_sink_count   1
			period_source_count 1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		16
					out_valid_bit_depth	16
				}
			]
		}

		# VAD: pass-through + VAD event
		webrtc-vad."1" {
			index	$index
		}

		# NS: spectral noise reduction
		webrtc-ns."1" {
			index	$index
		}

		# Output copier: S16 → S32 for host
		module-copier."2" {
			period_sink_count   1
			period_source_count 1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		16
					in_valid_bit_depth	16
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}

	Object.Base {
		route.1 {
			source	module-copier.$index.1
			sink	webrtc-vad.$index.1
		}
		route.2 {
			source	webrtc-vad.$index.1
			sink	webrtc-ns.$index.1
		}
		route.3 {
			source	webrtc-ns.$index.1
			sink	module-copier.$index.2
		}
	}

	direction	"capture"
	dynamic_pipeline 1
	time_domain	"timer"
}
