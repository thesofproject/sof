#
# Micsel-MFCC-MWW capture detection pipeline
#
# This class provides a detection pipeline that first uses micsel to convert
# a 16 kHz stereo capture stream into a stereo double-mono stream (both
# channels carrying the same audio content), then feeds it into MFCC for
# feature extraction (10ms hop / 40 mel bins) and microWakeWord (MWW) for
# streaming keyword spotting. The final frames are delivered to the host
# over a stereo double-mono aif_out so the topology remains compatible
# with capture PCMs that require stereo.
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/pipeline.conf>
<include/components/micsel.conf>
<include/components/mfcc.conf>
<include/components/mww.conf>
<include/components/host-copier.conf>

Define {
	# 10 ms FFT hop at 16 kHz, 2 ch, s32: 160 samples * 2 * 4 = 1280 B.
	MFCC_INPUT_BYTES 1280
	# MFCC compress output frame: 24-byte header + 40 mel bins * 4 bytes.
	MFCC_FRAME_BYTES 184
	# MWW expects one MFCC frame every 10 ms; wake it per-frame so it
	# stays in lock-step with MFCC instead of batching.
	MWW_INPUT_BYTES 184
	MWW_DETECT_CORE_ID 1
}

Class.Pipeline."host-gateway-micsel-mfcc-mww-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		host-copier."1" {
			type		"aif_out"
			core_id		$MWW_DETECT_CORE_ID
			node_type	$HDA_HOST_INPUT_CLASS
			stream_name	"HDA Mic MWW Detect"
			pcm_id		$index
			num_input_pins	1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		2
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		16000
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		2
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_rate 		16000
				}
			]
		}

		micsel."1" {
			core_id		$MWW_DETECT_CORE_ID
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		2
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		16000
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		2
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_rate 		16000
					out_ch_cfg 	$CHANNEL_CONFIG_DUAL_MONO
				}
			]
		}

		mfcc."1" {
			scheduler_domain "DP"
			core_id 	$MWW_DETECT_CORE_ID
			domain_id 	0
			stack_bytes_requirement 8192
			heap_bytes_requirement "$[(24 * 1024)]"
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		2
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		16000
					ibs 			$MFCC_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		2
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_rate 		16000
					obs 			$MFCC_FRAME_BYTES
				}
			]
		}

		# MWW is an audio pass-through: it copies each MFCC frame
		# from input to output unchanged and sends keyword detection
		# triggers out-of-band via AMS / KPB notifications. ibs/obs
		# are one MFCC frame so the DP thread wakes per 10 ms hop
		# and stays in lock-step with MFCC.
		mww."1" {
			scheduler_domain "DP"
			core_id 	$MWW_DETECT_CORE_ID
			domain_id 	0
			stack_bytes_requirement 8192
			heap_bytes_requirement "$[(24 * 1024)]"
			num_input_pins	1
			num_output_pins	1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		2
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		16000
					ibs 			$MWW_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		2
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_rate 		16000
					obs 			$MWW_INPUT_BYTES
				}
			]
		}

		pipeline."1" {
			priority 	0
			lp_mode 	0
			core 		$MWW_DETECT_CORE_ID
		}
	}

	Object.Base {
		!route [
			{
				source 	micsel.$index.1
				sink 	mfcc.$index.1
			}
			{
				source 	mfcc.$index.1
				sink 	mww.$index.1
			}
			{
				source 	mww.$index.1
				sink 	"host-copier.$index.capture"
			}
		]
	}

	direction 	"capture"
	dynamic_pipeline 1
	time_domain 	"timer"
}
