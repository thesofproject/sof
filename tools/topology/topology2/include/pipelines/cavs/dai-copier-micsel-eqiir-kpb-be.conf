# SPDX-License-Identifier: BSD-3-Clause
#
# BE capture pipeline: dai-copier-micsel-eqiir-kpb-be
#
# Taps a multi-channel DAI capture stream (e.g. 4-channel 16 kHz DMIC),
# downmixes to mono via micsel, filters via eqiir highpass filter, and
# buffers in KPB with dual sinks for Wake-on-Voice and keyword detection.
#
# All attributes defined herein are namespaced by alsatplg to
# "Object.Pipeline.dai-copier-micsel-eqiir-kpb-be.N.attribute_name"
#
# Usage:
#
# Object.Pipeline.dai-copier-micsel-eqiir-kpb-be."N" {
# 	period		1000
# 	time_domain	"timer"
# }
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/dai-copier.conf>
<include/components/micsel.conf>
<include/components/eqiir.conf>
<include/components/kpb.conf>
<include/components/pipeline.conf>
<include/controls/bytes.conf>

Class.Pipeline."dai-copier-micsel-eqiir-kpb-be" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		!immutable [
			"direction"
		]

		#
		# dai-copier-micsel-eqiir-kpb-be objects instantiated
		# within the same alsaconf node must have unique pipeline_id
		# attribute
		#
		unique	"instance"
	}

	Object.Widget {
		dai-copier."1" {
			type dai_out
			dai_type "DMIC"
			copier_type "DMIC"
			node_type $DMIC_LINK_INPUT_CLASS
			stream_name $DMIC1_NAME
			num_input_audio_formats 3
			num_output_audio_formats 1
			num_output_pins 1

			Object.Base.input_audio_format [
				{
					in_rate			16000
					in_channels		4
					in_bit_depth		16
					in_valid_bit_depth	16
					in_ch_cfg		$CHANNEL_CONFIG_3_POINT_1
					in_ch_map		$CHANNEL_MAP_3_POINT_1
				}
				{
					in_rate			16000
					in_channels		4
					in_bit_depth		32
					in_valid_bit_depth	24
					in_sample_type		$SAMPLE_TYPE_MSB_INTEGER
					in_ch_cfg		$CHANNEL_CONFIG_3_POINT_1
					in_ch_map		$CHANNEL_MAP_3_POINT_1
				}
				{
					in_rate			16000
					in_channels		4
					in_bit_depth		32
					in_valid_bit_depth	32
					in_ch_cfg		$CHANNEL_CONFIG_3_POINT_1
					in_ch_map		$CHANNEL_MAP_3_POINT_1
				}
			]

			Object.Base.output_audio_format [
				{
					out_rate		16000
					out_channels		4
					out_bit_depth		32
					out_valid_bit_depth	32
					out_ch_cfg		$CHANNEL_CONFIG_3_POINT_1
					out_ch_map		$CHANNEL_MAP_3_POINT_1
				}
			]
		}

		micsel."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate			16000
					in_channels		4
					in_bit_depth		32
					in_valid_bit_depth	32
					in_ch_cfg		$CHANNEL_CONFIG_3_POINT_1
					in_ch_map		$CHANNEL_MAP_3_POINT_1
				}
			]

			Object.Base.output_audio_format [
				{
					out_rate		16000
					out_channels		1
					out_bit_depth		32
					out_valid_bit_depth	32
					out_ch_cfg		$CHANNEL_CONFIG_MONO
					out_ch_map		$CHANNEL_MAP_MONO
				}
			]
		}

		eqiir."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate			16000
					in_channels		1
					in_bit_depth		32
					in_valid_bit_depth	32
					in_ch_cfg		$CHANNEL_CONFIG_MONO
					in_ch_map		$CHANNEL_MAP_MONO
				}
			]

			Object.Base.output_audio_format [
				{
					out_rate		16000
					out_channels		1
					out_bit_depth		32
					out_valid_bit_depth	32
					out_ch_cfg		$CHANNEL_CONFIG_MONO
					out_ch_map		$CHANNEL_MAP_MONO
				}
			]
		}

		kpb."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate			16000
					in_channels		1
					in_bit_depth		32
					in_valid_bit_depth	32
					in_ch_cfg		$CHANNEL_CONFIG_MONO
					in_ch_map		$CHANNEL_MAP_MONO
				}
			]

			Object.Base.output_audio_format [
				{
					out_rate		16000
					out_channels		1
					out_bit_depth		32
					out_valid_bit_depth	32
					out_ch_cfg		$CHANNEL_CONFIG_MONO
					out_ch_map		$CHANNEL_MAP_MONO
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	direction	"capture"
	time_domain	"timer"
	dynamic_pipeline 1
}
