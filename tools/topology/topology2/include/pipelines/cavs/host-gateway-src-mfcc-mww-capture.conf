#
# SRC-MFCC-MWW capture detection pipeline
#
# This class provides detection pipeline for capture with MFCC feature extraction
# fed to the microWakeWord (mww) TFLM keyword-spotting module.
#
# Uses mel40_10ms.conf, matching microWakeWord's native MixConv front-end
# shape: 40 mel-log features per 10ms stride over a 30ms window (see plan
# Stage 5). Stage 2's go/no-go hardware validation used the interim
# mel40_compress.conf (20ms hop) profile before this blob existed.
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/pipeline.conf>
<include/components/src.conf>
<include/components/mfcc.conf>
<include/components/mww.conf>
<include/components/host-copier.conf>

Define {
	MFCC_FRAME_BYTES 184
	MWW_DETECT_CORE_ID 1
}

Class.Pipeline."host-gateway-src-mfcc-mww-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		host-copier."1" {
			type		"aif_out"
			node_type	$HDA_HOST_INPUT_CLASS
			stream_name	"HDA Mic MWW Detect"
			pcm_id		$index
			num_input_pins	1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
				in_channels		1
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			16000
				}
			]
			Object.Base.output_audio_format [
				{
				out_channels		1
					out_bit_depth		32
					out_valid_bit_depth	32
					out_rate		16000
				}
			]
		}

		src."1" {
			num_input_pins 1
			num_output_pins 1
			num_input_audio_formats 4
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
				in_channels		1
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			16000
				}
				{
				in_channels		1
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			48000
				}
				{
				in_channels		1
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			96000
				}
				{
				in_channels		1
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			192000
				}
			]
			Object.Base.output_audio_format [
				{
				out_channels		1
					out_bit_depth		32
					out_valid_bit_depth	32
					out_rate		16000
				}
			]
		}

		mfcc."1" {
			Object.Control {
				bytes."1" {
					name "HDA Mic MWW MFCC bytes"
					IncludeByKey.HDA_MIC_MFCC_PARAMS {
						"default" "include/components/mfcc/mel40_10ms.conf"
					}
				}
				mixer."1" {
					name "HDA Mic MWW MFCC VAD"
				}
			}
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
				in_channels		1
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			16000
				}
			]
			Object.Base.output_audio_format [
				{
				out_channels		1
					out_bit_depth		32
					out_valid_bit_depth	32
					out_rate		16000
					obs			$MFCC_FRAME_BYTES
				}
			]
		}

		mww."1" {
			scheduler_domain "DP"
			core_id $MWW_DETECT_CORE_ID
			domain_id 0
			stack_bytes_requirement 8192
			heap_bytes_requirement "$[(24 * 1024)]"
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
				in_channels		1
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			16000
					ibs			$MFCC_FRAME_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
				out_channels		1
					out_bit_depth		32
					out_valid_bit_depth	32
					out_rate		16000
					obs			$MFCC_FRAME_BYTES
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
			core		$MWW_DETECT_CORE_ID
		}
	}

	Object.Base {
		!route [
			{
				source	src.$index.1
				sink	mfcc.$index.1
			}
			{
				source	mfcc.$index.1
				sink	mww.$index.1
			}
			{
				source	mww.$index.1
				sink	"host-copier.$index.capture"
			}
		]
	}

	direction	"capture"
	dynamic_pipeline 1
	time_domain	"timer"
}
