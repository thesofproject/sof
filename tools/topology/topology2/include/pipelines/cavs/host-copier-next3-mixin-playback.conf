#
# FE playback pipeline: host-copier-next3-mixin-playback
#
# Chained next 3 DSP offload modules:
# host-copier -> gain -> equalizer -> acompressor -> stereowiden -> mixin
#
# Usage:
# Object.Pipeline.host-copier-next3-mixin-playback."N" {
# 	period		1000
# 	time_domain	"timer"
# }
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/host-copier.conf>
<include/components/mixin.conf>
<include/components/pipeline.conf>
<include/components/gain.conf>
<include/components/equalizer.conf>
<include/components/acompressor.conf>
<include/components/stereowiden.conf>

Class.Pipeline."host-copier-next3-mixin-playback" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		!immutable [
			"direction"
		]

		unique	"instance"
	}

	Object.Widget {
		host-copier."1" {
			type	"aif_in"
			node_type $HDA_HOST_OUTPUT_CLASS
			num_input_audio_formats 3
			num_output_audio_formats 1
			num_output_pins 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		16
					in_valid_bit_depth	16
				}
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
				{
					in_bit_depth		32
					in_valid_bit_depth	24
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		gain."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1

			# 32-bit 48KHz 2ch
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		equalizer."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		acompressor."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		stereowiden."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		mixin."1" {}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	Object.Base.route [
		{
			source	gain.$index.1
			sink	equalizer.$index.1
		}
		{
			source	equalizer.$index.1
			sink	acompressor.$index.1
		}
		{
			source	acompressor.$index.1
			sink	stereowiden.$index.1
		}
		{
			source	stereowiden.$index.1
			sink	mixin.$index.1
		}
	]

	direction	"playback"
	dynamic_pipeline 1
	time_domain	"timer"
}
