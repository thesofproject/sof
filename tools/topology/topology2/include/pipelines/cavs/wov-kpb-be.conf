#
# KPB pipeline for multi-KPB WOV topology.
# No default DAI copier or internal routes — all widgets/routes defined
# by the manifest instance (mixout, kpb, wov-detect, output_pin_binding).
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/kpb.conf>
<include/components/virtual.conf>
<include/components/pipeline.conf>

Class.Pipeline."wov-kpb-be" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]


		unique	"instance"
	}

	Object.Widget {
		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	direction	"capture"
	dynamic_pipeline 1
	time_domain	"timer"
}
