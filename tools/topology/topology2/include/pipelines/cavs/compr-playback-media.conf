#
# FE playback pipeline: compr-playback-media
#
# Compress playback pipeline using the media_decoder container widget, which
# lists supported codec formats and their candidate module UUIDs.
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/common/media_format.conf>
<include/components/host-copier.conf>
<include/components/module-copier.conf>
<include/components/mixin.conf>
<include/components/pipeline.conf>
<include/components/gain.conf>
<include/components/media_decoder.conf>
<include/components/micsel.conf>
<include/components/src.conf>

Class.Pipeline."compr-playback-media" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		!immutable [
			"direction"
		]

		unique "instance"
	}

	Object.Widget {
		host-copier."1" {
			type		"aif_in"
			node_type	$HDA_HOST_OUTPUT_CLASS
			num_output_pins	1
			deep_buffer_dma_ms $COMPR_DEEPBUFFER_MS
		}

		media_decoder."1" {
			scheduler_domain "DP"
			no_pm		"true"
		}

		module-copier."2" {}

		src."1" {}

		micsel."1" {}

		gain."1" {}

		mixin."1" {}

		pipeline."1" {
			priority	0
			lp_mode		1
		}
	}

	Object.Base.route [
		{
			source	media_decoder.$index.1
			sink	module-copier.$index.2
		}
		{
			source	module-copier.$index.2
			sink	src.$index.1
		}
		{
			source	src.$index.1
			sink	micsel.$index.1
		}
		{
			source	micsel.$index.1
			sink	gain.$index.1
		}
		{
			source	gain.$index.1
			sink	mixin.$index.1
		}
	]

	direction		"playback"
	dynamic_pipeline	1
	time_domain		"timer"
}
