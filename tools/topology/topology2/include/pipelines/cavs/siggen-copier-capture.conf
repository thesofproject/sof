#
# Echo reference pipeline for ECNS
#
# siggen.1 (48 kHz stereo) -> module-copier.2
#
# The siggen widget collects the speaker echo reference. When the speaker
# is not running it produces silence. The siggen supports only one sink, so
# the module-copier provides the 48 kHz outputs to the ECNS instances in other
# pipelines, e.g. via an SRC for a 16 kHz ECNS. All attributes defined herein
# are namespaced by alsatplg to
# "Object.Pipeline.siggen-copier-capture.N.attribute_name".
#
# Every widget of the pipeline must be used by all PCMs that use the pipeline.
# The kernel frees a widget when its last PCM stops, but the firmware deletes
# the module only with the whole pipeline, so a widget used by only some PCMs,
# e.g. an SRC for one of the ECNS instances, must be in another pipeline.
#
# Usage: siggen-copier-capture pipeline object can be instantiated as:
#
# Object.Pipeline.siggen-copier-capture."N" {
#	index	120
# }
#
# Where N is the unique pipeline ID within the same alsaconf node.
#
# The siggen and module-copier widget classes must be included by the top
# level topology. Including siggen.conf again would duplicate its default
# format.
#
Class.Pipeline."siggen-copier-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		# the 48 kHz stereo 32-bit output format is the siggen class default
		siggen."1" {
			num_input_pins 1
			num_output_pins 1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
		}

		module-copier."2" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_channels		2
					in_ch_cfg		$CHANNEL_CONFIG_STEREO
					in_ch_map		$CHANNEL_MAP_STEREO
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		48000
					out_channels		2
					out_ch_cfg		$CHANNEL_CONFIG_STEREO
					out_ch_map		$CHANNEL_MAP_STEREO
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	Object.Base {
		!route [
			{
				source	siggen.$index.1
				sink	module-copier.$index.2
			}
		]
	}

	direction	"capture"
	dynamic_pipeline 1
	period		1000
	time_domain	"timer"
}
