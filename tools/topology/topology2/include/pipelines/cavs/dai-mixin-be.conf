#
# DAI BE capture pipeline for multi-KPB WOV topology.
# Default: dai-copier only (no KPB).  Manifest adds mixin and
# overrides the dai-copier with the correct HDA/DMIC type and formats.
# No internal routes — all routes defined by the manifest.
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/dai-copier.conf>
<include/components/pipeline.conf>

Class.Pipeline."dai-mixin-be" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]


		unique	"instance"
	}

	Object.Widget {
		dai-copier."1" {
			type		"dai_out"
			dai_type	"DMIC"
			copier_type	"DMIC"
			stream_name	$DMIC1_NAME
			node_type	$HDA_LINK_INPUT_CLASS
			num_input_audio_formats 1
			num_output_audio_formats 1
			num_output_pins 1

			Object.Base.input_audio_format [
				{
					in_rate			16000
					in_channels		1
					in_bit_depth		16
					in_valid_bit_depth	16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		16000
					out_channels		1
					out_bit_depth		16
					out_valid_bit_depth	16
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	direction	"capture"
	dynamic_pipeline 1
	time_domain	"timer"
}
