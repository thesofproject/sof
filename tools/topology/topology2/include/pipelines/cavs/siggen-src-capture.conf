#
# Echo reference pipeline for ECNS
#
# siggen.1 (48 kHz stereo) -> src.1 (48 to 16 kHz stereo)
#
# The siggen widget collects the speaker echo reference. When the speaker
# is not running it produces silence. The src output feeds the echo reference
# input pin of the ECNS in another pipeline. All attributes defined herein are
# namespaced by alsatplg to "Object.Pipeline.siggen-src-capture.N.attribute_name".
#
# Usage: siggen-src-capture pipeline object can be instantiated as:
#
# Object.Pipeline.siggen-src-capture."N" {
#	index	120
# }
#
# Where N is the unique pipeline ID within the same alsaconf node.
#
# The siggen and src widget classes must be included by the top level
# topology. Including siggen.conf again would duplicate its default format.
#

Class.Pipeline."siggen-src-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		# the 48 kHz stereo 32-bit output format is the siggen class default
		siggen."1" {
			num_input_pins 1
			num_output_pins 1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
		}

		src."1" {
			rate_in		48000
			rate_out	16000
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_channels		2
					in_ch_cfg		$CHANNEL_CONFIG_STEREO
					in_ch_map		$CHANNEL_MAP_STEREO
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		16000
					out_channels		2
					out_ch_cfg		$CHANNEL_CONFIG_STEREO
					out_ch_map		$CHANNEL_MAP_STEREO
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	Object.Base {
		!route [
			{
				source	siggen.$index.1
				sink	src.$index.1
			}
		]
	}

	direction	"capture"
	dynamic_pipeline 1
	period		1000
	time_domain	"timer"
}
