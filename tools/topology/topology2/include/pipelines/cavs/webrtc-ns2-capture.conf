#
# cAVS webrtc-ns2 (RNNoise) capture pipeline
#
# DAI-copier → webrtc-ns2 → module-copier → host
#
# IMPORTANT: pipeline rate MUST be 48000 Hz (RNNoise hard requirement).
# Insert an ASRC upstream if your DAI runs at a different rate.
#
# RNNoise processes 10 ms (480 sample) frames. The module accumulates
# sub-frames internally until a full 480-sample block is ready.
#
# Usage:
#   Object.Pipeline.webrtc-ns2-capture."N" {
#       format    "s16le"
#       period    1000
#       time_domain "timer"
#   }
#

<include/components/dai-copier.conf>
<include/components/pipeline.conf>
<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/webrtc-ns2.conf>
<include/components/module-copier.conf>

Class.Pipeline."webrtc-ns2-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		!immutable [
			"direction"
		]

		unique	"instance"
	}

	Object.Widget {
		pipeline."1" {
			priority	0
			lp_mode		0
		}

		# RNNoise widget — 48 kHz float internally, S16/S32 pipeline
		webrtc-ns2."1" {
			index	$index
		}

		# Output module-copier: pass-through, provides the host-facing
		# buffer and PCM interface. Format must stay at 48 kHz.
		module-copier."1" {
			period_sink_count   1
			period_source_count 1
			num_input_audio_formats 2
			num_output_audio_formats 2
			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_bit_depth		16
					in_valid_bit_depth	16
				}
				{
					in_rate			48000
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		48000
					out_bit_depth		32
					out_valid_bit_depth	32
				}
				{
					out_rate		48000
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}

	Object.Base {
		route.1 {
			source	webrtc-ns2.$index.1
			sink	module-copier.$index.1
		}
	}

	direction	"capture"
	dynamic_pipeline 1
	time_domain	"timer"
}
