#
# microWakeWord (MWW) capture detection pipeline
#
# This class provides a detection pipeline that first uses micsel to convert
# a 16 kHz capture stream (stereo or mono) into stereo double-mono, then
# feeds it into MFCC for feature extraction (10ms hop / 40 mel bins) and
# microWakeWord (MWW) for streaming keyword spotting. The MWW detector
# connects to a virtual.detect_sink widget which DAPM links to the KPB
# host capture copier.
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/pipeline.conf>
<include/components/micsel.conf>
<include/components/mfcc.conf>
<include/components/mww.conf>
<include/components/virtual.conf>

Define {
	# 20 ms buffer between KPB and micsel at 16 kHz, 2 ch, s32 (2560 B buffer):
	# IPC4 allocates 2 * ibs = 2560 B.
	MICSEL_INPUT_BYTES 1280
	# 10 ms FFT hop at 16 kHz, 2 ch, s32: 160 samples * 2 * 4 = 1280 B.
	MFCC_INPUT_BYTES 1280
	MWW_DETECT_CHANNELS 2
	MWW_DETECT_CH_CFG $CHANNEL_CONFIG_DUAL_MONO
	MWW_DETECT_CH_MAP $CHANNEL_MAP_DUAL_MONO
	MWW_DETECT_MICSEL "true"
	MWW_DETECT_KPB_PIPELINE_ID 0
	MWW_DETECT_CORE_ID 1
}

IncludeByKey.MWW_PCAN {
	"true" {
		Define {
			# 8-bit PCAN frame: 24-byte header + 40 mel bins * 1 byte.
			MFCC_FRAME_BYTES 64
			MWW_INPUT_BYTES 64
		}
	}
	"false" {
		Define {
			# 32-bit MFCC compress output frame: 24-byte header + 40 mel bins * 4 bytes.
			MFCC_FRAME_BYTES 184
			MWW_INPUT_BYTES 184
		}
	}
}

Class.Pipeline."mww-detect" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		# virtual widget is only used in driver to connect mww widget
		# to the host copier. The virtual widget does not exist in
		# the firmware.
		virtual."1" {
			name "virtual.detect_sink"
			type out_drv
		}

		IncludeByKey.MWW_DETECT_MICSEL {
			"true" {
			micsel."1" {
			core_id		$MWW_DETECT_CORE_ID
			num_input_audio_formats 2
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		$MWW_DETECT_CHANNELS
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		16000
					ibs 			$MICSEL_INPUT_BYTES
				}
				{
					in_channels 		1
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		16000
					in_ch_cfg 		$CHANNEL_CONFIG_MONO
					in_ch_map 		$CHANNEL_MAP_MONO
					ibs 			"$[($MICSEL_INPUT_BYTES / 2)]"
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		$MWW_DETECT_CHANNELS
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_rate 		16000
					out_ch_cfg 	$MWW_DETECT_CH_CFG
					out_ch_map 	$MWW_DETECT_CH_MAP
					obs 			$MICSEL_INPUT_BYTES
				}
			]
			}
			}
		}

		mfcc."1" {
			scheduler_domain "DP"
			core_id 	$MWW_DETECT_CORE_ID
			domain_id 	0
			stack_bytes_requirement 8192
			heap_bytes_requirement "$[(24 * 1024)]"
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		$MWW_DETECT_CHANNELS
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		16000
					ibs 			$MFCC_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		$MWW_DETECT_CHANNELS
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_rate 		16000
					obs 			$MFCC_FRAME_BYTES
				}
			]
		}

		# MWW is an audio pass-through: it copies each MFCC frame
		# from input to output unchanged and sends keyword detection
		# triggers out-of-band via AMS / KPB notifications. ibs/obs
		# are one MFCC frame so the DP thread wakes per 10 ms hop
		# and stays in lock-step with MFCC.
		mww."1" {
			scheduler_domain "DP"
			core_id 	$MWW_DETECT_CORE_ID
			domain_id 	0
			stack_bytes_requirement 8192
			heap_bytes_requirement "$[(24 * 1024)]"
			num_input_pins	1
			num_output_pins	0
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		2
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		16000
					ibs 			$MWW_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		2
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_rate 		16000
					obs 			$MWW_INPUT_BYTES
				}
			]
		}

		pipeline."1" {
			priority 	0
			lp_mode 	0
			core 		$MWW_DETECT_CORE_ID
		}
	}

	Object.Base {
		!route [
			{
				source 	mfcc.$index.1
				sink 	mww.$index.1
			}
			{
				source 	mww.$index.1
				sink 	"virtual.detect_sink"
			}
		]
	}

	IncludeByKey.MWW_DETECT_MICSEL {
		"true" {
			Object.Base.route [
				{
					source micsel.$index.1
					sink mfcc.$index.1
				}
			]
		}
		"false" {
			Object.Base.route [
				{
					source "kpb.$MWW_DETECT_KPB_PIPELINE_ID.1"
					sink mfcc.$index.1
				}
			]
		}
	}

	direction 	"capture"
	dynamic_pipeline 1
	time_domain 	"timer"
}
