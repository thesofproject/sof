#
# FE capture pipeline: compr-capture-ffmpeg
#
# Mirror of compr-playback-ffmpeg, but for the ENCODE direction: interleaved PCM
# arrives from a capture BE (the HDA analog capture DAI) and the FFmpeg
# (libavcodec) encoder widget "ffmpeg_enc" compresses it to an MP3 elementary
# stream that the aif_out host-copier DMAs to the host (read via crecord).
#
# ffmpeg_enc is the same firmware module as ffmpeg_dec built in encode mode; it
# carries the DAPM type "encoder" so the compress kernel path
# (sof_ipc4_compr_get_module) finds and configures it. Although libshine is a
# lightweight fixed-point encoder, the widget runs on the DP (data-processing)
# domain like the decoder: MP3 needs a full 1152-sample (24 ms) frame of input
# before it can emit a packet, and the DP ring can be sized to buffer that many
# samples ahead, which a 2 ms low-latency buffer cannot. core_id / stack sizing
# are set on the platform instance.
#
# This pipeline holds only the DP encoder and the aif_out host-copier. Its PCM
# input is delivered by an EXTERNAL mixout that lives in its own timer-scheduled
# mixout-capture pipeline (see platform/intel/compr-capture-ffmpeg.conf): the
# capture BE fans PCM out via a single mixin (mixin.4.1) to two mixouts - one in
# the normal analog capture FE and one that feeds this encoder - using the
# proven mixer fan-out (the same mix path playback uses). A module-copier's 2nd
# output pin does NOT deliver data across a pipeline boundary, which starved the
# encoder in the earlier copier-fan-out design; mixin->mixout does deliver.
#
# The tap mixout is isolated in its own LL pipeline because a DP module breaks
# the LL copy walk: a mixout sharing this pipeline would sit on the far side of
# the break from the pipeline's sink scheduler and never run. Standalone, the
# mixout self-schedules on the timer and its output crosses the boundary into
# this DP module's input ring, mirroring how the decode pipeline's LL
# host-copier feeds ffmpeg_dec.
#
# The mixin->mixout, mixout->ffmpeg_enc and ffmpeg_enc->host-copier routes are
# declared in the platform conf (platform/intel/compr-capture-ffmpeg.conf)
# because they depend on the capture BE fan-out tap (COMPR_ENC_SOURCE) and the
# compress PCM id.
#
# All attributes defined herein are namespaced by alsatplg to
# "Object.Pipeline.compr-capture-ffmpeg.N.attribute_name".
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/pipeline.conf>
<include/components/host-copier.conf>
<include/components/ffmpeg_enc.conf>

Class.Pipeline."compr-capture-ffmpeg" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		ffmpeg_enc."1" {
			scheduler_domain "DP"
			no_pm	"true"
		}

		host-copier."1" {
			type	"aif_out"
			node_type $HDA_HOST_INPUT_CLASS
			num_input_pins 1
			num_output_pins 1
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	direction	"capture"
	dynamic_pipeline 1
	time_domain	"timer"
}
