#
# Capture pipeline: mixout-capture.
#
# A single mixout that is the sole (source == sink) component of its own
# timer-scheduled pipeline. It exists to give the mixer capture fan-out tap an
# LL scheduling anchor: the pipeline's scheduling component falls back to its
# sink (this mixout), so the LL scheduler runs mixout_process every period,
# draining the feeding mixin into the mixout's sink buffer.
#
# This is needed when the mixout feeds a DP (data-processing) module in a
# downstream pipeline (e.g. the FFmpeg encoder): a DP module breaks the LL copy
# walk, so a mixout placed in the SAME pipeline as the DP module - on the far
# side of the break from the pipeline's DMA-driven scheduling component - is
# never scheduled and never drains its mixin. Isolating the mixout in its own
# timer-scheduled pipeline (the standard mixer pattern) makes it self-schedule;
# its output then crosses the pipeline boundary into the DP module's input ring.
#
# All attributes defined herein are namespaced by alsatplg to
# "Object.Pipeline.mixout-capture.N.attribute_name".
#

<include/components/mixout.conf>
<include/components/pipeline.conf>

Class.Pipeline."mixout-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		unique	"instance"
	}

	Object.Widget {
		mixout."1" {}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	direction	"capture"
	dynamic_pipeline 1
	time_domain	"timer"
}
