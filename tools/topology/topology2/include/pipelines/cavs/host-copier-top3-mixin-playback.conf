#
# FE playback pipeline: host-copier-top3-mixin-playback
#
# Chained top 3 DSP offload modules:
# host-copier -> gain -> webrtc-hpf -> webrtc-agc -> alimiter -> mixin
#
# All attributes defined herein are namespaced
# by alsatplg to "Object.Pipeline.host-copier-top3-mixin-playback.N.attribute_name"
#
# Usage: host-copier-top3-mixin-playback pipeline object can be instantiated as:
#
# Object.Pipeline.host-copier-top3-mixin-playback."N" {
# 	period		1000
# 	time_domain	"timer"
# }
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/host-copier.conf>
<include/components/mixin.conf>
<include/components/pipeline.conf>
<include/components/gain.conf>
<include/components/webrtc-hpf.conf>
<include/components/webrtc-agc.conf>
<include/components/alimiter.conf>

Class.Pipeline."host-copier-top3-mixin-playback" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		!immutable [
			"direction"
		]

		unique	"instance"
	}

	Object.Widget {
		host-copier."1" {
			type	"aif_in"
			node_type $HDA_HOST_OUTPUT_CLASS
			num_input_audio_formats 3
			num_output_audio_formats 1
			num_output_pins 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		16
					in_valid_bit_depth	16
				}
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
				{
					in_bit_depth		32
					in_valid_bit_depth	24
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		gain."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1

			# 32-bit 48KHz 2ch
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		webrtc-hpf."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		webrtc-agc."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}


		alimiter."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		mixin."1" {}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	Object.Base.route [
		{
			source	gain.$index.1
			sink	webrtc-hpf.$index.1
		}
		{
			source	webrtc-hpf.$index.1
			sink	webrtc-agc.$index.1
		}
		{
			source	webrtc-agc.$index.1
			sink	alimiter.$index.1
		}
		{
			source	alimiter.$index.1
			sink	mixin.$index.1
		}
	]

	direction	"playback"
	dynamic_pipeline 1
	time_domain	"timer"
}
