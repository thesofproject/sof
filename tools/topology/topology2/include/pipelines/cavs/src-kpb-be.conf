#
# SRC-KPB backend pipeline
#
# This class provides a pipeline that converts a DAI-side capture stream
# down to 16 kHz stereo via SRC and feeds it into a KPB widget for
# key-phrase buffering with dual sinks (WoV drain and detection paths).
#
# Usage:
#
# Object.Pipeline.src-kpb-be."N" {
#	period		1000
#	time_domain	"timer"
# }
#
# Where N is the unique pipeline ID within the same alsaconf node.
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/pipeline.conf>
<include/components/src.conf>
<include/components/kpb.conf>

Class.Pipeline."src-kpb-be" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		#
		# src-kpb-be objects instantiated within the same alsaconf node
		# must have unique pipeline_id attribute.
		#
		unique	"instance"
	}

	Object.Widget {
		src."1" {
			num_input_pins 1
			num_output_pins 1
			num_input_audio_formats 3
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels		2
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			48000
				}
				{
					in_channels		2
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			96000
				}
				{
					in_channels		2
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			192000
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels		2
					out_bit_depth		32
					out_valid_bit_depth	32
					out_rate		16000
				}
			]
		}

		kpb."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels		2
					in_bit_depth		32
					in_valid_bit_depth	32
					in_rate			16000
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels		2
					out_bit_depth		32
					out_valid_bit_depth	32
					out_rate		16000
				}
			]
		}

		pipeline."1" {
			priority	0
			lp_mode		0
		}
	}

	Object.Base {
		!route [
			{
				source	src.$index.1
				sink	kpb.$index.1
			}
		]
	}

	direction	"capture"
	dynamic_pipeline 1
	time_domain	"timer"
}
