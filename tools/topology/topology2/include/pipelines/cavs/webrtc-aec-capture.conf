#
# cAVS webrtc-aec capture pipeline
#
# Mic DAI → module-copier → [webrtc-aec] → module-copier → host
#                                  ↑
#            Ref DAI ──────────────┘ (pin 1)
#
# The webrtc-aec widget has 2 input pins. The firmware resolves which
# source is the microphone and which is the echo reference at run-time
# using the pipeline-ID heuristic (mic is on the same pipeline as the
# output sink). Pin bindings must name both source copiers explicitly
# in the instantiation site (see cavs-nocodec-webrtc-aec.conf).
#
# Usage:
#   Object.Pipeline.webrtc-aec-capture."N" {
#       format     "s16le"
#       period     1000
#       time_domain "timer"
#   }
#

<include/components/dai-copier.conf>
<include/components/pipeline.conf>
<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/webrtc-aec.conf>
<include/components/module-copier.conf>

Class.Pipeline."webrtc-aec-capture" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		!immutable [
			"direction"
		]

		unique	"instance"
	}

	Object.Widget {
		pipeline."1" {
			priority	0
			lp_mode		0
		}

		# Input copier: S32 DAI → S16 for AECm (fixed-point)
		module-copier."1" {
			period_sink_count   1
			period_source_count 1
			num_input_audio_formats 2
			num_output_audio_formats 2
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
				{
					in_bit_depth		32
					in_valid_bit_depth	32
					in_channels		4
					in_ch_cfg		$CHANNEL_CONFIG_3_POINT_1
					in_ch_map		$CHANNEL_MAP_3_POINT_1
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		16
					out_valid_bit_depth	16
				}
				{
					out_bit_depth		16
					out_valid_bit_depth	16
					out_channels		4
					out_ch_cfg		$CHANNEL_CONFIG_3_POINT_1
					out_ch_map		$CHANNEL_MAP_3_POINT_1
				}
			]
		}

		# Output copier: S16 AEC output → S32 for host
		module-copier."2" {
			period_sink_count   1
			period_source_count 1
			num_input_audio_formats 2
			num_output_audio_formats 2
			Object.Base.input_audio_format [
				{
					in_bit_depth		16
					in_valid_bit_depth	16
				}
				{
					in_bit_depth		16
					in_valid_bit_depth	16
					in_channels		4
					in_ch_cfg		$CHANNEL_CONFIG_3_POINT_1
					in_ch_map		$CHANNEL_MAP_3_POINT_1
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
				{
					out_bit_depth		32
					out_valid_bit_depth	32
					out_channels		4
					out_ch_cfg		$CHANNEL_CONFIG_3_POINT_1
					out_ch_map		$CHANNEL_MAP_3_POINT_1
				}
			]
		}
	}

	Object.Base {
		route.1 {
			source	module-copier.$index.1
			sink	webrtc-aec.$index.1
		}
		route.2 {
			source	webrtc-aec.$index.1
			sink	module-copier.$index.2
		}
	}

	direction	"capture"
	dynamic_pipeline 1
	time_domain	"timer"
}
