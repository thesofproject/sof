# SPDX-License-Identifier: BSD-3-Clause
#
# Micsel-SRC-KPB backend pipeline
#
# This class provides a pipeline that downmixes a multi-channel (stereo)
# capture stream to mono via micsel, converts down to 16 kHz mono via SRC,
# and feeds it into a KPB widget for key-phrase buffering with dual mono
# sinks (WoV drain and keyword detection paths).
#
# Usage:
#
# Object.Pipeline.micsel-src-kpb-be."N" {
# 	period 		1000
# 	time_domain 	"timer"
# }
#
# Where N is the unique pipeline ID within the same alsaconf node.
#

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/pipeline.conf>
<include/components/micsel.conf>
<include/components/src.conf>
<include/components/kpb.conf>
<include/controls/bytes.conf>

Class.Pipeline."micsel-src-kpb-be" {

	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]

		#
		# micsel-src-kpb-be objects instantiated within the same alsaconf node
		# must have unique pipeline_id attribute.
		#
		unique 	"instance"
	}

	Object.Widget {
		micsel."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		2
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		48000
					in_ch_cfg 		$CHANNEL_CONFIG_STEREO
					in_ch_map 		$CHANNEL_MAP_STEREO
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		1
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_rate 		48000
					out_ch_cfg 		$CHANNEL_CONFIG_MONO
					out_ch_map 		$CHANNEL_MAP_MONO
				}
			]
		}

		src."1" {
			num_input_pins 1
			num_output_pins 1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		1
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		48000
					in_ch_cfg 		$CHANNEL_CONFIG_MONO
					in_ch_map 		$CHANNEL_MAP_MONO
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		1
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_rate 		16000
					out_ch_cfg 		$CHANNEL_CONFIG_MONO
					out_ch_map 		$CHANNEL_MAP_MONO
				}
			]
		}

		kpb."1" {
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		1
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_rate 		16000
					in_ch_cfg 		$CHANNEL_CONFIG_MONO
					in_ch_map 		$CHANNEL_MAP_MONO
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		1
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_rate 		16000
					out_ch_cfg 		$CHANNEL_CONFIG_MONO
					out_ch_map 		$CHANNEL_MAP_MONO
				}
			]
		}

		pipeline."1" {
			priority 	0
			lp_mode 	0
		}
	}

	Object.Base {
		!route [
			{
				source 	micsel.$index.1
				sink 	src.$index.1
			}
			{
				source 	src.$index.1
				sink 	kpb.$index.1
			}
		]
	}

	direction 	"capture"
	dynamic_pipeline 1
	time_domain 	"timer"
}
