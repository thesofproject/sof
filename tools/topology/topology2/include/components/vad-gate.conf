#
# vad-gate widget
#
# Voice Activity Detection gate.  Sits between the WOV Arbiter and the
# Host copier in Pipeline 104.  During silence it returns PPL_STATUS_PATH_STOP
# so the DMA write pointer never advances and compress_read() blocks.
# When voice energy exceeds the threshold it passes audio through so
# compress_read() returns data.  The gate re-arms automatically on each
# pipeline period (every 2 ms at 16 kHz / 64-byte IBS) with no need for
# compress_stop()/compress_start().
#
# Usage:
#
#   Object.Widget."vad-gate"."N" {
#       uuid  "8c7d6e5f-4a3b-2c1d-0e9f-8a7b6c5d4e3f"
#       num_input_audio_formats  1
#       num_output_audio_formats 1
#   }

<include/controls/bytes.conf>

Class.Widget."vad-gate" {

	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	DefineAttribute."cpc" {
		token_ref "comp.word"
	}

	<include/components/widget-common.conf>

	DefineAttribute."is_pages" {
		token_ref "comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]

		!immutable [
			"type"
		]

		unique "instance"
	}

	# Bytes kcontrol: exposes ipc4_vad_gate_config at runtime so the
	# threshold/hangover/onset can be tuned via amixer without a firmware rebuild.
	# Default blob: sof_abi_hdr(32B, type=1=IPC4_VAD_GATE_SET_CONFIG, size=12) +
	#               ipc4_vad_gate_config(threshold=10000, onset=5, hangover=100, shift=0)
	# Pipeline 104 runs S32LE; threshold=10000 is effectively open for any real audio.
	#               Calibrate at runtime via TLV_WRITE to set gate threshold per-DUT.
	Object.Control.bytes."1" {
		name "vad_gate_cfg_$index"
		access [
			tlv_read
			tlv_write
			tlv_callback
		]
		Object.Base.extops."extctl" {
			get 258
			put 258
		}
		max 256
		Object.Base.data."1" {
			bytes "0x53, 0x4f, 0x46, 0x34, 0x01, 0x00, 0x00, 0x00,
			       0x0c, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04,
			       0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
			       0x10, 0x27, 0x00, 0x00, 0x05, 0x00, 0x64, 0x00,
			       0x00, 0x00, 0x00, 0x00"
		}
	}

	# Volatile RO bytes kcontrol: host reads energy + vad_active state.
	# get=260 (SOF_TPLG_KCTL_BYTES_VOLATILE_RO) -> firmware query on each read.
	# param_id=2 (IPC4_VAD_GATE_GET_STATUS) -> 8-byte ipc4_vad_gate_status.
	# Data blob: SOF4 ABI header (32 B) + ipc4_vad_gate_status (8 B) = 40 B total.
	Object.Control.bytes."2" {
		name "vad_gate_status_$index"
		access [
			tlv_read
			tlv_callback
		]
		Object.Base.extops."extctl" {
			get 260
			put 258
		}
		max 64
		Object.Base.data."1" {
			# magic=SOF4  type=2  size=8  abi=0  reserved[4]=0  energy=0  active=0+pad=0
			bytes "0x53, 0x4f, 0x46, 0x34,
			       0x02, 0x00, 0x00, 0x00,
			       0x08, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00"
		}
	}

	# 1 WOV-arbiter input, 1 Host-copier output
	type		"effect"
	no_pm		"true"
	num_input_pins		1
	num_output_pins		1
}
