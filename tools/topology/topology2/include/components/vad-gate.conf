#
# vad-gate widget
#
# Voice Activity Detection gate.  Sits between the DMIC copier and the
# downstream Mixin in a WOV pipeline.  During silence it drains the DMIC
# input but suppresses data flow to the downstream chain (via
# PPL_STATUS_PATH_STOP) so KPBs and WOV detectors idle.  When voice is
# detected audio flows through and the downstream components wake.
#
# Usage:
#
#   Object.Widget."vad-gate"."N" {
#       uuid  "8c7d6e5f-4a3b-2c1d-0e9f-8a7b6c5d4e3f"
#       num_input_audio_formats  1
#       num_output_audio_formats 1
#   }

Class.Widget."vad-gate" {

	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	DefineAttribute."cpc" {
		token_ref "comp.word"
	}

	<include/components/widget-common.conf>

	DefineAttribute."is_pages" {
		token_ref "comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]

		!immutable [
			"type"
		]

		unique "instance"
	}

	# 1 DMIC input, 1 Mixin output
	type		"effect"
	no_pm		"true"
	num_input_pins		1
	num_output_pins		1
}
