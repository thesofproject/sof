#
# vad-gate widget
#
# Voice Activity Detection gate.  Sits between the DMIC copier and the
# downstream Mixin in a WOV pipeline.  During silence it drains the DMIC
# input but suppresses data flow to the downstream chain (via
# PPL_STATUS_PATH_STOP) so KPBs and WOV detectors idle.  When voice is
# detected audio flows through and the downstream components wake.
#
# Usage:
#
#   Object.Widget."vad-gate"."N" {
#       uuid  "8c7d6e5f-4a3b-2c1d-0e9f-8a7b6c5d4e3f"
#       num_input_audio_formats  1
#       num_output_audio_formats 1
#   }

<include/controls/bytes.conf>

Class.Widget."vad-gate" {

	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	DefineAttribute."cpc" {
		token_ref "comp.word"
	}

	<include/components/widget-common.conf>

	DefineAttribute."is_pages" {
		token_ref "comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]

		!immutable [
			"type"
		]

		unique "instance"
	}

	# Bytes kcontrol: exposes ipc4_vad_gate_config at runtime so the
	# threshold/hangover/onset can be tuned via amixer without a firmware rebuild.
	# Default blob: sof_abi_hdr(32B, type=1=IPC4_VAD_GATE_SET_CONFIG, size=12) +
	#               ipc4_vad_gate_config(threshold=0, onset=3, hangover=200, shift=6)
	Object.Control.bytes."1" {
		name "vad_gate_cfg_$index"
		access [
			tlv_read
			tlv_write
			tlv_callback
		]
		Object.Base.extops."extctl" {
			get 258
			put 258
		}
		max 256
		Object.Base.data."1" {
			bytes "0x53, 0x4f, 0x46, 0x34, 0x01, 0x00, 0x00, 0x00,
			       0x0c, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04,
			       0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00, 0x03, 0x00, 0xc8, 0x00,
			       0x06, 0x00, 0x00, 0x00"
		}
	}

	# 1 DMIC input, 1 Mixin output
	type		"effect"
	no_pm		"true"
	num_input_pins		1
	num_output_pins		1
}
