#
# Common widget webrtc-hpf
#
# WebRTC High-Pass Filter widget (fixed-point IIR biquad).
# Single input, single output. Rejects mechanical noise and DC offset (<80 Hz).
# Supports 16 kHz and 48 kHz, S16 and S32 formats.
#
# Usage:
#   Object.Widget.webrtc-hpf."N" {
#       index     1
#       no_pm     "true"
#   }
#
# UUID: 6dfb1bea-d858-4ef7-92abcf5b4ee48159
# Topology byte order:
#   6dfb1bea → ea:1b:fb:6d
#   d858     → 58:d8
#   4ef7     → f7:4e
#   92abcf5b4ee48159 (last 8 bytes, as-is)

Class.Widget."webrtc-hpf" {
	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		token_ref	"comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
		]

		!immutable [
			"uuid"
			"type"
		]

		!deprecated [
			"preload_count"
		]

		unique	"instance"
	}

	num_input_audio_formats 4
	num_output_audio_formats 4

	Object.Base.input_audio_format [
		# S16 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
		# S16 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
	]

	Object.Base.output_audio_format [
		{
			out_rate		48000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		48000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
		{
			out_rate		16000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		16000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
	]

	# UUID: 6dfb1bea-d858-4ef7-92abcf5b4ee48159
	uuid		"ea:1b:fb:6d:58:d8:f7:4e:92:ab:cf:5b:4e:e4:81:59"
	type		"effect"
	no_pm		"true"
	cpc		1000
	num_input_pins		1
	num_output_pins		1
}
