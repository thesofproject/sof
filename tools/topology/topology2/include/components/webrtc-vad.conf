#
# Common widget webrtc-vad
#
# WebRTC libfvad Voice Activity Detector widget. Single input, single output.
# Passes PCM audio through while broadcasting a NOTIFIER_ID_VAD event each
# 10/20/30 ms frame with speech/silence classification.
#
# Usage:
#   Object.Widget.webrtc-vad."N" {
#       index     1
#       no_pm     "true"
#   }
#
# UUID: c790b11d-5d14-e54e-be36ba4ad732cc14  (webrtc_vad in uuid-registry.txt)
# Topology byte order (little-endian fields):
#   c790b11d → 1d:b1:90:c7
#   5d14     → 14:5d
#   e54e     → 4e:e5
#   be36ba4ad732cc14  (last 8 bytes, as-is)

Class.Widget."webrtc-vad" {
	#
	# Pipeline ID for the webrtc-vad widget
	#
	DefineAttribute."index" {}

	#
	# webrtc-vad object instance
	#
	DefineAttribute."instance" {}

	#include common component definition
	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		token_ref	"comp.word"
	}

	# Attribute categories
	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
		]

		!immutable [
			"uuid"
			"type"
		]

		!deprecated [
			"preload_count"
		]

		unique	"instance"
	}

	# Supports S16 and S32 at any rate (8/16/32/48 kHz), mono or stereo.
	num_input_audio_formats 4
	num_output_audio_formats 4

	Object.Base.input_audio_format [
		# S16 stereo
		{
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo
		{
			in_bit_depth		32
			in_valid_bit_depth	32
		}
		# S16 mono
		{
			in_bit_depth		16
			in_valid_bit_depth	16
			in_channels		1
			in_ch_cfg		$CHANNEL_CONFIG_MONO
			in_ch_map		$CHANNEL_MAP_MONO
		}
		# S32 mono
		{
			in_bit_depth		32
			in_valid_bit_depth	32
			in_channels		1
			in_ch_cfg		$CHANNEL_CONFIG_MONO
			in_ch_map		$CHANNEL_MAP_MONO
		}
	]

	Object.Base.output_audio_format [
		{
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_bit_depth		32
			out_valid_bit_depth	32
		}
		{
			out_bit_depth		16
			out_valid_bit_depth	16
			out_channels		1
			out_ch_cfg		$CHANNEL_CONFIG_MONO
			out_ch_map		$CHANNEL_MAP_MONO
		}
		{
			out_bit_depth		32
			out_valid_bit_depth	32
			out_channels		1
			out_ch_cfg		$CHANNEL_CONFIG_MONO
			out_ch_map		$CHANNEL_MAP_MONO
		}
	]

	# UUID: c790b11d-5d14-e54e-be36ba4ad732cc14
	uuid		"1d:b1:90:c7:14:5d:4e:e5:be:36:ba:4a:d7:32:cc:14"
	type		"effect"
	no_pm		"true"
	cpc		500
	num_input_pins		1
	num_output_pins		1
}
