# Capture Transparent decoder audio formats:
# 8 kHz 1ch S16_LE SSP wire input -> 8 kHz or 16 kHz 1ch S16_LE host output.
			num_input_audio_formats 1
			num_output_audio_formats 2
			Object.Base.input_audio_format [
				{
					in_rate			8000
					in_bit_depth		16
					in_valid_bit_depth	16
					in_channels		1
					in_ch_cfg		$CHANNEL_CONFIG_MONO
					in_ch_map		$CHANNEL_MAP_MONO
				}
			]
			CombineArrays.Object.Base.output_audio_format [
				{
					out_rate [
						8000
						16000
					]
					out_bit_depth		[ 16 ]
					out_valid_bit_depth	[ 16 ]
					out_channels		[ 1 ]
					out_ch_cfg		[ $CHANNEL_CONFIG_MONO ]
					out_ch_map		[ $CHANNEL_MAP_MONO ]
				}
			]
