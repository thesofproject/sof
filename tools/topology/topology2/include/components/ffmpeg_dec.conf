#
# Common widget ffmpeg_dec
#
# A generic FFmpeg (libavcodec) decoder widget. All attributes defined herein
# are namespaced by alsatplg to "Object.Widget.ffmpeg_dec.N.attribute_name".
#
# Usage: this component can be used by instantiating it in the parent object. i.e.
#
#	Object.Widget.ffmpeg_dec."N" {
#		index		1
#		type		"effect"
#	}
#
# Where N is the unique instance number for the ffmpeg_dec object within the
# same alsaconf node.
#
# The module decodes a compressed elementary stream (starting with FLAC) to PCM.
# The codec setup header (FLAC STREAMINFO) is delivered through the bytes control
# below and applied via the module's set_configuration() before the pipeline runs.

Class.Widget."ffmpeg_dec" {
	#
	# Pipeline ID for the ffmpeg_dec widget object
	#
	DefineAttribute."index" {
		type "integer"
	}

	#
	# Unique instance for ffmpeg_dec widget
	#
	DefineAttribute."instance" {
		type "integer"
	}

	#include common component definition
	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		# Token set reference name and type
		token_ref	"comp.word"
	}

	#
	# Bytes control carrying the codec setup header (e.g. FLAC STREAMINFO).
	# get/put op 258 is the standard bytes control handler.
	#
	Object.Control.bytes."1" {
		!access [
			tlv_read
			tlv_write
			tlv_callback
		]
		Object.Base.extops.1 {
			name	"extctl"
			get 258
			put 258
		}
		max 2048
	}

	# Attribute categories
	attributes {
		#
		# The ffmpeg_dec widget name is constructed from the index and instance.
		#
		!constructor [
			"index"
			"instance"
		]

		#
		# mandatory attributes that must be provided when the class is instantiated
		#
		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]

		#
		# immutable attributes cannot be modified in the object instance
		#
		!immutable [
			"type"
		]

		#
		# deprecated attributes should not be added in the object instance
		#
		!deprecated [
			"preload_count"
		]

		#
		# ffmpeg_dec widget objects instantiated within the same alsaconf node
		# must have a unique instance attribute
		#
		unique	"instance"
	}

	# Default attribute values for the ffmpeg_dec widget.
	#
	# UUID (registry name "ffmpeg_dec") in SOF topology byte order. Must match the
	# UUID the firmware registers for this module. Can be overridden in the
	# top-level topology file.
	uuid			"73:af:07:12:c0:f9:65:4f:92:b4:9d:45:17:8f:c9:a8"
	type			"effect"
	no_pm			"true"
	core_id			0
	cpc			5000
	num_input_pins		1
	num_output_pins		1
}
