#
# wov-arbiter widget
#
# Routes the drain output of one of N WOV detector paths to the single host
# PCM copier.  Idle inputs are consumed (discarded) so their buffers never
# stall.  Detection and pause/resume coordination is done via SOF notifier.
#
# Exposes a volatile read-only bytes kcontrol "wov_trigger_id" that returns
# the slot index of the last trigger (0/1/2) or 0xff when idle.
# Host reads this after receiving the detect_test module event notification.
#
# Usage:
#
#   Object.Widget.wov-arbiter."N" {
#       uuid  "4a5b6c7d-8e9f-4a1b-2c3d-4e5f60718293"
#       num_input_audio_formats  1
#       num_output_audio_formats 1
#   }
#
# Where N is the unique instance number within the same alsaconf node.

Class.Widget."wov-arbiter" {

	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	DefineAttribute."cpc" {
		token_ref "comp.word"
	}

	<include/components/widget-common.conf>

	DefineAttribute."is_pages" {
		token_ref "comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]

		!immutable [
			"type"
		]

		unique "instance"
	}

	# Volatile read-only kcontrol: host reads active_slot after trigger.
	# get=260 (SOF_TPLG_KCTL_BYTES_VOLATILE_RO) → calls firmware on every read.
	# get=2   (IPC4_WOV_ARB_GET_ACTIVE_SLOT) → param_id for GET_LARGE_CONFIG.
	# Data blob: SOF4 ABI header (type=2, size=4) + initial slot=0xff.
	Object.Control.bytes."1" {
		name	"wov_trigger_id"
		access	[ tlv_read tlv_callback ]

		Object.Base.extops.1 {
			get	260
			put	258
		}

		max	64

		Object.Base.data."1" {
			bytes "0x53, 0x4f, 0x46, 0x34,
			       0x02, 0x00, 0x00, 0x00,
			       0x04, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0x00, 0x00, 0x00, 0x00,
			       0xff, 0x00, 0x00, 0x00"
		}
	}

	# 3 WOV detector inputs, 1 host-copier output
	type		"effect"
	no_pm		"true"
	num_input_pins		3
	num_output_pins		1
}
