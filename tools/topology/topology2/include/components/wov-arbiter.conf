#
# wov-arbiter widget
#
# Routes the drain output of one of N WOV detector paths to the single host
# PCM copier.  Idle inputs are consumed (discarded) so their buffers never
# stall.  Detection and pause/resume coordination is done via SOF notifier.
#
#
# Exposes a volatile read-only enum kcontrol "wov_active_slot" that returns
# 0 for listening, or 1..N for the triggered slot ID (Slot 1, Slot 2, Slot 3).
#
# Usage:
#
#   Object.Widget.wov-arbiter."N" {
#       uuid  "4a5b6c7d-8e9f-4a1b-2c3d-4e5f60718293"
#       num_input_audio_formats  1
#       num_output_audio_formats 1
#   }
#
# Where N is the unique instance number within the same alsaconf node.

<include/controls/enum.conf>

Class.Widget."wov-arbiter" {

	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	DefineAttribute."cpc" {
		token_ref "comp.word"
	}

	<include/components/widget-common.conf>

	DefineAttribute."is_pages" {
		token_ref "comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]

		!immutable [
			"type"
		]

		unique "instance"
	}

	# Volatile read-only enum kcontrol: 0 = Listening, 1 = Slot 1, 2 = Slot 2, 3 = Slot 3.
	Object.Control.enum."1" {
		name	"wov_active_slot"
		Object.Base {
			channel.1 {
				name	"fc"
			}
			text.0 {
				name "wov_active_slot_enum_text"
				!values [
					"Listening"
					"Slot 1"
					"Slot 2"
					"Slot 3"
				]
			}
			ops.1 {
				name	"ctl"
				info	"enum"
				get	257
				put	257
			}
		}
	}

	# 1 detector input (from mixout), 1 host-copier output
	type		"effect"
	no_pm		"true"
	num_input_pins		1
	num_output_pins		1

}
