#
# wov-arbiter widget
#
# Routes the drain output of one of N KPB host sinks to the single host PCM
# copier.  Idle inputs are consumed (discarded) so their buffers never stall.
# Detection and pause/resume coordination is done via AMS in firmware.
#
# Usage:
#
#   Object.Widget.wov-arbiter."N" {
#       uuid  "4a5b6c7d-8e9f-4a1b-2c3d-4e5f60718293"
#       num_input_audio_formats  1
#       num_output_audio_formats 1
#   }
#
# Where N is the unique instance number within the same alsaconf node.

Class.Widget."wov-arbiter" {

	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	DefineAttribute."cpc" {
		token_ref "comp.word"
	}

	<include/components/widget-common.conf>

	DefineAttribute."is_pages" {
		token_ref "comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]

		!immutable [
			"type"
		]

		unique "instance"
	}

	# 3 KPB host-sink inputs, 1 host-copier output
	type		"effect"
	no_pm		"true"
	num_input_pins		3
	num_output_pins		1
}
