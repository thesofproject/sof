#
# Bluetooth Transparent Mode G.722 DSP Codec component (ITU-T G.722 64 kbps SB-ADPCM)
#

Class.Widget."bt_g722" {
	DefineAttribute."index" {
		type "integer"
	}

	DefineAttribute."instance" {
		type "integer"
	}

	<include/components/widget-common.conf>

	attributes {
		!constructor [
			"index"
			"instance"
		]
		!mandatory [
			"num_input_pins"
			"num_output_pins"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]
		!immutable [
			"uuid"
			"type"
		]
		!deprecated [
			"preload_count"
		]
		unique	"instance"
	}

	# 47373232-b700-4a10-8000010203040503
	uuid			"32:32:37:47:00:b7:10:4a:80:00:01:02:03:04:05:03"
	type			"effect"
	no_pm			"true"
	num_input_pins		1
	num_output_pins		1
}
