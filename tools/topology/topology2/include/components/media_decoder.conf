#
# Media decoder widget component
#
# A generic compressed media decoder container widget (DAPM type "decoder").
# Instances carry Object.Base.media_format entries mapping codec formats to
# priority-ordered module UUIDs so the host driver can bind an already-loaded
# decoder module or demand-load (and purge if needed) the matching LLEXT module.
#

Class.Widget."media_decoder" {
	DefineAttribute."index" {
		type "integer"
	}

	DefineAttribute."instance" {
		type "integer"
	}

	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		token_ref	"comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]
		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]
		!immutable [
			"type"
		]
		unique "instance"
	}

	# Default container/fallback UUID (Cadence codec adapter); overridden at runtime
	# when a media_format entry selects a specific module UUID.
	uuid			"43:84:21:d8:f3:5f:4c:4a:b3:88:6c:fe:07:b9:56:aa"
	type			"decoder"
	no_pm			"true"
	core_id			0
	cpc			5000
	num_input_pins		1
	num_output_pins		1
	heap_bytes_requirement	196608
	stack_bytes_requirement	16384
}
