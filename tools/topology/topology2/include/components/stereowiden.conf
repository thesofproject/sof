#
# Common widget stereowiden (FFmpeg stereo widener)
#
# Usage:
#   Object.Widget.stereowiden."N" {
#       index     1
#       no_pm     "true"
#   }
#
# UUID: b22428f9-59c3-4e37-af98-7f6e5d4c3b21

Class.Widget."stereowiden" {
	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		token_ref	"comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
		]

		!immutable [
			"uuid"
			"type"
		]

		!deprecated [
			"preload_count"
		]

		unique	"instance"
	}

	num_input_audio_formats 4
	num_output_audio_formats 4

	Object.Base.input_audio_format [
		# S16 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
		# S16 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
	]

	Object.Base.output_audio_format [
		{
			out_rate		48000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		48000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
		{
			out_rate		16000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		16000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
	]

	# UUID: b22428f9-59c3-4e37-af98-7f6e5d4c3b21
	uuid		"f9:28:24:b2:c3:59:37:4e:af:98:7f:6e:5d:4c:3b:21"
	type		"effect"
	no_pm		"true"
	cpc		2000
	num_input_pins		1
	num_output_pins		1
}
