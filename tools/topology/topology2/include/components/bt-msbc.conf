#
# Bluetooth Transparent Mode mSBC DSP Codec component (HFP H2-framed mSBC)
#

Class.Widget."bt_msbc" {
	DefineAttribute."index" {
		type "integer"
	}

	DefineAttribute."instance" {
		type "integer"
	}

	<include/components/widget-common.conf>

	attributes {
		!constructor [
			"index"
			"instance"
		]
		!mandatory [
			"num_input_pins"
			"num_output_pins"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]
		!immutable [
			"uuid"
			"type"
		]
		!deprecated [
			"preload_count"
		]
		unique	"instance"
	}

	# 4d534243-b700-4a10-8000010203040502
	uuid			"43:42:53:4d:00:b7:10:4a:80:00:01:02:03:04:05:02"
	type			"effect"
	no_pm			"true"
	num_input_pins		1
	num_output_pins		1
}
