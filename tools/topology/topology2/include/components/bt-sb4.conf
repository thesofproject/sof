#
# Bluetooth Transparent Mode SB4 DSP Codec component (experimental 4-band QMF ADPCM)
#

Class.Widget."bt_sb4" {
	DefineAttribute."index" {
		type "integer"
	}

	DefineAttribute."instance" {
		type "integer"
	}

	<include/components/widget-common.conf>

	attributes {
		!constructor [
			"index"
			"instance"
		]
		!mandatory [
			"num_input_pins"
			"num_output_pins"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]
		!immutable [
			"uuid"
			"type"
		]
		!deprecated [
			"preload_count"
		]
		unique	"instance"
	}

	# 53423401-b700-4a10-8000010203040504
	uuid			"01:34:42:53:00:b7:10:4a:80:00:01:02:03:04:05:04"
	type			"effect"
	no_pm			"true"
	num_input_pins		1
	num_output_pins		1
}
