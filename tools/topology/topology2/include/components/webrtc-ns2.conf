#
# Common widget webrtc-ns2
#
# RNNoise deep-learning noise suppressor widget (floating-point, 48 kHz).
# Single input, single output. Processes 480-sample (10 ms) frames.
# Also emits a per-frame VAD probability as a NOTIFIER_ID_VAD event.
#
# IMPORTANT: pipeline sample rate MUST be 48000 Hz. Insert an ASRC
# upstream if the DAI runs at a different rate.
#
# Usage:
#   Object.Widget.webrtc-ns2."N" {
#       index     1
#       no_pm     "true"
#   }
#
# UUID: eacfacdc-2a87-c942-97e894c917a740db
# Topology byte order:
#   eacfacdc → dc:fa:cf:ea
#   2a87     → 87:2a
#   c942     → 42:c9
#   97e894c917a740db (last 8 bytes, as-is)

Class.Widget."webrtc-ns2" {
	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		token_ref	"comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
		]

		!immutable [
			"uuid"
			"type"
		]

		!deprecated [
			"preload_count"
		]

		unique	"instance"
	}

	# RNNoise is float-only and strictly 48 kHz. Supports S16 and S32
	# pipeline formats (the module does internal float conversion).
	# Mono or stereo (runs one RNNoise instance per channel).
	num_input_audio_formats 4
	num_output_audio_formats 4

	Object.Base.input_audio_format [
		# S16 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
		# S16 mono 48 kHz
		{
			in_rate			48000
			in_bit_depth		16
			in_valid_bit_depth	16
			in_channels		1
			in_ch_cfg		$CHANNEL_CONFIG_MONO
			in_ch_map		$CHANNEL_MAP_MONO
		}
		# S32 mono 48 kHz
		{
			in_rate			48000
			in_bit_depth		32
			in_valid_bit_depth	32
			in_channels		1
			in_ch_cfg		$CHANNEL_CONFIG_MONO
			in_ch_map		$CHANNEL_MAP_MONO
		}
	]

	Object.Base.output_audio_format [
		{
			out_rate		48000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		48000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
		{
			out_rate		48000
			out_bit_depth		16
			out_valid_bit_depth	16
			out_channels		1
			out_ch_cfg		$CHANNEL_CONFIG_MONO
			out_ch_map		$CHANNEL_MAP_MONO
		}
		{
			out_rate		48000
			out_bit_depth		32
			out_valid_bit_depth	32
			out_channels		1
			out_ch_cfg		$CHANNEL_CONFIG_MONO
			out_ch_map		$CHANNEL_MAP_MONO
		}
	]

	# UUID: eacfacdc-2a87-c942-97e894c917a740db
	uuid		"dc:fa:cf:ea:87:2a:42:c9:97:e8:94:c9:17:a7:40:db"
	type		"effect"
	no_pm		"true"
	cpc		5000
	num_input_pins		1
	num_output_pins		1
}
