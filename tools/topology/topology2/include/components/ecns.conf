#
# ecns widget class
#
# Data Processing (DP) Echo Cancellation & Noise Suppression module.
#   Input pin 0: 16 kHz microphone stream (2 or 4 channels)
#   Input pin 1: 16 kHz stereo speaker echo reference
#   Output pin 0: 16 kHz mono, s16 or s32 -> KPB
#
# The microphone channel enum control is added in the widget instance with
# include/components/ecns/mic_sel_2ch.conf or mic_sel_4ch.conf to match the
# pin 0 channel count. It is the only enum control, index 0 in firmware.
#
# Usage:
#
#   Object.Widget.ecns."1" {
#       uuid  "6c:8a:4f:21:3a:49:1e:4b:8b:1e:0d:3b:6f:8a:2c:15"
#       num_input_pins 2
#       num_output_pins 1
#       num_input_audio_formats 2
#       num_output_audio_formats 1
#   }
#

<include/controls/mixer.conf>
<include/controls/enum.conf>

Class.Widget."ecns" {

	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	DefineAttribute."cpc" {
		token_ref "comp.word"
	}

	<include/components/widget-common.conf>

	DefineAttribute."is_pages" {
		token_ref "comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]

		!immutable [
			"type"
		]

		unique "instance"
	}

	#
	# ECNS switch controls, the order defines the control index in firmware:
	#   capture boost: boosted (+30 dB) or 0 dB 100 Hz high-pass filter response
	#   AEC switch: subtract the echo reference from the output
	#   NS switch: noise suppression, no function yet
	#
	Object.Control {
		mixer."1" {
			name "ECNS capture boost"
			Object.Base.channel.1 {
				name "fc"
				shift 0
			}
			Object.Base.ops.1 {
				name "ctl"
				info "volsw"
				get 259
				put 259
			}
			max 1
		}
		mixer."2" {
			name "ECNS AEC switch"
			Object.Base.channel.1 {
				name "fc"
				shift 0
			}
			Object.Base.ops.1 {
				name "ctl"
				info "volsw"
				get 259
				put 259
			}
			max 1
		}
		mixer."3" {
			name "ECNS NS switch"
			Object.Base.channel.1 {
				name "fc"
				shift 0
			}
			Object.Base.ops.1 {
				name "ctl"
				info "volsw"
				get 259
				put 259
			}
			max 1
		}
	}

	no_pm "true"
	type  "effect"
}
