#
# ecns widget class
#
# Data Processing (DP) Echo Cancellation & Noise Suppression module.
# Accepts 4 channels (2 mics + 2 echo ref) and produces:
#   Pin 0: 1 channel mono clean mic -> KPB
#   Pin 1: 2 channel stereo clean mics -> Host Copier
#
# Usage:
#
#   Object.Widget.ecns."1" {
#       uuid  "6c:8a:4f:21:3a:49:1e:4b:8b:1e:0d:3b:6f:8a:2c:15"
#       num_input_pins 1
#       num_output_pins 2
#       num_input_audio_formats 1
#       num_output_audio_formats 2
#   }
#

<include/controls/mixer.conf>

Class.Widget."ecns" {

	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	DefineAttribute."cpc" {
		token_ref "comp.word"
	}

	<include/components/widget-common.conf>

	DefineAttribute."is_pages" {
		token_ref "comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]

		!immutable [
			"type"
		]

		unique "instance"
	}

	#
	# ECNS switch control for enabling test signal on KPB mono output pin (Pin 0)
	#
	Object.Control {
		mixer."1" {
			name "ecns_kpb_test_signal"
			Object.Base.channel.1 {
				name "fc"
				shift 0
			}
			Object.Base.ops.1 {
				name "ctl"
				info "volsw"
				get 259
				put 259
			}
			max 1
		}
	}

	no_pm "true"
	type  "effect"
}
