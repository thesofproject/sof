#
# Common widget webrtc-aec
#
# WebRTC AECm (Acoustic Echo Canceller Mobile) widget — fixed-point Q15.
# TWO input pins:
#   Pin 0 — microphone capture (same pipeline as the output sink)
#   Pin 1 — playback echo reference (from the render/speaker pipeline)
# ONE output pin — echo-cancelled microphone.
#
# This is a drop-in replacement for the google-rtc-aec widget.
# The topology wiring is identical: both sources feed into the AEC widget
# and the pipeline-ID heuristic in the firmware resolves mic vs. reference.
#
# Usage:
#   Object.Widget.webrtc-aec."N" {
#       index     7
#       no_pm     "true"
#       Object.Base.input_pin_binding.1 {
#           input_pin_binding_name "dai-copier.DMIC.dmic01.capture"
#       }
#       Object.Base.input_pin_binding.2 {
#           input_pin_binding_name "dai-copier.SSP.Speaker.capture"
#       }
#   }
#
# UUID: e5da7b5b-133a-ba46-b517651d6300bb83
# Topology byte order:
#   e5da7b5b → 5b:7b:da:e5
#   133a     → 3a:13
#   ba46     → 46:ba
#   b517651d6300bb83 (last 8 bytes, as-is)

Define {
	# AECm processes 10 ms frames (same as google-rtc-aec)
	WEBRTC_AEC_PERIOD_MS	10
}

Class.Widget."webrtc-aec" {
	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		token_ref	"comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
		]

		!immutable [
			"uuid"
			"type"
		]

		!deprecated [
			"preload_count"
		]

		unique	"instance"
	}

	# 3 input formats: pin0 (mic) S16/S32 + pin1 (ref) S16
	num_input_audio_formats 3
	num_output_audio_formats 2

	Object.Base.input_audio_format [
		# Pin 0 — microphone S16
		{
			input_pin_index		0
			in_bit_depth		16
			in_valid_bit_depth	16
			ibs "$[(($in_channels * ($[($in_rate + 999)] / 1000)) * ($in_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
		}
		# Pin 0 — microphone S32
		{
			input_pin_index		0
			in_bit_depth		32
			in_valid_bit_depth	32
			ibs "$[(($in_channels * ($[($in_rate + 999)] / 1000)) * ($in_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
		}
		# Pin 1 — echo reference S16
		{
			input_pin_index		1
			in_bit_depth		16
			in_valid_bit_depth	16
			ibs "$[(($in_channels * ($[($in_rate + 999)] / 1000)) * ($in_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
		}
	]

	Object.Base.output_audio_format [
		# S16 output
		{
			out_bit_depth		16
			out_valid_bit_depth	16
			obs "$[(($out_channels * ($[($out_rate + 999)] / 1000)) * ($out_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
		}
		# S32 output
		{
			out_bit_depth		32
			out_valid_bit_depth	32
			obs "$[(($out_channels * ($[($out_rate + 999)] / 1000)) * ($out_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
		}
	]

	# UUID: e5da7b5b-133a-ba46-b517651d6300bb83
	uuid		"5b:7b:da:e5:3a:13:46:ba:b5:17:65:1d:63:00:bb:83"
	type		"effect"
	no_pm		"true"
	cpc		2000
	num_input_pins		2
	num_output_pins		1
}
