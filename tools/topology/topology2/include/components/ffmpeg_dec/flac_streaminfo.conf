# FLAC STREAMINFO codec-setup header for the ffmpeg_dec widget, delivered as a
# bytes control and applied via the module's set_configuration() -> avctx
# extradata before avcodec_open2().
#
# Layout: a 32-byte struct sof_abi_hdr (magic "SOF4", type 0, size = payload
# bytes, abi version, 16 reserved) followed by the raw 34-byte FLAC STREAMINFO
# metadata-block DATA (no 4-byte metadata-block header, no "fLaC" magic -- that
# is exactly what libavcodec's flac decoder expects in avctx->extradata). The
# kernel strips the sof_abi_hdr before sending the payload to the firmware.
#
# This particular STREAMINFO describes the bring-up test clip: 48000 Hz, 2 ch,
# 16-bit, blocksize 4096 (generated with:
#   sox -n -r 48000 -c 2 -b 16 flactest.flac synth 3 sine 440
# then bytes 8..41 of the .flac file). For a different clip, regenerate the
# 34 STREAMINFO bytes below and update the size field is NOT needed (34 fixed).
Object.Base.data."flac_streaminfo" {
	bytes "
	0x53,0x4f,0x46,0x34,0x00,0x00,0x00,0x00,
	0x22,0x00,0x00,0x00,0x00,0xa0,0x01,0x03,
	0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
	0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00,
	0x10,0x00,0x10,0x00,0x00,0x02,0xa7,0x00,
	0x0f,0xc4,0x0b,0xb8,0x02,0xf0,0x00,0x02,
	0x32,0x80,0xcf,0xc1,0x71,0x1a,0xa7,0x41,
	0x4a,0x22,0x36,0xf4,0xbc,0x1a,0x5a,0xc7,
	0x20,0x8d"
}
