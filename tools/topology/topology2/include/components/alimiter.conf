#
# Common widget alimiter (FFmpeg lookahead peak limiter)
#
# FFmpeg alimiter audio filter widget.
# Single input, single output. Brickwall limiting (ceiling 0.950) to protect downstream DAC/speakers.
# Supports 16 kHz and 48 kHz, S16 and S32 formats.
#
# Usage:
#   Object.Widget.alimiter."N" {
#       index     1
#       no_pm     "true"
#   }
#
# UUID: 1207af73-f9c0-4f65-92b49d45178fc9a8 (ffmpeg_dec in filter mode)
# Topology byte order:
#   1207af73 → 73:af:07:12
#   f9c0     → c0:f9
#   4f65     → 65:4f
#   92b49d45178fc9a8 (last 8 bytes, as-is)

<include/controls/mixer.conf>

Class.Widget."alimiter" {
	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		token_ref	"comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
		]

		!immutable [
			"uuid"
			"type"
		]

		!deprecated [
			"preload_count"
		]

		unique	"instance"
	}

	# alimiter widget switch control
	Object.Control {
		mixer."1" {
			Object.Base.channel.1 {
				name	"fc"
				shift	0
			}
			Object.Base.ops.1 {
				name	"ctl"
				info	"volsw"
				get	259
				put	259
			}
			max 1
		}
	}

	num_input_audio_formats 4
	num_output_audio_formats 4

	Object.Base.input_audio_format [
		# S16 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
		# S16 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
	]

	Object.Base.output_audio_format [
		{
			out_rate		48000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		48000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
		{
			out_rate		16000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		16000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
	]

	# UUID: a11317e8-48b2-4d26-9f87-6e5d4c3b2a10
	uuid		"e8:17:13:a1:b2:48:26:4d:9f:87:6e:5d:4c:3b:2a:10"
	type		"effect"
	no_pm		"true"
	cpc		3000
	num_input_pins		1
	num_output_pins		1
}
