#
# Common widget webrtc-agc
#
# WebRTC Digital Automatic Gain Control widget (fixed-point).
# Single input, single output. Dynamically normalizes speech levels (+9 dB boost, limiter).
# Supports 16 kHz and 48 kHz, S16 and S32 formats.
#
# Usage:
#   Object.Widget.webrtc-agc."N" {
#       index     1
#       no_pm     "true"
#   }
#
# UUID: 0af7b529-9dc7-4bee-a8b159e8fbe414f3
# Topology byte order:
#   0af7b529 → 29:b5:f7:0a
#   9dc7     → c7:9d
#   4bee     → ee:4b
#   a8b159e8fbe414f3 (last 8 bytes, as-is)

Class.Widget."webrtc-agc" {
	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		token_ref	"comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
		]

		!immutable [
			"uuid"
			"type"
		]

		!deprecated [
			"preload_count"
		]

		unique	"instance"
	}

	num_input_audio_formats 4
	num_output_audio_formats 4

	Object.Base.input_audio_format [
		# S16 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
		# S16 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
	]

	Object.Base.output_audio_format [
		{
			out_rate		48000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		48000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
		{
			out_rate		16000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		16000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
	]

	# UUID: 0af7b529-9dc7-4bee-a8b159e8fbe414f3
	uuid		"29:b5:f7:0a:c7:9d:ee:4b:a8:b1:59:e8:fb:e4:14:f3"
	type		"effect"
	no_pm		"true"
	cpc		2000
	num_input_pins		1
	num_output_pins		1
}
