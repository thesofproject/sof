# ECNS microphone channel enum for 4ch microphones. The value index is
# passed to the firmware: 0 averages all channels, 1..4 select one channel.
Object.Base {
	channel.1 {
		name "fc"
	}
	text.0 {
		name "ecns_mic_sel_4ch_enum_text"
		!values [
			"Average"
			"Mic1"
			"Mic2"
			"Mic3"
			"Mic4"
		]
	}
	ops.1 {
		name "ctl"
		info "enum"
		get 257
		put 257
	}
}
