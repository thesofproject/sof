#
# Common widget webrtc-ns
#
# WebRTC classic Noise Suppressor widget (fixed-point, spectral Wiener filter).
# Single input, single output. Operates at 8 or 16 kHz on 10 ms frames.
#
# Usage:
#   Object.Widget.webrtc-ns."N" {
#       index     1
#       no_pm     "true"
#   }
#
# UUID: 0fc8faef-945f-004b-8d5f315047f1136a
# Topology byte order:
#   0fc8faef → ef:fa:c8:0f
#   945f     → 5f:94
#   004b     → 4b:00
#   8d5f315047f1136a (last 8 bytes, as-is)

Class.Widget."webrtc-ns" {
	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		token_ref	"comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
		]

		!immutable [
			"uuid"
			"type"
		]

		!deprecated [
			"preload_count"
		]

		unique	"instance"
	}

	# NS operates internally at 8 or 16 kHz; pipeline rate must match.
	# Supports S16 and S32, mono or stereo (runs NS per-channel).
	num_input_audio_formats 4
	num_output_audio_formats 4

	Object.Base.input_audio_format [
		# S16 stereo 16 kHz (recommended)
		{
			in_rate			16000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
		# S16 mono 16 kHz
		{
			in_rate			16000
			in_bit_depth		16
			in_valid_bit_depth	16
			in_channels		1
			in_ch_cfg		$CHANNEL_CONFIG_MONO
			in_ch_map		$CHANNEL_MAP_MONO
		}
		# S32 mono 8 kHz
		{
			in_rate			8000
			in_bit_depth		16
			in_valid_bit_depth	16
			in_channels		1
			in_ch_cfg		$CHANNEL_CONFIG_MONO
			in_ch_map		$CHANNEL_MAP_MONO
		}
	]

	Object.Base.output_audio_format [
		{
			out_rate		16000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		16000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
		{
			out_rate		16000
			out_bit_depth		16
			out_valid_bit_depth	16
			out_channels		1
			out_ch_cfg		$CHANNEL_CONFIG_MONO
			out_ch_map		$CHANNEL_MAP_MONO
		}
		{
			out_rate		8000
			out_bit_depth		16
			out_valid_bit_depth	16
			out_channels		1
			out_ch_cfg		$CHANNEL_CONFIG_MONO
			out_ch_map		$CHANNEL_MAP_MONO
		}
	]

	# UUID: 0fc8faef-945f-004b-8d5f315047f1136a
	uuid		"ef:fa:c8:0f:5f:94:4b:00:8d:5f:31:50:47:f1:13:6a"
	type		"effect"
	no_pm		"true"
	cpc		2000
	num_input_pins		1
	num_output_pins		1
}
