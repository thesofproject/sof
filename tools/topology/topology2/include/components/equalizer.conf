#
# Common widget equalizer (FFmpeg parametric biquad equalizer)
#
# Usage:
#   Object.Widget.equalizer."N" {
#       index     1
#       no_pm     "true"
#   }
#
# UUID: c335390a-6ad4-4f48-b0a9-807f6e5d4c32

Class.Widget."equalizer" {
	DefineAttribute."index" {}
	DefineAttribute."instance" {}

	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		token_ref	"comp.word"
	}

	attributes {
		!constructor [
			"index"
			"instance"
		]

		!mandatory [
			"no_pm"
			"uuid"
		]

		!immutable [
			"uuid"
			"type"
		]

		!deprecated [
			"preload_count"
		]

		unique	"instance"
	}

	num_input_audio_formats 4
	num_output_audio_formats 4

	Object.Base.input_audio_format [
		# S16 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 48 kHz
		{
			in_rate			48000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
		# S16 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		16
			in_valid_bit_depth	16
		}
		# S32 stereo 16 kHz
		{
			in_rate			16000
			in_bit_depth		32
			in_valid_bit_depth	32
		}
	]

	Object.Base.output_audio_format [
		{
			out_rate		48000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		48000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
		{
			out_rate		16000
			out_bit_depth		16
			out_valid_bit_depth	16
		}
		{
			out_rate		16000
			out_bit_depth		32
			out_valid_bit_depth	32
		}
	]

	# UUID: c335390a-6ad4-4f48-b0a9-807f6e5d4c32
	uuid		"0a:39:35:c3:d4:6a:48:4f:b0:a9:80:7f:6e:5d:4c:32"
	type		"effect"
	no_pm		"true"
	cpc		2500
	num_input_pins		1
	num_output_pins		1
}
