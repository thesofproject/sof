#
# Common widget ffmpeg_enc
#
# A generic FFmpeg (libavcodec) encoder widget. It wraps the SAME firmware
# module as ffmpeg_dec (identical UUID) but carries the DAPM widget type
# "encoder" instead of "decoder". All attributes defined herein are namespaced
# by alsatplg to "Object.Widget.ffmpeg_enc.N.attribute_name".
#
# Usage: this component can be used by instantiating it in the parent object. i.e.
#
#	Object.Widget.ffmpeg_enc."N" {
#		index		1
#		type		"encoder"
#	}
#
# Where N is the unique instance number for the ffmpeg_enc object within the
# same alsaconf node.
#
# The module encodes interleaved PCM to a compressed elementary stream (MP3 via
# the built-in libshine encoder). MP3 is self-describing, so no codec-setup
# (extradata) control is needed on the widget.
#

Class.Widget."ffmpeg_enc" {
	#
	# Pipeline ID for the ffmpeg_dec widget object
	#
	DefineAttribute."index" {
		type "integer"
	}

	#
	# Unique instance for ffmpeg_dec widget
	#
	DefineAttribute."instance" {
		type "integer"
	}

	#include common component definition
	<include/components/widget-common.conf>

	DefineAttribute."cpc" {
		# Token set reference name and type
		token_ref	"comp.word"
	}

	# NOTE: this is a 1-in/1-out module-adapter with the DAPM widget type
	# "encoder" (snd_soc_dapm_encoder). The compress kernel path
	# (sof_ipc4_compr_get_module) only recognises the codec module in a
	# compress pipeline when its DAPM id is decoder/encoder, so the type must
	# be "encoder" (not "effect") for the module to be found and configured.
	# MP3 is self-describing, so unlike a decoder no codec-setup (extradata)
	# bytes control is needed here.

	# Attribute categories
	attributes {
		#
		# The ffmpeg_dec widget name is constructed from the index and instance.
		#
		!constructor [
			"index"
			"instance"
		]

		#
		# mandatory attributes that must be provided when the class is instantiated
		#
		!mandatory [
			"no_pm"
			"uuid"
			"num_input_audio_formats"
			"num_output_audio_formats"
		]

		#
		# immutable attributes cannot be modified in the object instance
		#
		!immutable [
			"type"
		]

		#
		# deprecated attributes should not be added in the object instance
		#
		!deprecated [
			"preload_count"
		]

		#
		# ffmpeg_dec widget objects instantiated within the same alsaconf node
		# must have a unique instance attribute
		#
		unique	"instance"
	}

	# Default attribute values for the ffmpeg_dec widget.
	#
	# UUID (registry name "ffmpeg_dec") in SOF topology byte order. Must match the
	# UUID the firmware registers for this module. Can be overridden in the
	# top-level topology file.
	uuid			"73:af:07:12:c0:f9:65:4f:92:b4:9d:45:17:8f:c9:a8"
	type			"encoder"
	no_pm			"true"
	core_id			0
	cpc			5000
	num_input_pins		1
	num_output_pins		1
}
