#
# Widget kpb
#
# A kpb widget. All attributes defined herein are namespaced
# by alsatplg to "Object.Widget.kpb.N.attribute_name"
#
# Usage: this component can be used by instantiating it in the parent object. i.e.
#
# 	Object.Widget.kpb."N" {
#
#	}
#
# Where N is the unique instance number for the kpb object within the same alsaconf node.

Class.Widget."kpb" {
	#
	# Pipeline ID for the kpb object
	#
	DefineAttribute."index" {}

	#
	# Kpb object instance
	#
	DefineAttribute."instance" {}

	DefineAttribute."cpc" {
		# Token set reference name and type
		token_ref	"comp.word"
	}

	#include common component definition
	<include/components/widget-common.conf>

	attributes {
		#
		# The kpb widget name would be constructed using the index and
		# instance attributes. For example: "kpb.0.1".
		#
		!constructor [
			"index"
			"instance"
		]

		#
		# mandatory attributes that must be provided when the class is instantiated
		#
		!mandatory [
			"no_pm"
			"uuid"
		]

		#
		# immutable attributes cannot be modified in the object instance
		#
		!immutable [
			"uuid"
		]

		unique	"instance"
	}

	Object.Control.bytes."1" {
		name "kpb_cfg_$index"
		access [
			tlv_read
			tlv_write
			tlv_callback
		]
		Object.Base.extops."extctl" {
			get 258
			put 258
		}
		max 64
		Object.Base.data."1" {
			IncludeByKey.KPB_BUFF_TIME_MS {
				# sof_abi_hdr{magic, type=KP_BUF_CFG_BUFF_TIME_MS=2, size=4, abi=4.0} + u32 ms
				# 6000 ms = 0x00001770
				'6000' {bytes "0x53, 0x4f, 0x46, 0x34, 0x02, 0x00, 0x00, 0x00,
						0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04,
						0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
						0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
						0x70, 0x17, 0x00, 0x00"}
				# 4000 ms = 0x00000FA0
				'4000' {bytes "0x53, 0x4f, 0x46, 0x34, 0x02, 0x00, 0x00, 0x00,
						0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04,
						0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
						0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
						0xa0, 0x0f, 0x00, 0x00"}
				# 2100 ms = 0x00000834
				'2100' {bytes "0x53, 0x4f, 0x46, 0x34, 0x02, 0x00, 0x00, 0x00,
						0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04,
						0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
						0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
						0x34, 0x08, 0x00, 0x00"}
			}
		}
	}

	#
	# Default attributes for kpb
	#
	type		"effect"

	num_input_audio_formats 1
	num_output_audio_formats 1

	# Changed from the legacy dynamic-load KPB UUID to the IPC4 static-module UUID
	# (kpb4) so the IPC4 host driver can bind the WOV multi-pin topology without a
	# module-library lookup. Must match the UUID in src/audio/kpb.toml.
	#UUID: a8a0cb32-4a77-4db1-85c753d7ee07bce6 (kpb4 static module)
	uuid		"32:cb:a0:a8:77:4a:b1:4d:85:c7:53:d7:ee:07:bc:e6"
	no_pm 		"true"
	cpc 720000
	num_input_pins		1
	num_output_pins		2
}
