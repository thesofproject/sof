				# Every format the offloaded USB endpoint can carry: S16_LE, S24_LE and
				# S32_LE, 1 to 8 channels and every standard rate from 8 to 192 kHz.
				#
				# 7 channels is left out, it has no channel config and no channel map in
				# common_definitions.conf.
				#
				# Same table as uaol_input_audio_formats.conf, but tagged
				# SAMPLE_TYPE_MSB_INTEGER for the DAI copier's wire-facing side,
				# matching the convention every other link type (HDA, SoundWire,
				# SSP, DMIC) uses so the copier right-shifts 24-bit samples back
				# out of the link's left-justified container.
