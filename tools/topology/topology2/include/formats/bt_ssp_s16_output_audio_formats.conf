				# Bluetooth SSP wire S16_LE output formats:
				# - Controller offload ("none"): BT-SCO-NB 8k 1ch, BT-SCO-WB 16k 1ch, BT-A2DP 48k 2ch.
				# - SOF Transparent DSP codecs ("lc3|msbc|g722|sb4"): fixed BT-SCO-NB 8k 1ch S16_LE wire link.
				IncludeByKey.BT_TRANSP_CODEC {
					"none" {
						num_output_audio_formats 3
						CombineArrays.Object.Base.output_audio_format [
							{
								out_rate [
									8000
									16000
								]
								out_bit_depth [ 16 ]
								out_valid_bit_depth [ 16 ]
								out_channels [ 1 ]
								out_ch_cfg [ $CHANNEL_CONFIG_MONO ]
								out_ch_map [ $CHANNEL_MAP_MONO ]
							}
							{
								out_rate [ 48000 ]
								out_bit_depth [ 16 ]
								out_valid_bit_depth [ 16 ]
								out_channels [ 2 ]
								out_ch_cfg [ $CHANNEL_CONFIG_STEREO ]
								out_ch_map [ $CHANNEL_MAP_STEREO ]
							}
						]
					}
					"(lc3|msbc|g722|sb4)" {
						num_output_audio_formats 1
						Object.Base.output_audio_format [
							{
								out_rate 8000
								out_bit_depth 16
								out_valid_bit_depth 16
								out_channels 1
								out_ch_cfg $CHANNEL_CONFIG_MONO
								out_ch_map $CHANNEL_MAP_MONO
							}
						]
					}
				}
