				# Bluetooth S32_LE internal pipeline output formats (host-copier output,
				# gain, mixin, and mixout):
				# - Controller offload ("none"): 8 kHz 1ch, 16 kHz 1ch, and 48 kHz 2ch.
				# - SOF Transparent DSP codecs ("lc3|msbc|g722|sb4"): 8 kHz 1ch and 16 kHz 1ch.
				IncludeByKey.BT_TRANSP_CODEC {
					"none" {
						num_output_audio_formats 3
						CombineArrays.Object.Base.output_audio_format [
							{
								out_rate [
									8000
									16000
								]
								out_bit_depth [ 32 ]
								out_valid_bit_depth [ 32 ]
								out_channels [ 1 ]
								out_ch_cfg [ $CHANNEL_CONFIG_MONO ]
								out_ch_map [ $CHANNEL_MAP_MONO ]
							}
							{
								out_rate [ 48000 ]
								out_bit_depth [ 32 ]
								out_valid_bit_depth [ 32 ]
								out_channels [ 2 ]
								out_ch_cfg [ $CHANNEL_CONFIG_STEREO ]
								out_ch_map [ $CHANNEL_MAP_STEREO ]
							}
						]
					}
					"(lc3|msbc|g722|sb4)" {
						num_output_audio_formats 2
						CombineArrays.Object.Base.output_audio_format [
							{
								out_rate [
									8000
									16000
								]
								out_bit_depth [ 32 ]
								out_valid_bit_depth [ 32 ]
								out_channels [ 1 ]
								out_ch_cfg [ $CHANNEL_CONFIG_MONO ]
								out_ch_map [ $CHANNEL_MAP_MONO ]
							}
						]
					}
				}
