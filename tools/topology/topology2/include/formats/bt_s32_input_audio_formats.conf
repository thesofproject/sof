				# Bluetooth S32_LE internal pipeline input formats (gain, mixin, mixout,
				# and Transparent bt_codec playback input):
				# - Controller offload ("none"): 8 kHz 1ch, 16 kHz 1ch, and 48 kHz 2ch.
				# - SOF Transparent DSP codecs ("lc3|msbc|g722|sb4"): 8 kHz 1ch and 16 kHz 1ch.
				IncludeByKey.BT_TRANSP_CODEC {
					"none" {
						num_input_audio_formats 3
						CombineArrays.Object.Base.input_audio_format [
							{
								in_rate [
									8000
									16000
								]
								in_bit_depth [ 32 ]
								in_valid_bit_depth [ 32 ]
								in_channels [ 1 ]
								in_ch_cfg [ $CHANNEL_CONFIG_MONO ]
								in_ch_map [ $CHANNEL_MAP_MONO ]
							}
							{
								in_rate [ 48000 ]
								in_bit_depth [ 32 ]
								in_valid_bit_depth [ 32 ]
								in_channels [ 2 ]
								in_ch_cfg [ $CHANNEL_CONFIG_STEREO ]
								in_ch_map [ $CHANNEL_MAP_STEREO ]
							}
						]
					}
					"(lc3|msbc|g722|sb4)" {
						num_input_audio_formats 2
						CombineArrays.Object.Base.input_audio_format [
							{
								in_rate [
									8000
									16000
								]
								in_bit_depth [ 32 ]
								in_valid_bit_depth [ 32 ]
								in_channels [ 1 ]
								in_ch_cfg [ $CHANNEL_CONFIG_MONO ]
								in_ch_map [ $CHANNEL_MAP_MONO ]
							}
						]
					}
				}
