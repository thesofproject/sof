#
# Class definition for media_format (compressed codec capabilities -> module UUIDs)
#
# Each entry maps a compressed codec ID and stream constraints (min/max rate,
# channel count, bit depth) to a candidate SOF module UUID. Use CombineArrays
# inside a media_decoder widget to list one or more module UUIDs per format
# in preference order.
#

Class.Base."media_format" {
	DefineAttribute."instance" {}

	DefineAttribute."codec_id" {
		token_ref	"media_codec.word"
	}

	DefineAttribute."min_rate" {
		token_ref	"media_codec.word"
	}

	DefineAttribute."max_rate" {
		token_ref	"media_codec.word"
	}

	DefineAttribute."channels" {
		token_ref	"media_codec.word"
	}

	DefineAttribute."bit_depth" {
		token_ref	"media_codec.word"
	}

	DefineAttribute."module_uuid" {
		type		"string"
		token_ref	"media_codec.uuid"
	}

	attributes {
		!constructor [
			"instance"
		]
		unique "instance"
	}

	min_rate	8000
	max_rate	192000
	channels	2
	bit_depth	16
}
