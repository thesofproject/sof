# SPDX-License-Identifier: BSD-3-Clause
#
# Lean NoCodec (SSP0) topology for microWakeWord (MWW) bring-up.
#
# Playback (passthrough):
#   PCM0 "Port0" -> host-copier -> dai-copier -> SSP0
#
# Capture (Wake-on-Voice):
#   SSP0 -> dai-copier -> SRC (48 -> 16 kHz stereo) -> KPB (dual sinks)
#     pin 0 -> micsel -> MFCC (40 mel, 10 ms) -> MWW -> "SSP0 MWW Detect" PCM
#     pin 1 -> "SSP0 WoV Capture" PCM
#
# Everything the base cavs-nocodec.conf carries for codecs, DMIC, mixers,
# gain, smart-amp and deep buffer is intentionally dropped.

<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/dais>
<searchdir:include/pipelines>
<searchdir:include/pipelines/cavs>
<searchdir:platform>
<searchdir:platform/intel>

<vendor-token.conf>
<tokens.conf>
<virtual.conf>
<output_pin_binding.conf>
<host-gateway-playback.conf>
<host-gateway-capture.conf>
<host-gateway-micsel-mfcc-mww-capture.conf>
<src-kpb-be.conf>
<io-gateway.conf>
<io-gateway-capture.conf>
<highpass-capture-be.conf>
<data.conf>
<pcm.conf>
<pcm_caps.conf>
<fe_dai.conf>
<ssp.conf>
<intel/hw_config_cardinal_clk.conf>
<manifest.conf>
<route.conf>
<common_definitions.conf>
<module-copier.conf>
<ssp-default.conf>

Define {
	MCLK				24576000
	PLATFORM			"tgl"
	# PCAN-normalized 8-bit Mel features by default; set MWW_PCAN=false
	# for the classic 32-bit Mel path.
	MWW_PCAN			"true"

	# Playback (passthrough)
	SSP0_PLAYBACK_PCM_ID		0
	SSP0_PLAYBACK_HOST_PIPELINE_ID	1
	SSP0_PLAYBACK_DAI_PIPELINE_ID	2

	# Capture DAI feeding the Wake-on-Voice branch
	SSP0_CAPTURE_DAI_PIPELINE_ID	3

	# Wake-on-Voice branch. host-gateway* classes reference
	# host-copier.$index.<dir> internally, so keep pcm_id == pipeline_id
	# for the two host-side PCMs.
	MWW_KPB_PIPELINE_ID		4
	MWW_WOV_PIPELINE_ID		100
	MWW_WOV_PCM_ID			100
	MWW_WOV_PCM_NAME		"SSP0 WoV Capture"
	MWW_DETECT_PIPELINE_ID		101
	MWW_DETECT_PCM_ID		101
	MWW_DETECT_PCM_NAME		"SSP0 MWW Detect"
}

# override defaults with platform-specific config
IncludeByKey.PLATFORM {
	"tgl"	"platform/intel/tgl.conf"
	"adl"	"platform/intel/tgl.conf"
}

#
# SSP0 DAI (duplex)
#
Object.Dai.SSP [
	{
		id		0
		dai_index	0
		direction	"duplex"
		name		NoCodec-0
		default_hw_conf_id	0
		sample_bits	32
		quirks		"lbm_mode"
		io_clk		$MCLK

		Object.Base.hw_config.1 {
			name		"SSP0"
			id		0
			fsync_freq	48000
			bclk_freq	3072000
			tdm_slot_width	32
			# TODO: remove this. Needs alsaptlg change.
			Object.Base.link_config.1 {
				clock_source	1
			}
		}
	}
]

#
# Playback: host -> dai (passthrough)
#
Object.Pipeline.host-gateway-playback [
	{
		index	$SSP0_PLAYBACK_HOST_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name	'SSP0 Playback'
			pcm_id		$SSP0_PLAYBACK_PCM_ID
			num_input_audio_formats 3
			Object.Base.input_audio_format [
				{
					in_rate			$SSP0_RATE
					in_bit_depth		16
					in_valid_bit_depth	16
				}
				{
					in_rate			$SSP0_RATE
					in_bit_depth		32
					in_valid_bit_depth	24
				}
				{
					in_rate			$SSP0_RATE
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_rate		$SSP0_RATE
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

Object.Pipeline.io-gateway [
	{
		index		$SSP0_PLAYBACK_DAI_PIPELINE_ID
		direction	playback

		Object.Widget.dai-copier.1 {
			dai_index	0
			dai_type	"SSP"
			copier_type	"SSP"
			stream_name	"NoCodec-0"
			node_type	$I2S_LINK_OUTPUT_CLASS
			num_input_pins	1
			num_input_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			$SSP0_RATE
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_rate		$SSP0_RATE
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

#
# Capture DAI feeding the SRC-KPB branch
#
Object.Pipeline.io-gateway-capture [
	{
		index		$SSP0_CAPTURE_DAI_PIPELINE_ID
		direction	capture

		Object.Widget.dai-copier.1 {
			dai_index	0
			dai_type	"SSP"
			type		dai_out
			copier_type	"SSP"
			stream_name	"NoCodec-0"
			node_type	$I2S_LINK_INPUT_CLASS
			num_input_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels		2
					in_rate			$SSP0_RATE
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_channels		2
					out_rate		$SSP0_RATE
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

#
# SRC (48 -> 16 kHz) + KPB, dual sinks
#
Object.Pipeline.src-kpb-be [
	{
		index	$MWW_KPB_PIPELINE_ID

		# KPB pin 0 (binding.1) feeds the detect/selector sink,
		# pin 1 (binding.2) feeds the host WoV drain; see kpb_bind().
		Object.Widget.kpb.1 {
			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "micsel.$MWW_DETECT_PIPELINE_ID.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "host-copier.$MWW_WOV_PCM_ID.capture"
			}
		}
	}
]

#
# Wake-on-Voice raw capture drain
#
Object.Pipeline.host-gateway-capture [
	{
		index	$MWW_WOV_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name	"$MWW_WOV_PCM_NAME"
			pcm_id		$MWW_WOV_PCM_ID
			num_input_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels		2
					in_rate			16000
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_channels		2
					out_rate		16000
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

#
# micsel -> MFCC -> MWW detection
#
Object.Pipeline.host-gateway-micsel-mfcc-mww-capture [
	{
		index	$MWW_DETECT_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name	"$MWW_DETECT_PCM_NAME"
			pcm_id		$MWW_DETECT_PCM_ID
		}

		Object.Widget.micsel.1 {
			Object.Control {
				bytes."1" {
					name "$MWW_DETECT_PCM_NAME Micsel bytes"
					<include/components/micsel/downmix_stereo_to_doublemono.conf>
				}
			}
		}

		Object.Widget.mfcc.1 {
			Object.Control {
				bytes."1" {
					name "$MWW_DETECT_PCM_NAME MFCC bytes"
					IncludeByKey.MWW_PCAN {
						"true"	"include/components/mfcc/mel40_10ms_pcan_compress.conf"
						"false"	"include/components/mfcc/mel40_10ms_compress.conf"
					}
				}
				# Naming the VAD switch is required: alsatplg skips
				# unnamed controls, so an unnamed mixer never creates
				# the SectionControlMixer node its channel needs.
				mixer."1" {
					name "$MWW_DETECT_PCM_NAME MFCC switch"
				}
			}
		}

		Object.Widget.mww.1 {
			Object.Control {
				bytes."1" {
					name "$MWW_DETECT_PCM_NAME MWW bytes"
					max 65536
				}
			}
		}
	}
]

#
# Routes
#
Object.Base.route [
	# Playback: host -> dai
	{
		source	"host-copier.$SSP0_PLAYBACK_PCM_ID.playback"
		sink	"dai-copier.SSP.NoCodec-0.playback"
	}
	# Capture: dai -> SRC
	{
		source	"dai-copier.SSP.NoCodec-0.capture"
		sink	"src.$MWW_KPB_PIPELINE_ID.1"
	}
	# KPB -> WoV host drain
	{
		source	"kpb.$MWW_KPB_PIPELINE_ID.1"
		sink	"host-copier.$MWW_WOV_PCM_ID.capture"
	}
	# KPB -> detection branch
	{
		source	"kpb.$MWW_KPB_PIPELINE_ID.1"
		sink	"micsel.$MWW_DETECT_PIPELINE_ID.1"
	}
]

#
# PCMs
#
Object.PCM.pcm [
	{
		name	"Port0"
		id	$SSP0_PLAYBACK_PCM_ID
		direction	"playback"

		Object.Base.fe_dai.1 {
			name	"Port0"
		}

		Object.PCM.pcm_caps.1 {
			name	"SSP0 Playback"
			formats	'S16_LE,S24_LE,S32_LE'
			rates	'48000'
			channels_min	1
			channels_max	2
		}
	}
	{
		name	"$MWW_WOV_PCM_NAME"
		id	$MWW_WOV_PCM_ID
		direction	"capture"

		Object.Base.fe_dai.1 {
			name	"$MWW_WOV_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name	"$MWW_WOV_PCM_NAME"
			formats	'S32_LE'
			rates	'16000'
			channels_min	2
			channels_max	2
		}
	}
	{
		name	"$MWW_DETECT_PCM_NAME"
		id	$MWW_DETECT_PCM_ID
		direction	"capture"

		Object.Base.fe_dai.1 {
			name	"$MWW_DETECT_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name	"$MWW_DETECT_PCM_NAME"
			formats	'S32_LE'
			rates	'16000'
			channels_min	2
			channels_max	2
		}
	}
]
