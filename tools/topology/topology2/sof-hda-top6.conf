#
# Top 6 DSP offload topology for Sound Open Firmware (SOF)
#
# Chains the top 6 DSP processing modules in the HDA Analog playback pipeline:
#   host-copier.0.playback -> gain.1.1 -> webrtc-hpf.1.1 -> webrtc-agc.1.1 -> equalizer.1.1 -> acompressor.1.1 -> stereowiden.1.1 -> alimiter.1.1 -> mixin.1.1 -> mixout.2.1 -> dai-copier
#
# Modules:
# 1. webrtc_hpf (UUID: 6dfb1bea-d858-4ef7-92abcf5b4ee48159) - IIR High-Pass Filter (<80 Hz)
# 2. webrtc_agc (UUID: 0af7b529-9dc7-4bee-a8b159e8fbe414f3) - Digital Automatic Gain Control (+9 dB)
# 3. equalizer  (UUID: c335390a-6ad4-4f48-b0a9-807f6e5d4c32) - Parametric Equalizer / Bass Boost
# 4. acompressor(UUID: d4464a1b-7be5-4059-c1ba-91807f6e5d43) - Dynamic Range Compressor
# 5. stereowiden(UUID: b22428f9-59c3-4e37-af98-7f6e5d4c3b21) - Stereo Widener / Spatial Enhancer
# 6. alimiter   (UUID: 1207af73-f9c0-4f65-92b49d45178fc9a8) - FFmpeg Lookahead Peak Limiter (0.950)
#

<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/dais>
<searchdir:include/pipelines>
<searchdir:include/pipelines/cavs>
<searchdir:platform>
<searchdir:platform/intel>

Define {
	HDA_CONFIG		"mix"
	TOP6_PROCESSING		"true"
	AEC_PROCESSING		"true"
}

<sof-hda-generic.conf>
