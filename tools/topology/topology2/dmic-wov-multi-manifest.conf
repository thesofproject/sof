# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------
Object.Base.route [

	# DAI copier → VAD Gate → KPB → Mixin (pipeline 100 internal)
	{
		source "dai-copier.HDA.Analog.capture"
		sink   "vad-gate.100.1"
	}
	{
		source "vad-gate.100.1"
		sink   "kpb.100.1"
	}
	{
		source "kpb.100.1"
		sink   "mixin.100.1"
	}

	# Mixin fan-out → three Mixouts (one per KPB pipeline)
	{
		source "mixin.100.1"
		sink   "mixout.101.1"
	}
	{
		source "mixin.100.1"
		sink   "mixout.102.1"
	}
	{
		source "mixin.100.1"
		sink   "mixout.103.1"
	}

	# Mixout → WOV (slot 0, no per-slot KPB; shared KPB is in pipeline 100)
	{
		source "mixout.101.1"
		sink   "wov.101.1"
	}

	# WOV_0 → WOV Arbiter input 0
	{
		source "wov.101.1"
		sink   "wov-arbiter.104.1"
	}



	# Mixout → WOV (slot 1)
	{
		source "mixout.102.1"
		sink   "wov.102.1"
	}

	# WOV_1 → WOV Arbiter input 1
	{
		source "wov.102.1"
		sink   "wov-arbiter.104.1"
	}



	# Mixout → WOV (slot 2)
	{
		source "mixout.103.1"
		sink   "wov.103.1"
	}

	# WOV_2 → WOV Arbiter input 2
	{
		source "wov.103.1"
		sink   "wov-arbiter.104.1"
	}



	# WOV Arbiter → Host copier (VAD gate is in pipeline 100, not here)
	{
		source "wov-arbiter.104.1"
		sink   "host-copier.$DMIC_PCM_ID.capture"
	}

]

# ---------------------------------------------------------------------------
# PCM (ALSA card definition for the single WOV capture stream)
# ---------------------------------------------------------------------------
Object.PCM.pcm."$DMIC_PCM_ID" {
	name    "DMIC Multi-WOV"
	id      $DMIC_PCM_ID
	direction "capture"
	capture_compatible_d0i3 1
	compress "true"

	Object.Base.fe_dai."$DMIC_PCM_CAPS" {}

	Object.PCM.pcm_caps."capture" {
		name       $DMIC_PCM_CAPS
		formats    "S16_LE,S24_LE,S32_LE"
		rates      "16000"
		channels_min 1
		channels_max 2
	}
}


Object.Dai.HDA [
	{
		name "Analog"
		dai_index 4
		id 4
		default_hw_conf_id 4
		Object.Base.hw_config.1 {
			name	"HDA0"
		}
		direction duplex
	}
]

Object.Base.manifest.1 {
	name "sof_manifest"
	Object.Base.data.1 {
		name "SOF ABI"
		bytes	"0x03,0x00,0x1d,0x00,0x01,0x00"
	}
}
