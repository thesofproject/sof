#
# detect_test UUID (keyword energy detector — fires on a hand clap in the lab)
# This matches the 'keyword' UUID registered in uuid-registry.txt.
#
Define {
	KWD_TEST_UUID  "1f:d5:a8:eb:27:78:b5:47:82:ee:de:6e:77:43:af:67"
	WOV_UUID       "1f:d5:a8:eb:27:78:b5:47:82:ee:de:6e:77:43:af:67"

	# WOV arbiter UUID (registered in uuid-registry.txt as 'wov_arbiter')
	WOV_ARB_UUID   "7d:6c:5b:4a:9f:8e:1b:4a:2c:3d:4e:5f:60:71:82:93"

	# VAD gate UUID (registered in uuid-registry.txt as 'vad_gate')
	VAD_GATE_UUID  "5f:6e:7d:8c:3b:4a:1d:2c:0e:9f:8a:7b:6c:5d:4e:3f"

	# DMIC DAI configuration — adjust for target hardware
	DMIC_DAI_INDEX  1
	DMIC_PCM_ID    11
	DMIC_NAME      "dmic16k"
	DMIC_PCM_CAPS  "Gain Capture 11"
	FORMAT         "s32le"

	# Detector cycle budget — clap test requires very little compute
	KWD_CPC        100000
	WOV_ARB_CPC    20000
	VAD_GATE_CPC   5000
}

# ---------------------------------------------------------------------------
# Pipeline 100 — DAI (Core 0)
# DMIC DAI copier → VAD Gate → KPB → Mixin (fan-out to 3 Mixouts in 101/102/103)
# ---------------------------------------------------------------------------
Object.Pipeline.dai-mixin-be [
	{
		direction  "capture"
		format     $FORMAT
		rate       16000
		rate_min   16000
		rate_max   16000
		index      100

		Object.Widget.dai-copier.1 {
			dai_index	4
			type		"dai_out"
			dai_type	"HDA"
			copier_type	"HDA"
			stream_name	"Analog"
			direction	"capture"
			node_type $HDA_LINK_INPUT_CLASS
			num_input_audio_formats 4
			num_output_audio_formats 4
			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
				{
					in_rate             16000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
				{
					in_rate             48000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]

			Object.Base.output_audio_format [
				{
					out_rate            48000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
				{
					out_rate            16000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
				{
					out_rate            48000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.mixin.1 {
			type     "mixer"
			mix_type "mix_in"

			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget."vad-gate".1 {
			uuid   $VAD_GATE_UUID
			cpc    $VAD_GATE_CPC

			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 128
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 128
				}
			]
		}

		Object.Widget.kpb.1 {
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 128
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 128
				}
			]

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "mixin.100.1"
