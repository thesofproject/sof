#
# Multi-KPB Wake-on-Voice topology
#
# Captures from one DMIC; audio passes through a VAD gate then a shared KPB
# before being fanned out to three WOV detector pipelines.  A single 192 KB
# KPB buffer (vs 3 × 192 KB = 576 KB in the per-slot design) serves all
# three detect_test instances.  When any detector fires, the WOV arbiter
# activates that slot, pauses the other two via the SOF notifier, and drains
# audio to the single host PCM compress stream.
#
# Core assignments
#   Core 0 : DMIC copier + VAD Gate + KPB + Mixin + WOV 0 & 1
#   Core 1 : WOV 2
#   Core 0 : WOV Arbiter + Host copier
#
# Pipeline IDs used
#   100  DAI pipeline  : DMIC DAI copier → VAD Gate → KPB → Mixin
#   101  WOV pipeline  : Mixout_0 → WOV_0                  (Core 0)
#   102  WOV pipeline  : Mixout_1 → WOV_1                  (Core 0)
#   103  WOV pipeline  : Mixout_2 → WOV_2                  (Core 1)
#   104  Host pipeline : WOV Arbiter → Host copier          (Core 0)
#
# Requires
#   CONFIG_COMP_KPB=y
#   CONFIG_COMP_WOV_ARBITER=y
#   CONFIG_COMP_VAD_GATE=y
#   CONFIG_COMP_MIXIN_MIXOUT=y
#   CONFIG_AMS=y
#   CONFIG_COMP_KWD_DETECT (detect_test sample)

<include/common/input_audio_format.conf>
<include/common/output_audio_format.conf>
<include/components/dai-copier.conf>
<include/components/host-copier.conf>
<include/components/kpb.conf>
