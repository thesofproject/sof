Define {
	HDA_CONFIG			"none"
	PLATFORM			"none"
	ANALOG_PLAYBACK_PCM		'Analog Playback'
	ANALOG_CAPTURE_PCM		'HDA Mic TFLM WoV Capture'
	HDA_ANALOG_DAI_NAME		'Analog'
	HDA_ANALOG_CAPTURE_RATE		16000
	HDA_ANALOG_PLAYBACK_RATE	16000
	HDA_TFLM_CAPTURE_PCM_ID		0
	HDA_TFLM_HOST_PIPELINE_ID	0
	HDA_TFLM_DETECT_PIPELINE_ID	1
	HDA_TFLM_DAI_PIPELINE_ID	2
}

# Override defaults with platform-specific config if set
IncludeByKey.PLATFORM {
	"mtl"	"platform/intel/mtl.conf"
	"lnl"	"platform/intel/lnl.conf"
	"ptl"	"platform/intel/ptl.conf"
}

Object.Dai.HDA [
	{
		name $HDA_ANALOG_DAI_NAME
		dai_index 0
		id 4
		default_hw_conf_id 4
		Object.Base.hw_config.1 {
			name	"HDA0"
		}
		direction duplex
	}
]

Object.Pipeline {
	host-gateway-capture [
		{
			index $HDA_TFLM_HOST_PIPELINE_ID

			Object.Widget.host-copier.1 {
				stream_name $ANALOG_CAPTURE_PCM
				pcm_id $HDA_TFLM_CAPTURE_PCM_ID
				num_input_audio_formats 1
				num_output_audio_formats 1
				Object.Base.input_audio_format [
					{
						in_rate			$HDA_ANALOG_CAPTURE_RATE
						in_bit_depth		32
						in_valid_bit_depth	32
					}
				]
				Object.Base.output_audio_format [
					{
						out_rate		$HDA_ANALOG_CAPTURE_RATE
						out_bit_depth		32
						out_valid_bit_depth	32
					}
				]
			}
		}
	]

	host-gateway-src-mfcc-tflm-capture [
		{
			index $HDA_TFLM_DETECT_PIPELINE_ID
		}
	]

	dai-copier-gain-module-copier-capture [
		{
			index $HDA_TFLM_DAI_PIPELINE_ID

			Object.Widget.dai-copier.1 {
				dai_type	"HDA"
				type		"dai_out"
				copier_type	"HDA"
				stream_name	$HDA_ANALOG_DAI_NAME
				node_type	$HDA_LINK_INPUT_CLASS
				num_output_pins 1
				num_input_audio_formats 1
				num_output_audio_formats 1
				Object.Base.input_audio_format [
					{
						in_rate			$HDA_ANALOG_CAPTURE_RATE
						in_bit_depth		32
						in_valid_bit_depth	32
					}
				]
				Object.Base.output_audio_format [
					{
						out_rate		$HDA_ANALOG_CAPTURE_RATE
						out_bit_depth		32
						out_valid_bit_depth	32
					}
				]
			}

			Object.Widget.gain.1 {
				num_input_audio_formats 1
				num_output_audio_formats 1
				Object.Base.input_audio_format [
					{
						in_rate			$HDA_ANALOG_CAPTURE_RATE
						in_bit_depth		32
						in_valid_bit_depth	32
					}
				]
				Object.Base.output_audio_format [
					{
						out_rate		$HDA_ANALOG_CAPTURE_RATE
						out_bit_depth		32
						out_valid_bit_depth	32
					}
				]
				Object.Control.mixer.1 {
					name 'HDA Mic Capture Volume'
				}
			}

			Object.Widget.kpb.1 {
				num_input_audio_formats 1
				num_output_audio_formats 1
				Object.Base.input_audio_format [
					{
						in_rate			$HDA_ANALOG_CAPTURE_RATE
						in_bit_depth		32
						in_valid_bit_depth	32
					}
				]
				Object.Base.output_audio_format [
					{
						out_rate		$HDA_ANALOG_CAPTURE_RATE
						out_bit_depth		32
						out_valid_bit_depth	32
					}
				]
			}
		}
	]
}

Object.Base.route [
	{
		source "dai-copier.HDA.$HDA_ANALOG_DAI_NAME.capture"
		sink "gain.$HDA_TFLM_DAI_PIPELINE_ID.1"
	}
	{
		source "gain.$HDA_TFLM_DAI_PIPELINE_ID.1"
		sink "kpb.$HDA_TFLM_DAI_PIPELINE_ID.1"
	}
	# KPB output pin 1 -> Real-time detection path (SRC -> MFCC -> TFLM)
	{
		source "kpb.$HDA_TFLM_DAI_PIPELINE_ID.1"
		sink "src.$HDA_TFLM_DETECT_PIPELINE_ID.1"
	}
	# KPB output pin 2 -> Host WoV Draining PCM capture stream
	{
		source "kpb.$HDA_TFLM_DAI_PIPELINE_ID.1"
		sink "host-copier.$HDA_TFLM_CAPTURE_PCM_ID.capture"
	}
]

Object.Widget.virtual [
	{
		name 'codec0_in'
		type input
		index 1
	}
	{
		name 'codec1_in'
		type input
		index 2
	}
	{
		name 'codec2_in'
		type input
		index 3
	}
	{
		name 'codec0_out'
		type output
		index 4
	}
	{
		name 'codec1_out'
		type output
		index 5
	}
	{
		name 'codec2_out'
		type output
		index 6
	}
	{
		name 'Analog CPU Playback'
		type out_drv
		index 7
	}
	{
		name 'Digital CPU Playback'
		type out_drv
		index 8
	}
	{
		name 'Alt Analog CPU Playback'
		type out_drv
		index 9
	}
	{
		name 'Analog CPU Capture'
		type input
		index 10
	}
	{
		name 'Digital CPU Capture'
		type input
		index 11
	}
	{
		name 'Alt Analog CPU Capture'
		type input
		index 12
	}
]

Object.PCM.pcm [
	{
		name	'HDA Analog'
		id	$HDA_TFLM_CAPTURE_PCM_ID
		direction "capture"

		Object.Base.fe_dai.1 {
			name "HDA Analog"
		}

		Object.PCM.pcm_caps.1 {
			name $ANALOG_CAPTURE_PCM
			formats 'S32_LE'
			rates '16000'
			channels_min 1
			channels_max 1
		}
	}
]
