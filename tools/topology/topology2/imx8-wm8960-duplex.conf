##
## IPC4 topology for i.MX8MP with WM8960 codec - duplex (playback + capture)
##
## Pipeline graph:
##
##   Playback:
##   host-copier.0.playback -> gain.1.1 -> dai-copier.SAI.saiN-codec.playback
##
##   Capture:
##   dai-copier.SAI.saiN-codec.capture -> gain.2.1 -> host-copier.1.capture
##

# Include paths
<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/controls>
<searchdir:include/dais>
<searchdir:include/pipelines>

# Class definitions
<vendor-token.conf>
<hw_config_imx.conf>
<tokens.conf>
<module-copier.conf>
<dai.conf>
<data.conf>
<pcm.conf>
<pcm_caps.conf>
<fe_dai.conf>
<sai.conf>
<manifest.conf>
<route.conf>
<pipeline.conf>
<gain-playback.conf>
<gain-capture.conf>
<dai-copier.conf>
<host-copier.conf>
<dai-copier-io.conf>
<common_definitions.conf>

Define {
	# Playback PCM
	HEADSET_PLAYBACK_PCM_STREAM_NAME	"Headset Playback"
	# Capture PCM
	HEADSET_CAPTURE_PCM_STREAM_NAME		"Headset Capture"
	HEADSET_PCM_NAME			"Headset"
	HEADSET_PCM_ID				0
}

#
# Playback pipeline: host-copier.0.playback -> gain.1.1
#
Object.Pipeline {
	gain-playback [
		{
			index	1

			Object.Widget.host-copier.1 {
				stream_name	$HEADSET_PLAYBACK_PCM_STREAM_NAME
				pcm_id		$HEADSET_PCM_ID
			}

			Object.Widget.gain.1 {
				curve_type	"windows_fade"
				Object.Control.mixer.1 {
					name	'PGA Playback Volume'
				}
			}

			time_domain	"dma"
			format		"s32le"
			num_input_audio_formats		3
			num_output_audio_formats	1
		}
	]

	#
	# Capture pipeline: gain.2.1 -> host-copier.1.capture
	#
	gain-capture [
		{
			index	2

			Object.Widget.host-copier.1 {
				stream_name	$HEADSET_CAPTURE_PCM_STREAM_NAME
				pcm_id		$HEADSET_PCM_ID
			}

			Object.Widget.gain.1 {
				curve_type	"windows_fade"
				Object.Control.mixer.1 {
					name	'Capture Volume'
				}
			}

			time_domain	"dma"
			format		"s32le"
			num_input_audio_formats		1
			num_output_audio_formats	2
		}
	]
}

#
# DAI pipelines - one SAI DAI for playback, one for capture. Each dai-copier
# needs its own pipeline/scheduler (dai-copier-io-playback/-capture) so
# sof_complete() actually visits it and populates the widget's IPC struct -
# a bare Object.Widget.dai-copier has no pipeline_id and is silently
# skipped.
#
Object.Pipeline.dai-copier-io-playback [
	{
		index	3

		Object.Widget.dai-copier.1 {
			dai_index	$SAI_DAI_INDEX
			dai_type	"SAI"
			copier_type	"SAI"
			stream_name	$STREAM_CODEC_NAME
			node_type	$SAI_LINK_OUTPUT_CLASS
		}
	}
]
Object.Pipeline.dai-copier-io-capture [
	{
		index	4

		Object.Widget.dai-copier.1 {
			dai_index	$SAI_DAI_INDEX
			dai_type	"SAI"
			copier_type	"SAI"
			stream_name	$STREAM_CODEC_NAME
			node_type	$SAI_LINK_INPUT_CLASS
		}
	}
]

# PCM definitions - single PCM with both playback and capture directions
# BE DAI: hw_config makes the codec the BCLK/FSYNC provider (as in IPC3)
Object.Dai.SAI [
	{
		id		0
		dai_index	$SAI_DAI_INDEX
		direction	"duplex"
		name		$STREAM_CODEC_NAME
		sample_bits	32

		Object.Base.hw_config.1 {
			name		"SAI3"
			id		0
			format		"I2S"
			mclk		"codec_mclk_in"
			mclk_freq	12288000
			bclk		"codec_provider"
			bclk_freq	3072000
			fsync		"codec_provider"
			fsync_freq	48000
			tdm_slots	2
			tdm_slot_width	32
			tx_slots	3
			rx_slots	3
		}
	}
]

Object.PCM.pcm [
	{
		name		$HEADSET_PCM_NAME
		id		$HEADSET_PCM_ID
		direction	"duplex"

		Object.Base.fe_dai.1 {
			name	"$HEADSET_PCM_NAME"
		}

		Object.PCM.pcm_caps.playback {
			name	$HEADSET_PLAYBACK_PCM_STREAM_NAME
			formats	'S32_LE,S24_LE,S16_LE'
		}

		Object.PCM.pcm_caps.capture {
			name	$HEADSET_CAPTURE_PCM_STREAM_NAME
			formats	'S32_LE,S24_LE,S16_LE'
		}
	}
]

# Widget routing
Object.Base.route [
	# Playback: host -> gain -> SAI DAI
	{
		source	"host-copier.$HEADSET_PCM_ID.playback"
		sink	"gain.1.1"
	}
	{
		source	"gain.1.1"
		sink	"dai-copier.SAI.$STREAM_CODEC_NAME.playback"
	}
	# Capture: SAI DAI -> gain -> host
	{
		source	"dai-copier.SAI.$STREAM_CODEC_NAME.capture"
		sink	"gain.2.1"
	}
	{
		source	"gain.2.1"
		sink	"host-copier.$HEADSET_PCM_ID.capture"
	}
]
