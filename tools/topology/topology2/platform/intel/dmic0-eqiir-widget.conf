# Included by platform/intel/dmic-generic.conf as the content of the DMIC0
# IIR widget. The widget is in the DMIC0 DAI capture pipeline, or with
# INCLUDE_WOV=multi in the DMIC0 host pipeline.
Object.Control.bytes."1" {
	name 'DMIC0 Capture IIR Eq'
	IncludeByKey.DMIC0_DAI_EQIIR {
		"passthrough"		"include/components/eqiir/passthrough.conf"
		"highpass_40hz_0db"	"include/components/eqiir/highpass_40hz_0db_48khz.conf"
		"highpass_40hz_20db"	"include/components/eqiir/highpass_40hz_20db_48khz.conf"
	}
}
num_input_audio_formats	    1
num_output_audio_formats    1
IncludeByKey.NUM_DMICS {
	"1" {
		Object.Base.input_audio_format [
			{
				in_rate			$DMIC0_RATE
				in_channels		1
				in_bit_depth		32
				in_valid_bit_depth	32
				in_ch_cfg	$CHANNEL_CONFIG_MONO
				in_ch_map	$CHANNEL_MAP_MONO
			}
		]
		Object.Base.output_audio_format [
			{
				out_rate		$DMIC0_RATE
				out_channels		1
				out_bit_depth		32
				out_valid_bit_depth	32
				out_ch_cfg	$CHANNEL_CONFIG_MONO
				out_ch_map	$CHANNEL_MAP_MONO
			}
		]
	}
	"2" {
		Object.Base.input_audio_format [
			{
				in_rate			$DMIC0_RATE
				in_bit_depth		32
				in_valid_bit_depth	32
			}
		]
		Object.Base.output_audio_format [
			{
				out_rate		$DMIC0_RATE
				out_bit_depth		32
				out_valid_bit_depth	32
			}
		]
	}
	"4" {
		Object.Base.input_audio_format [
			{
				in_rate			$DMIC0_RATE
				in_channels		4
				in_bit_depth		32
				in_valid_bit_depth	32
				in_ch_cfg	$CHANNEL_CONFIG_3_POINT_1
				in_ch_map	$CHANNEL_MAP_3_POINT_1
			}
		]
		Object.Base.output_audio_format [
			{
				out_rate		$DMIC0_RATE
				out_channels		4
				out_bit_depth		32
				out_valid_bit_depth	32
				out_ch_cfg	$CHANNEL_CONFIG_3_POINT_1
				out_ch_map	$CHANNEL_MAP_3_POINT_1
			}
		]
	}
}
