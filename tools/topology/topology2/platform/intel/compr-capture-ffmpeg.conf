#
# Compress *capture* (encode) instance driven by the FFmpeg (libavcodec)
# encoder widget "ffmpeg_enc". It is the mirror of platform/intel/compr-ffmpeg.conf
# (compress playback / decode), but in the opposite direction:
#
#   HDA analog capture BE --> mixin.4.1 --> mixout (own LL pipeline)
#                                       --> ffmpeg_enc (DP, PCM -> MP3)
#                                       --> aif_out host-copier --> host
#
# PCM arrives already converted to S32 48 kHz 2ch at the capture BE fan-out tap.
# In cavs-mixin-mixout-hda.conf the capture BE (when COMPR_FFMPEG_ENC is set) is
# rebuilt around a single mixin (mixin.4.1) that fans out to two mixouts via the
# proven mixer path: mixout.3.1 in the normal analog capture FE, and the encoder
# tap mixout (COMPR_ENC_SOURCE -> mixout.$COMPR_ENC_MIXOUT_PIPELINE_ID.1). That
# tap mixout lives in its OWN timer-scheduled pipeline (mixout-capture, id
# COMPR_ENC_MIXOUT_PIPELINE_ID) rather than in the encoder pipeline: a DP module
# breaks the LL copy walk, so a mixout sharing the encoder pipeline would sit on
# the far side of the break from that pipeline's sink scheduler and never run.
# The standalone mixout self-schedules on the timer, drains the mixin, and its
# output crosses the pipeline boundary into the DP encoder's input ring. The
# encoder compresses to an MP3 elementary stream that the aif_out host-copier
# DMAs to the host (read with crecord). MP3 is self-describing (the mpegaudio
# frame header syncs the decoder), so no codec-setup / extradata control is
# needed here.
#
# Why a mixin fan-out and not a copier 2nd output pin: a module-copier's second
# output pin does not deliver data across a pipeline boundary (the encoder DP
# module starved on an empty input ring), whereas mixin->mixout - the same node
# playback uses to mix/route across pipelines - does deliver.
#
# Gated on its own IncludeByKey.COMPR_FFMPEG_ENC so the stock capture path and the
# decode compr-ffmpeg path are unaffected. Uses its own COMPR_ENC_* defines
# (pipeline id 91, pcm id 51) so it can coexist with the decode compress PCM.
#
# COMPR_ENC_SOURCE is the capture-BE mixin fan-out tap; it is platform specific
# and set in cavs-mixin-mixout-hda.conf, where the capture BE is rebuilt around
# the mixer when COMPR_FFMPEG_ENC is enabled.
#

IncludeByKey.COMPR_FFMPEG_ENC {
"true"	{
	# Standalone timer-scheduled mixout that taps the capture-BE mixin
	# fan-out and feeds the DP encoder pipeline across a pipeline boundary.
	# It must be its own pipeline: a DP module (ffmpeg_enc) breaks the LL
	# copy walk, so a mixout sharing the encoder pipeline would sit on the
	# far side of the break from that pipeline's sink scheduler and never
	# run. Alone, the mixout is its pipeline's sink (== scheduling comp) and
	# self-schedules on the timer, draining the mixin every period.
	Object.Pipeline.mixout-capture [
		{
			index $COMPR_ENC_MIXOUT_PIPELINE_ID
			Object.Widget.mixout.1 {}
		}
	]

	Object.Pipeline.compr-capture-ffmpeg [
		{
			index $COMPR_ENC_PIPELINE_ID

			Object.Widget.host-copier.1 {
				stream_name $COMPR_ENC_PCM_NAME
				pcm_id $COMPR_ENC_PCM_ID
				<include/formats/compr_input_audio_formats.conf>
				<include/formats/compr_output_audio_formats.conf>
			}

			Object.Widget.ffmpeg_enc.1 {
				# Encoder runs on the DP thread, core 0, so prepare()
				# and avcodec_open2 stay local (no cross-core IDC). The
				# fixed-point libshine encoder is far shallower than the
				# AAC-float decoder, but MP3 must accumulate a full
				# 1152-sample (24 ms) frame before it emits a packet, so
				# the DP ring supplies headroom a 2 ms LL buffer lacks.
				core_id 0
				stack_bytes_requirement 65536
				heap_bytes_requirement 131072
				<include/formats/compr_input_audio_formats.conf>
				<include/formats/compr_output_audio_formats.conf>
			}
		}
	]

	Object.PCM.pcm [
		{
			name $COMPR_ENC_PCM_NAME
			id $COMPR_ENC_PCM_ID
			direction capture
			compress "true"

			Object.Base.fe_dai.1 {
				name "$COMPR_ENC_PCM_NAME"
			}

			Object.PCM.pcm_caps.1 {
				name $COMPR_ENC_PCM_NAME
				formats 'S32_LE'
				rates '8000'
			}
		}
	]

	Object.Base.route [
		{
			# capture-BE mixin fan-out tap -> the standalone LL mixout
			source $COMPR_ENC_SOURCE
			sink mixout.$COMPR_ENC_MIXOUT_PIPELINE_ID.1
		}
		{
			# LL mixout -> DP encoder, crossing the pipeline boundary
			source mixout.$COMPR_ENC_MIXOUT_PIPELINE_ID.1
			sink ffmpeg_enc.$COMPR_ENC_PIPELINE_ID.1
		}
		{
			source ffmpeg_enc.$COMPR_ENC_PIPELINE_ID.1
			sink host-copier.$COMPR_ENC_PCM_ID.capture
		}
	]
}
}
