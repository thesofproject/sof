#
# Compress *capture* (encode) instance driven by the FFmpeg (libavcodec)
# encoder widget "ffmpeg_enc". It is the mirror of platform/intel/compr-ffmpeg.conf
# (compress playback / decode), but in the opposite direction:
#
#   HDA analog capture BE  -->  module-copier (LL head)  -->  ffmpeg_enc (PCM -> MP3)
#                                                        -->  aif_out host-copier
#
# PCM arrives already converted to S32 48 kHz at the capture BE tap point
# (module-copier.4.2 in cavs-mixin-mixout-hda.conf). The BE feeds the LL head
# copier (module-copier.$COMPR_ENC_PIPELINE_ID.2) of this pipeline, which in turn
# feeds the DP encoder in-pipeline. The encoder compresses to an MP3 elementary
# stream that the aif_out host-copier DMAs to the host (read with crecord). MP3 is
# self-describing (the mpegaudio frame header syncs the decoder), so no
# codec-setup / extradata control is needed here.
#
# Gated on its own IncludeByKey.COMPR_FFMPEG_ENC so the stock capture path and the
# decode compr-ffmpeg path are unaffected. Uses its own COMPR_ENC_* defines
# (pipeline id 91, pcm id 51) so it can coexist with the decode compress PCM.
#
# COMPR_ENC_SOURCE is the capture-BE fan-out tap; it is platform specific and set
# in cavs-mixin-mixout-hda.conf, where module-copier.4.2 also gets num_output_pins
# bumped so the second consumer (this pipeline's head copier) is legal.
#

IncludeByKey.COMPR_FFMPEG_ENC {
"true"	{
	Object.Pipeline.compr-capture-ffmpeg [
		{
			index $COMPR_ENC_PIPELINE_ID

			Object.Widget.module-copier.2 {
				<include/formats/compr_input_audio_formats.conf>
				<include/formats/compr_output_audio_formats_s32.conf>
			}

			Object.Widget.host-copier.1 {
				stream_name $COMPR_ENC_PCM_NAME
				pcm_id $COMPR_ENC_PCM_ID
				<include/formats/compr_input_audio_formats.conf>
				<include/formats/compr_output_audio_formats.conf>
			}

			Object.Widget.ffmpeg_enc.1 {
				# Encoder runs on the DP thread, core 0, so prepare()
				# and avcodec_open2 stay local (no cross-core IDC). The
				# fixed-point libshine encoder is far shallower than the
				# AAC-float decoder, but MP3 must accumulate a full
				# 1152-sample (24 ms) frame before it emits a packet, so
				# the DP ring supplies headroom a 2 ms LL buffer lacks.
				core_id 0
				stack_bytes_requirement 65536
				heap_bytes_requirement 131072
				<include/formats/compr_input_audio_formats.conf>
				<include/formats/compr_output_audio_formats.conf>
			}
		}
	]

	Object.PCM.pcm [
		{
			name $COMPR_ENC_PCM_NAME
			id $COMPR_ENC_PCM_ID
			direction capture
			compress "true"

			Object.Base.fe_dai.1 {
				name "$COMPR_ENC_PCM_NAME"
			}

			Object.PCM.pcm_caps.1 {
				name $COMPR_ENC_PCM_NAME
				formats 'S32_LE'
				rates '8000'
			}
		}
	]

	Object.Base.route [
		{
			source $COMPR_ENC_SOURCE
			sink module-copier.$COMPR_ENC_PIPELINE_ID.2
		}
		{
			source ffmpeg_enc.$COMPR_ENC_PIPELINE_ID.1
			sink host-copier.$COMPR_ENC_PCM_ID.capture
		}
	]
}
}
