#
# HDA analog playback echo reference for the multi-slot WoV ECNS
#
# drc.2.1 -> module-copier.2.2 -> dai-copier.HDA.$HDA_ANALOG_DAI_NAME.playback
# module-copier.2.2 -> siggen.$WOV_ECHO_REF_PIPELINE_ID.1
#
# The module-copier duplicates the analog playback to the echo reference
# pipeline defined in dmic-wov-multi.conf. When the playback is not running
# the siggen produces silence.
#
# Note: HDA has no loopback or virtual capture DAI to act as the dai_out
# widget that starts the setup of the echo reference pipeline, as the
# Loopback_Virtual DAI does for SoundWire.
#
# Requires INCLUDE_WOV=multi.
#

Object.Widget.module-copier."2" {
	index 2
	num_input_pins 1
	num_output_pins 2
	num_input_audio_formats 1
	num_output_audio_formats 1
	Object.Base.input_audio_format [
		{
			in_rate			$HDA_ANALOG_PLAYBACK_RATE
			in_bit_depth		32
			in_valid_bit_depth	32
		}
	]
	Object.Base.output_audio_format [
		{
			out_rate		$HDA_ANALOG_PLAYBACK_RATE
			out_bit_depth		32
			out_valid_bit_depth	32
		}
	]
}

Object.Base.route [
	{
		source	'drc.2.1'
		sink	'module-copier.2.2'
	}
	{
		source	'module-copier.2.2'
		sink	'dai-copier.HDA.$HDA_ANALOG_DAI_NAME.playback'
	}
	{
		source	'module-copier.2.2'
		sink	'siggen.$WOV_ECHO_REF_PIPELINE_ID.1'
	}
]
