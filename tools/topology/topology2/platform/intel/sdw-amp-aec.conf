#
# Mono 16 kHz WebRTC AEC for SoundWire DMIC with speaker echo reference.
#
# module-copier.41.0 (SDW DMIC, 48 kHz stereo) -> micsel.141.1 (L+R)/2 ->
#	src.141.1 (48 -> 16 kHz) -> webrtc-aec.140.1 pin 0
# speaker echo reference siggen.120.1 (48 kHz stereo) -> micsel.120.1 (L+R)/2 ->
#	src.120.1 (48 -> 16 kHz) -> webrtc-aec.140.1 pin 1
# webrtc-aec.140.1 -> host-copier PCM "Microphone AEC Capture" (16 kHz mono)
#
# Included from sdw-amp-echo-ref.conf when SDW_SPK_AEC_CAPTURE_PCM is true. The echo
# reference DAI (SDW_ECHO_REF_DAI) must be enabled.

Class.Pipeline."sdw-aec-capture" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  0
	}

	period           1000
	direction        "capture"
	time_domain      "timer"
	dynamic_pipeline 1
}

Define {
	SDW_AEC_PCM_ID			14
	SDW_AEC_PCM_NAME		"Microphone AEC Capture"
	SDW_AEC_PIPELINE_ID		140
	SDW_AEC_MIC_PIPELINE_ID		141
}

# Echo reference: siggen -> micsel stereo to mono -> SRC 48 kHz to 16 kHz
Object.Pipeline."sdw-aec-capture" [
	{
		index	$SDW_SPK_ECHO_REF_PIPELINE_ID

		Object.Widget.siggen.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.micsel.1 {
			num_input_audio_formats  1
			num_output_audio_formats 1
			Object.Control.bytes."1" {
				name "AEC reference micsel bytes"
				<include/components/micsel/downmix_stereo_to_mono.conf>
			}
			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            48000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.src.1 {
			num_input_audio_formats  1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}
	}
]

# Microphone: micsel stereo to mono -> SRC 48 kHz to 16 kHz
Object.Pipeline."sdw-aec-capture" [
	{
		index	$SDW_AEC_MIC_PIPELINE_ID

		Object.Widget.micsel.1 {
			num_input_audio_formats  1
			num_output_audio_formats 1
			Object.Control.bytes."1" {
				name "AEC microphone micsel bytes"
				<include/components/micsel/downmix_stereo_to_mono.conf>
			}
			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            48000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.src.1 {
			num_input_audio_formats  1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}
	}
]

# AEC and host capture
Object.Pipeline.host-gateway-capture [
	{
		index	$SDW_AEC_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name	$SDW_AEC_PCM_NAME
			pcm_id		$SDW_AEC_PCM_ID
			num_input_audio_formats  1
			num_output_audio_formats 2
			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}
	}
]

Object.Widget.webrtc-aec.1 {
	index		$SDW_AEC_PIPELINE_ID
	num_input_pins	2

	Object.Control {
		mixer."1" {
			name "AEC switch"
		}
		mixer."2" {
			name "AEC high suppression switch"
		}
	}

	Object.Base.input_pin_binding.1 {
		input_pin_binding_name "src.$SDW_AEC_MIC_PIPELINE_ID.1"
	}
	Object.Base.input_pin_binding.2 {
		input_pin_binding_name "src.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
	}

	Object.Base.input_audio_format [
		{
			input_pin_index     0
			in_rate             16000
			in_channels         1
			in_ch_cfg           $CHANNEL_CONFIG_MONO
			in_ch_map           $CHANNEL_MAP_MONO
			in_bit_depth        32
			in_valid_bit_depth  32
			ibs                 640
		}
		{
			input_pin_index     1
			in_rate             16000
			in_channels         1
			in_ch_cfg           $CHANNEL_CONFIG_MONO
			in_ch_map           $CHANNEL_MAP_MONO
			in_bit_depth        32
			in_valid_bit_depth  32
			ibs                 640
		}
	]
	Object.Base.output_audio_format [
		{
			out_rate            16000
			out_channels        1
			out_ch_cfg          $CHANNEL_CONFIG_MONO
			out_ch_map          $CHANNEL_MAP_MONO
			out_bit_depth       32
			out_valid_bit_depth 32
			obs                 640
		}
	]
}

Object.PCM.pcm [
	{
		name	$SDW_AEC_PCM_NAME
		id	$SDW_AEC_PCM_ID
		direction "capture"
		Object.Base.fe_dai.1 {
			name $SDW_AEC_PCM_NAME
		}
		Object.PCM.pcm_caps.1 {
			name $SDW_AEC_PCM_NAME
			formats 'S16_LE,S32_LE'
			rates "16000"
			rate_min 16000
			rate_max 16000
			channels_min 1
			channels_max 1
		}
	}
]

Object.Base.route [
	{
		source "alh-copier.Loopback_Virtual.25"
		sink "siggen.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
	}
	{
		source "module-copier.21.22"
		sink   "siggen.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
	}
	{
		source "siggen.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
		sink   "micsel.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
	}
	{
		source "micsel.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
		sink   "src.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
	}
	{
		source "src.$SDW_SPK_ECHO_REF_PIPELINE_ID.1"
		sink   "webrtc-aec.$SDW_AEC_PIPELINE_ID.1"
	}
	{
		source "module-copier.41.0"
		sink   "micsel.$SDW_AEC_MIC_PIPELINE_ID.1"
	}
	{
		source "micsel.$SDW_AEC_MIC_PIPELINE_ID.1"
		sink   "src.$SDW_AEC_MIC_PIPELINE_ID.1"
	}
	{
		source "src.$SDW_AEC_MIC_PIPELINE_ID.1"
		sink   "webrtc-aec.$SDW_AEC_PIPELINE_ID.1"
	}
	{
		source "webrtc-aec.$SDW_AEC_PIPELINE_ID.1"
		sink   "host-copier.$SDW_AEC_PCM_ID.capture"
	}
]
