# Included by platform/intel/dmic-generic.conf in the DMIC0 DAI capture
# pipeline object. Gain widget with the Dmic0 volume and switch controls.
Object.Widget.gain.1 {
	curve_duration 500000
	num_input_audio_formats 2
	num_output_audio_formats 2
	num_input_audio_formats	    1
	num_output_audio_formats    1
	IncludeByKey.NUM_DMICS {
		"1" {
			Object.Base.input_audio_format [
				{
					in_rate			$DMIC0_RATE
					in_channels		1
					in_bit_depth		32
					in_valid_bit_depth	32
					in_ch_cfg	$CHANNEL_CONFIG_MONO
					in_ch_map	$CHANNEL_MAP_MONO
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		$DMIC0_RATE
					out_channels		1
					out_bit_depth		32
					out_valid_bit_depth	32
					out_ch_cfg	$CHANNEL_CONFIG_MONO
					out_ch_map	$CHANNEL_MAP_MONO
				}
			]
		}
		"2" {
			Object.Base.input_audio_format [
				{
					in_rate			$DMIC0_RATE
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		$DMIC0_RATE
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
		"4" {
			Object.Base.input_audio_format [
				{
					in_rate			$DMIC0_RATE
					in_channels		4
					in_bit_depth		32
					in_valid_bit_depth	32
					in_ch_cfg	$CHANNEL_CONFIG_3_POINT_1
					in_ch_map	$CHANNEL_MAP_3_POINT_1
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		$DMIC0_RATE
					out_channels		4
					out_bit_depth		32
					out_valid_bit_depth	32
					out_ch_cfg	$CHANNEL_CONFIG_3_POINT_1
					out_ch_map	$CHANNEL_MAP_3_POINT_1
				}
			]
		}
	}
	Object.Control.mixer.1 {
		name 'Dmic0 Capture Volume'
	}
	Object.Control.mixer.2 {
		name 'Dmic0 Capture Switch'

		mute_led_use 		1
		mute_led_direction	1
	}
}
