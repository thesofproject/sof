#
# Deep buffer playback FE for Bluetooth audio offload (SSP2-BT).
#
# Included by platform/intel/bt-generic.conf when BT_DEEP_BUFFER is true and
# BT_DEEPBUFFER_FW_DMA_MS is in range (1..1000 ms). Instantiates a dedicated
# deepbuffer-playback pipeline (lp_mode = 1, D0i3 streaming compatible) on the
# BT_DEEP_BUFFER_* variables and routes its mixin into the shared BT playback
# mixout pipeline ($BT_PB_DAI_PIPELINE_ID).

Object.Pipeline.deepbuffer-playback [
	{
		index $BT_DEEP_BUFFER_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name $BT_DEEP_BUFFER_PCM_NAME
			pcm_id $BT_DEEP_BUFFER_PCM_ID
			deep_buffer_dma_ms $BT_DEEPBUFFER_FW_DMA_MS
			<include/formats/bt_host_input_audio_formats.conf>
			<include/formats/bt_s32_output_audio_formats.conf>
		}
		Object.Widget.gain.1 {
			Object.Control.mixer.1 {
				name 'Pre Mixer $BT_DEEP_BUFFER_PCM_NAME Volume'
			}
			<include/formats/bt_s32_input_audio_formats.conf>
			<include/formats/bt_s32_output_audio_formats.conf>
		}
		Object.Widget.mixin.1 {
			<include/formats/bt_s32_input_audio_formats.conf>
			<include/formats/bt_s32_output_audio_formats.conf>
		}
	}
]

Object.PCM.pcm [
	{
		name $BT_DEEP_BUFFER_PCM_NAME
		id $BT_DEEP_BUFFER_PCM_ID
		direction playback
		playback_compatible_d0i3 $BT_DEEPBUFFER_D0I3_COMPATIBLE

		Object.Base.fe_dai.1 {
			name "$BT_DEEP_BUFFER_PCM_NAME"
		}
		IncludeByKey.BT_TRANSP_CODEC {
			"none" {
				Object.PCM.pcm_caps.1 {
					name $BT_DEEP_BUFFER_PCM_NAME
					formats 'S16_LE,S24_LE,S32_LE'
					rates '8000,16000,48000'
					rate_min 8000
					rate_max 48000
					channels_min 1
					channels_max 2
					# Minimum host buffer >= 2x firmware deep-buffer DMA burst at 8 kHz 1ch S16_LE;
					# Linux hda-pcm.c additionally enforces period_time >= (dma_ms + 10 ms) at runtime.
					buffer_size_min "$[(((2 * $channels_min) * 8) * $BT_DEEPBUFFER_FW_DMA_MS) * 2]"
				}
			}
			"(lc3|msbc|g722|sb4)" {
				Object.PCM.pcm_caps.1 {
					name $BT_DEEP_BUFFER_PCM_NAME
					formats 'S16_LE,S24_LE,S32_LE'
					rates '8000,16000'
					rate_min 8000
					rate_max 16000
					channels_min 1
					channels_max 1
					buffer_size_min "$[(((2 * $channels_min) * 8) * $BT_DEEPBUFFER_FW_DMA_MS) * 2]"
				}
			}
		}
	}
]

Object.Base.route [
	{
		source	mixin.$BT_DEEP_BUFFER_PIPELINE_ID.1
		sink	mixout.$BT_PB_DAI_PIPELINE_ID.1
	}
	{
		source	host-copier.$BT_DEEP_BUFFER_PCM_ID.playback
		sink	gain.$BT_DEEP_BUFFER_PIPELINE_ID.1
	}
]
