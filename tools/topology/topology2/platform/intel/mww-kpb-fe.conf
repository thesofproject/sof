# SPDX-License-Identifier: BSD-3-Clause
#
# Common mono microWakeWord (MWW) / KPB Wake-on-Voice capture frontend.
#
# Layered on top of a 16 kHz mono KPB backend pipeline.
#
# Provides:
#   - Pipeline 102: Host gateway capture (mono, 16 kHz, s32)
#   - Pipeline 103: microWakeWord streaming detector (mono, 16 kHz)
#   - PCM 102: Wake-on-Voice capture PCM
#   - Common DAPM drain and virtual detector routes
#

Define {
	MWW_DETECT_MICSEL		"false"
	MWW_DETECT_CHANNELS		1
	MWW_DETECT_CH_CFG		$CHANNEL_CONFIG_MONO
	MWW_DETECT_CH_MAP		$CHANNEL_MAP_MONO
	MFCC_INPUT_BYTES		640
}

Object.Pipeline.host-gateway-capture [
	{
		index $MWW_WOV_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name "$MWW_WOV_STREAM_NAME"
			pcm_id $MWW_WOV_PCM_ID
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		1
					in_rate 		16000
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_ch_cfg 		$CHANNEL_CONFIG_MONO
					in_ch_map 		$CHANNEL_MAP_MONO
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		1
					out_rate 		16000
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_ch_cfg 		$CHANNEL_CONFIG_MONO
					out_ch_map 		$CHANNEL_MAP_MONO
				}
			]
		}
	}
]

Object.Pipeline.mww-detect [
	{
		index $MWW_DETECT_PIPELINE_ID

		Object.Widget.mfcc.1 {
			Object.Control {
				bytes."1" {
					name "$MWW_DETECT_PCM_NAME MFCC bytes"
					IncludeByKey.MWW_PCAN {
						"true"	"include/components/mfcc/mel40_10ms_pcan_compress.conf"
						"false"	"include/components/mfcc/mel40_10ms_compress.conf"
					}
				}
				mixer."1" {
					name "$MWW_DETECT_PCM_NAME MFCC switch"
				}
			}
		}

		Object.Widget.mww.1 {
			Object.Control {
				bytes."1" {
					name "$MWW_DETECT_PCM_NAME MWW bytes"
					max 65536
				}
			}
		}
	}
]

Object.Base.route [
	{
		source "kpb.$MWW_DETECT_KPB_PIPELINE_ID.1"
		sink "host-copier.$MWW_WOV_PCM_ID.capture"
	}
	{
		source "virtual.detect_sink"
		sink "host-copier.$MWW_WOV_PCM_ID.capture"
	}
]

Object.PCM.pcm [
	{
		name "$MWW_WOV_PCM_NAME"
		id $MWW_WOV_PCM_ID
		direction "capture"
		capture_compatible_d0i3 $MWW_CAPTURE_D0I3

		Object.Base.fe_dai.1 {
			name "$MWW_WOV_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name "$MWW_WOV_STREAM_NAME"
			formats 'S32_LE'
			rates '16000'
			channels_min 1
			channels_max 1
		}
	}
]
