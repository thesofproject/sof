#
# Compress playback instance driven by the FFmpeg (libavcodec) decoder widget
# instead of the Cadence "decoder". Modeled on platform/intel/compr.conf's
# COMPRESSED_1 block, but:
#   * instantiates Object.Pipeline.compr-playback-ffmpeg (ffmpeg_dec in place of
#     decoder), and
#   * carries a STREAMINFO bytes control on the ffmpeg_dec widget, which the
#     module receives via set_configuration() and applies as libavcodec
#     extradata before avcodec_open2().
#
# Gated on its own IncludeByKey.COMPR_FFMPEG so the stock compr.conf path is
# unaffected. Reuses the same COMPR_* defines (pipeline id, pcm id/name, sink)
# as compr.conf, so only one of COMPR_FFMPEG / COMPRESSED_1 should be enabled at
# a time for a given PCM id.

IncludeByKey.COMPR_FFMPEG {
"true"	{
	Object.Pipeline.compr-playback-ffmpeg [
		{
			index $COMPR_PIPELINE_ID

			Object.Widget.host-copier.1 {
				stream_name $COMPR_PCM_NAME
				pcm_id $COMPR_PCM_ID
				<include/formats/compr_input_audio_formats.conf>
				<include/formats/compr_output_audio_formats.conf>
			}

			Object.Widget.ffmpeg_dec.1 {
				# Offload ffmpeg_dec to core 1 to free core-0 headroom (core 0
				# also runs DRC/IIR). The cross-core bind (host-copier/mixer on
				# core 0) takes the IDC get_attribute path, whose remote handler
				# used to memcpy ipc4_base_module_cfg straight into a COHERENT
				# (uncached) buffer -- a struct-width store to the uncached alias
				# faults EXCCAUSE 9 on Xtensa. Fixed in firmware (idc.c /
				# component_ext.h ipc4_coherent_copy32: fill a local cacheable
				# copy, publish with aligned 32-bit stores). Requires that fw.
				core_id 1
				# This sizes the DP (data-processing) thread stack. It runs
				# both the per-frame decode AND the one-time, deferred
				# avcodec_open2: prepare() deliberately skips the open (running
				# it on the core's single IDC worker would stall a cross-core
				# prepare/trigger), so the first process() on this DP thread
				# builds the codec tables. AAC-LC float -- the av_tx MDCT table
				# build plus per-frame imdct1024 / windowing / float_dsp -- is
				# the deepest path and needs 256 KiB; fixed-point FLAC/MP3 are
				# far shallower but share this stack.
				stack_bytes_requirement 262144
				heap_bytes_requirement 49152
				# FLAC needs a STREAMINFO codec-setup control, delivered as
				# a bytes control and applied as libavcodec extradata before
				# avcodec_open2(). MP3 is a self-describing elementary stream
				# (the mpegaudio parser syncs on the frame header) and needs
				# no extradata, so the control is omitted for it.
				IncludeByKey.COMPR_FFMPEG_CODEC {
				"flac" {
					Object.Control.bytes."1" {
						name '$COMPR_PCM_NAME codec setup'
						!access [
							tlv_read
							tlv_write
							tlv_callback
						]
						Object.Base.extops.1 {
							name "extctl"
							get 258
							put 258
						}
						max 512
						<include/components/ffmpeg_dec/flac_streaminfo.conf>
					}
				}
				}
				<include/formats/compr_input_audio_formats.conf>
				<include/formats/compr_output_audio_formats.conf>
			}

			# converts the input to S32_LE
			Object.Widget.module-copier.2 {
				<include/formats/compr_input_audio_formats.conf>
				<include/formats/compr_output_audio_formats_s32.conf>
			}

			# converts the input to 48KHz
			# note: this is wrong for 96/192KHz HiRes audio!!!!
			Object.Widget.src.1 {
				rate_out 48000
				<include/formats/compr_input_output_formats_src_s32_to_48k.conf>
			}

			# converts the input to stereo
			Object.Widget.micsel.1 {
				Object.Control.bytes."1" {
					name '$COMPR_PCM_NAME selector bytes'
					<include/components/micsel/stereo_endpoint_playback_updownmix.conf>
				}
				<include/formats/compr_input_audio_formats_s32_48k.conf>
				<include/formats/compr_output_audio_formats_s32_48k_stereo.conf>
			}

			Object.Widget.gain.1 {
				Object.Control.mixer.1 {
					name 'Pre Mixer $COMPR_PCM_NAME Volume'
				}
				num_input_audio_formats 1
				Object.Base.input_audio_format [
					{
						in_rate			48000
						in_bit_depth		32
						in_valid_bit_depth	32
					}
				]
				num_output_audio_formats 1
				Object.Base.output_audio_format [
					{
						out_rate		48000
						out_bit_depth		32
						out_valid_bit_depth	32
					}
				]
			}
			Object.Widget.mixin.1 {
				Object.Base.input_audio_format [
					{
						in_rate			48000
						in_bit_depth            32
						in_valid_bit_depth      32
					}
				]
				Object.Base.output_audio_format [
					{
						out_rate		48000
						out_bit_depth		32
						out_valid_bit_depth	32
					}
				]
			}
		}
	]

	Object.PCM.pcm [
		{
			name $COMPR_PCM_NAME
			id $COMPR_PCM_ID
			direction playback
			compress "true"

			Object.Base.fe_dai.1 {
				name "$COMPR_PCM_NAME"
			}

			Object.PCM.pcm_caps.1 {
				name $COMPR_PCM_NAME
				formats 'S32_LE'
				rates '8000'
			}
		}
	]

	Object.Base.route [
		{
			source  mixin.$COMPR_PIPELINE_ID.1
			sink	$COMPR_PIPELINE_SINK
		}
		{
			source  host-copier.$COMPR_PCM_ID.playback
			sink	ffmpeg_dec.$COMPR_PIPELINE_ID.1
		}
	]
}
}
