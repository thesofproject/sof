# SPDX-License-Identifier: BSD-3-Clause
#
# SoundWire microWakeWord (MWW)/KPB Wake-on-Voice capture branch.
#
# Generic template for SoundWire capture endpoints (DMIC or Jack).
# Taps the DAI-side module-copier ($SDW_MWW_MODULE_COPIER_ID.0) into:
#
#   micsel (stereo -> mono) -> SRC (48 -> 16 kHz mono) -> KPB (16 kHz mono, dual sinks)
#     pin 0 -> MFCC (40 mel 10ms compress) -> MWW -> virtual.detect_sink
#              --------------------------------------> host-copier: "$MWW_WOV_PCM_NAME" PCM
#     pin 1 -> host-copier: "$MWW_WOV_PCM_NAME"  PCM
#

Define {
	SDW_MWW_KPB_PIPELINE_ID	104
	MWW_DETECT_KPB_PIPELINE_ID	104
	MWW_WOV_PIPELINE_ID		102
	MWW_WOV_PCM_ID			102
	MWW_DETECT_PIPELINE_ID		103
	MWW_CAPTURE_D0I3		false
}

Object.Pipeline.micsel-src-kpb-be [
	{
		index $SDW_MWW_KPB_PIPELINE_ID

		Object.Widget.micsel.1 {
			Object.Control {
				bytes."1" {
					name "$MWW_WOV_PCM_NAME Micsel bytes"
					<include/components/micsel/downmix_stereo_to_mono.conf>
				}
			}
		}

		Object.Widget.kpb.1 {
			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "mfcc.$MWW_DETECT_PIPELINE_ID.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "host-copier.$MWW_WOV_PCM_ID.capture"
			}
		}
	}
]

Object.Base.route [
	{
		source "module-copier.$SDW_MWW_MODULE_COPIER_ID.0"
		sink "micsel.$SDW_MWW_KPB_PIPELINE_ID.1"
	}
]

<platform/intel/mww-kpb-fe.conf>
