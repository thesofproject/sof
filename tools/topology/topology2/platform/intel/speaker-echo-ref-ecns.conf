#
# SSP speaker echo reference for the multi-slot WoV ECNS
#
# gain.$SPEAKER_DAI_PIPELINE_ID.1 -> module-copier.$SPEAKER_DAI_PIPELINE_ID.2 ->
#	dai-copier.SSP.$SPEAKER_CODEC_NAME.playback
# module-copier.$SPEAKER_DAI_PIPELINE_ID.2 -> siggen.$WOV_ECHO_REF_PIPELINE_ID.1
# dai-copier.SSP.$SPEAKER_CODEC_NAME.capture -> siggen.$WOV_ECHO_REF_PIPELINE_ID.1
#
# The module-copier duplicates the speaker playback to the echo reference
# pipeline defined in dmic-wov-multi.conf. The SSP loopback capture DAI from
# speaker-echo-ref.conf is the dai_out widget that starts the setup of the
# echo reference pipeline with the WoV capture, as the Loopback_Virtual DAI
# does for SoundWire. When the speaker is not running the siggen produces
# silence.
#
# Requires INCLUDE_ECHO_REF=true and INCLUDE_WOV=multi.
#

Object.Widget.module-copier."2" {
	index $SPEAKER_DAI_PIPELINE_ID
	core_id $SPEAKER_PCM_CORE_ID
	num_input_pins 1
	num_output_pins 2
	num_input_audio_formats 1
	num_output_audio_formats 1
	Object.Base.input_audio_format [
		{
			in_bit_depth		32
			in_valid_bit_depth	32
		}
	]
	Object.Base.output_audio_format [
		{
			out_bit_depth		32
			out_valid_bit_depth	32
		}
	]
}

Object.Base.route [
	{
		source	"gain.$SPEAKER_DAI_PIPELINE_ID.1"
		sink	"module-copier.$SPEAKER_DAI_PIPELINE_ID.2"
	}
	{
		source	"module-copier.$SPEAKER_DAI_PIPELINE_ID.2"
		sink	"dai-copier.SSP.$SPEAKER_CODEC_NAME.playback"
	}
	{
		source	"dai-copier.SSP.$SPEAKER_CODEC_NAME.capture"
		sink	"siggen.$WOV_ECHO_REF_PIPELINE_ID.1"
	}
	{
		source	"module-copier.$SPEAKER_DAI_PIPELINE_ID.2"
		sink	"siggen.$WOV_ECHO_REF_PIPELINE_ID.1"
	}
]
