Object.Pipeline {
	host-gateway-capture [
		{
			format		$WOV_FORMAT
			rate		16000
			rate_min	16000
			rate_max	16000
			index 		$DMIC1_HOST_PIPELINE_ID

			Object.Widget.host-copier.1 {
				stream_name $DMIC1_PCM_CAPS
				pcm_id $DMIC1_PCM_ID
				num_input_audio_formats 3
				num_output_audio_formats 3
				Object.Base.input_audio_format [
					{
						in_rate			16000
						in_channels		1
						in_ch_cfg		$CHANNEL_CONFIG_MONO
						in_ch_map		$CHANNEL_MAP_MONO
						in_bit_depth		$WOV_BIT_DEPTH
						in_valid_bit_depth	$WOV_VALID_BIT_DEPTH
					}
					{
						in_rate			16000
						in_bit_depth		$WOV_BIT_DEPTH
						in_valid_bit_depth	$WOV_VALID_BIT_DEPTH
					}
					{
						in_rate			16000
						in_channels		4
						in_bit_depth		$WOV_BIT_DEPTH
						in_valid_bit_depth	$WOV_VALID_BIT_DEPTH
						in_ch_cfg	$CHANNEL_CONFIG_3_POINT_1
						in_ch_map	$CHANNEL_MAP_3_POINT_1
					}
				]
				Object.Base.output_audio_format [
					{
						out_rate		16000
						out_channels		1
						out_ch_cfg		$CHANNEL_CONFIG_MONO
						out_ch_map		$CHANNEL_MAP_MONO
						out_bit_depth		$WOV_BIT_DEPTH
						out_valid_bit_depth	$WOV_VALID_BIT_DEPTH
					}
					{
						out_rate		16000
						out_bit_depth		$WOV_BIT_DEPTH
						out_valid_bit_depth	$WOV_VALID_BIT_DEPTH
					}
					{
						out_rate		16000
						out_channels		4
						out_bit_depth		$WOV_BIT_DEPTH
						out_valid_bit_depth	$WOV_VALID_BIT_DEPTH
						out_ch_cfg	$CHANNEL_CONFIG_3_POINT_1
						out_ch_map	$CHANNEL_MAP_3_POINT_1
					}
				]
			}
		}
	]

	dai-kpb-be [
		{
			direction	"capture"
			format 	$WOV_FORMAT
			rate	16000
			rate_min	16000
			rate_max	16000
			index		$DMIC1_DAI_PIPELINE_ID

			Object.Widget.dai-copier.1 {
				dai_index	1
				type		"dai_out"
				dai_type	"DMIC"
				copier_type	"DMIC"
				type		dai_out
				stream_name	$DMIC1_NAME
				node_type $DMIC_LINK_INPUT_CLASS
				num_input_audio_formats 2
				num_output_audio_formats 2
				Object.Base.input_audio_format [
					{
						in_rate			16000
						in_bit_depth		$WOV_BIT_DEPTH
						in_valid_bit_depth	$WOV_VALID_BIT_DEPTH
					}
					{
						in_rate			16000
						in_channels		4
						in_bit_depth		$WOV_BIT_DEPTH
						in_valid_bit_depth	$WOV_VALID_BIT_DEPTH
						in_ch_cfg	$CHANNEL_CONFIG_3_POINT_1
						in_ch_map	$CHANNEL_MAP_3_POINT_1
					}
				]

				Object.Base.output_audio_format [
					{
						out_rate		16000
						out_bit_depth		$WOV_BIT_DEPTH
						out_valid_bit_depth	$WOV_VALID_BIT_DEPTH
					}
					{
						out_rate		16000
						out_channels		4
						out_bit_depth		$WOV_BIT_DEPTH
						out_valid_bit_depth	$WOV_VALID_BIT_DEPTH
						out_ch_cfg	$CHANNEL_CONFIG_3_POINT_1
						out_ch_map	$CHANNEL_MAP_3_POINT_1
					}
				]
			}

			Object.Widget.kpb.1 {
				Object.Base.output_pin_binding.1 {
					output_pin_binding_name "micsel.$WOV_PIPELINE_ID.1"
				}
				Object.Base.output_pin_binding.2 {
					output_pin_binding_name "host-copier.$DMIC1_PCM_ID.capture"
				}
				Object.Base.output_pin_binding.3 {
					output_pin_binding_name "NotConnected"
				}
			}
		}
	]

	wov-detect [
		{
			index		$WOV_PIPELINE_ID
			format 		$WOV_FORMAT
			channels	2
			Object.Widget.wov.1 {
				uuid	$WOV_UUID
				cpc	$WOV_CPC
				is_pages $WOV_IS_PAGES
			}
		}
	]
}

Object.Base.route [
	{
		source "dai-copier.DMIC.$DMIC1_NAME.capture"
		sink "kpb.$DMIC1_DAI_PIPELINE_ID.1"
	}
	{
		source "kpb.$DMIC1_DAI_PIPELINE_ID.1"
		sink "host-copier.$DMIC1_PCM_ID.capture"
	}
	{
		source "kpb.$DMIC1_DAI_PIPELINE_ID.1"
		sink "micsel.$WOV_PIPELINE_ID.1"
	}
	{
		source "virtual.detect_sink"
		sink "host-copier.$DMIC1_PCM_ID.capture"
	}
]

Object.PCM.pcm [
	{
		name	"DMIC16k"
		id	$DMIC1_PCM_ID
		direction	"capture"
		capture_compatible_d0i3	true
		Object.Base.fe_dai.1 {
			name "DMIC16k"
		}

		Object.PCM.pcm_caps.1 {
			name $DMIC1_PCM_CAPS
			formats $WOV_PCM_FMT
			channels_min 1
			channels_max $NUM_DMICS
			rates        '16000'
			rate_min     16000
			rate_max     16000
		}
	}
]
