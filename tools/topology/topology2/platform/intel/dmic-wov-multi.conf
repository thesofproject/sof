		index      $WOV_ECNS_HOST_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.mixout.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.host-copier.1 {
			stream_name $DMIC_ECNS_PCM_CAPS
			pcm_id      $DMIC_ECNS_PCM_ID
			node_type   $HDA_HOST_INPUT_CLASS
			direction   "capture"
			type        "aif_out"
			num_input_pins 1

			num_input_audio_formats  1
			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]

			num_output_audio_formats 2
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
				{
					out_rate            16000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 116 — KPB & WOV Fanout (Core 0, LL 1ms)
# Mixout.116.1 -> KPB.116.1 (1ch mono, 2000ms) -> Mixin.116.1 (fanout 1 -> 3)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $WOV_KPB_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.mixout.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.kpb.1 {
			history_depth_ms $KPB_BUFF_TIME_MS
			num_input_pins  1
			num_output_pins 2
			num_input_audio_formats  1
			num_output_audio_formats 2

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 32
				}
			]
			Object.Base.output_audio_format [
				# Pin 0: real-time feed to the detector slots
				{
					output_pin_index    0
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 32
				}
				# Pin 1: drain path to the WOV arbiter and the host PCM
				{
					output_pin_index    1
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 32
				}
			]

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "mixin.116.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "wov-arbiter.114.1"
			}
		}

		Object.Widget.mixin.1 {
			num_input_pins  1
			num_output_pins 3
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

