# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------
Object.Base.route [
	{ source "dai-copier.DMIC.$DMIC_NAME.capture" sink "vad-gate.100.1" }
	{ source "vad-gate.100.1"                  sink "kpb.100.1" }
	{ source "kpb.100.1"                       sink "mixin.100.1" }
	{ source "mixin.100.1"                     sink "mixout.101.1" }
	{ source "mixin.100.1"                     sink "mixout.102.1" }
	{ source "mixin.100.1"                     sink "mixout.103.1" }
	{ source "mixout.101.1"                    sink "wov.101.1" }
	{ source "wov.101.1"                       sink "wov-arbiter.104.1" }
	{ source "mixout.102.1"                    sink "wov.102.1" }
	{ source "wov.102.1"                       sink "wov-arbiter.104.1" }
	{ source "mixout.103.1"                    sink "wov.103.1" }
	{ source "wov.103.1"                       sink "wov-arbiter.104.1" }
	{ source "wov-arbiter.104.1"               sink "host-copier.$DMIC_PCM_ID.capture" }
]

# ---------------------------------------------------------------------------
# PCM
# ---------------------------------------------------------------------------
Object.PCM.pcm."$DMIC_PCM_ID" {
	name      "DMIC Multi-WOV"
	id        $DMIC_PCM_ID
	direction "capture"

	Object.Base.fe_dai."$DMIC_PCM_CAPS" {}

	Object.PCM.pcm_caps."capture" {
		name         $DMIC_PCM_CAPS
		formats      "S16_LE,S24_LE,S32_LE"
		rates        "16000"
		channels_min 1
		channels_max 2
	}
}

# ---------------------------------------------------------------------------
# Virtual widgets (required by driver for DAPM)
# ---------------------------------------------------------------------------
Object.Widget.virtual [
	{ name "codec0_in"  type input  index 1 }
	{ name "codec1_in"  type input  index 2 }
	{ name "codec0_out" type output index 3 }
	{ name "codec1_out" type output index 4 }
	{ name "codec2_in"  type input  index 5 }
	{ name "codec2_out" type output index 6 }
	{ name "iDisp1_out" type output index 7 }
	{ name "iDisp2_out" type output index 8 }
	{ name "iDisp3_out" type output index 9 }
	{ name "iDisp3 Tx"             type out_drv index 0 }
	{ name "iDisp2 Tx"             type out_drv index 1 }
	{ name "iDisp1 Tx"             type out_drv index 2 }
	{ name "Analog CPU Playback"   type out_drv index 3 }
	{ name "Digital CPU Playback"  type out_drv index 4 }
	{ name "Alt Analog CPU Playback" type out_drv index 5 }
	{ name "Analog CPU Capture"    type input   index 6 }
	{ name "Digital CPU Capture"   type input   index 7 }
	{ name "Alt Analog CPU Capture" type input  index 8 }
]

# ---------------------------------------------------------------------------
# DMIC DAI
# ---------------------------------------------------------------------------
Object.Dai.DMIC [
	{
		name              $DMIC_NAME
		dai_index         $DMIC_DAI_INDEX
		id                $DMIC_DAI_INDEX
		default_hw_config_id $DMIC_DAI_INDEX
		num_pdm_active    1
		Object.Base.hw_config.1 {
			name "DMIC"
		}
	}
]
