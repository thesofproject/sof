#
# Single-KPB Wake-on-Voice topology
#
# Captures from DMIC, passes through VAD gate → single KPB (shared history
# buffer) → Mixin fan-out to three WOV detector paths.  When any detector
# fires, the WOV arbiter activates that slot, pauses the other two via the
# SOF notifier, and drains audio to the host PCM capture stream.
#
# Pipeline IDs
#   100  DAI pipeline  : DMIC copier → VAD Gate → KPB → Mixin
#   101  WOV pipeline  : Mixout_0 → WOV_0               (Core 0)
#   102  WOV pipeline  : Mixout_1 → WOV_1               (Core 0)
#   103  WOV pipeline  : Mixout_2 → WOV_2               (Core 1)
#   104  Host pipeline : WOV Arbiter → Host copier       (Core 0)
#
# Memory: single 192 KB KPB history buffer (was 3 × 192 KB = 576 KB)
#
# Requires
#   CONFIG_COMP_KPB=y
#   CONFIG_COMP_WOV_ARBITER=y
#   CONFIG_COMP_VAD_GATE=y
#   CONFIG_COMP_MIXIN_MIXOUT=y
#   CONFIG_COMP_KWD_DETECT (detect_test sample)

