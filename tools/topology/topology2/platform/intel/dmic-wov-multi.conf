	direction "capture"
	capture_compatible_d0i3 1

	Object.Base.fe_dai."$DMIC_ECNS_PCM_CAPS" {}

	Object.PCM.pcm_caps."capture" {
		name       $DMIC_ECNS_PCM_CAPS
