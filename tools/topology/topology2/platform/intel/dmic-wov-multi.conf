#
# Multi-Slot Wake-on-Voice (WoV) feature module with PDM DMIC input.
#
# Hardware PDM DMIC (16kHz 4ch) -> 20ms DP ECNS -> 2000ms dual-sink KPB ->
# Mixin fanout to 3 concurrent MWW detector slots (MFCC + MicroWakeWord) ->
# 4-pin WOV Arbiter -> Host Copier PCM 11 (D0i3-compatible) & ECNS Host PCM 10.
#
# Requires:
#   CONFIG_COMP_KPB=y
#   CONFIG_COMP_WOV_ARBITER=y
#   CONFIG_COMP_MFCC=y
#   CONFIG_COMP_MICROWAKEWORD=y
#   CONFIG_COMP_ECNS=y
#

# ---------------------------------------------------------------------------
# Component and control class definitions
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Custom pipeline classes
# ---------------------------------------------------------------------------
Class.Pipeline."custom-capture" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  0
	}

	direction        "capture"
	time_domain      "timer"
	dynamic_pipeline 1
}

Class.Pipeline."custom-dp-capture" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  1
	}

	direction        "capture"
	time_domain      "timer"
	period           20000
	dynamic_pipeline 1
}

# ---------------------------------------------------------------------------
# Default parameters
# ---------------------------------------------------------------------------
Define {
	WOV_ARBITER_UUID        "7d:6c:5b:4a:9f:8e:1b:4a:2c:3d:4e:5f:60:71:82:93"
	ECNS_UUID               "6c:8a:4f:21:3a:49:1e:4b:8b:1e:0d:3b:6f:8a:2c:15"

	DMIC_WOV_DAI_INDEX      0
	DMIC_WOV_DAI_NAME       "dmic01"
	DMIC_WOV_PCM_ID         11
	DMIC_WOV_PCM_CAPS       "Gain Capture 11"
	DMIC_ECNS_PCM_ID        10
	DMIC_ECNS_PCM_CAPS      "Gain Capture 10"
	DMIC_WOV_FORMAT         "s16le"

	KWD_CPC                 100000
	WOV_ARB_CPC             20000
	KPB_BUFF_TIME_MS        "2000"

	WOV_DAI_PIPELINE_ID     110
	WOV_SLOT0_PIPELINE_ID   111
	WOV_SLOT1_PIPELINE_ID   112
	WOV_SLOT2_PIPELINE_ID   113
	WOV_ARB_PIPELINE_ID     114
	WOV_ECNS_PIPELINE_ID    115
	WOV_KPB_PIPELINE_ID     116
	WOV_ECNS_HOST_PIPELINE_ID 117

	WOV_CORE_ID             0
	WOV_SLOT2_CORE_ID       0
}

# ---------------------------------------------------------------------------
# Pipeline 110 — DAI Capture (Core 0, LL 1ms)
# Hardware PDM DMIC Copier (16k 4ch) -> Mixin.110.1
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $WOV_DAI_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.dai-copier.1 {
			dai_index   $DMIC_WOV_DAI_INDEX
			type        "dai_out"
			dai_type    "DMIC"
			copier_type "DMIC"
			stream_name $DMIC_WOV_DAI_NAME
			direction   "capture"
			node_type   $DMIC_LINK_INPUT_CLASS

			num_input_pins           1
			num_output_pins          1
			num_input_audio_formats  2
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate            16000
					in_channels        4
					in_bit_depth       32
					in_valid_bit_depth 32
					in_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					in_ch_map          $CHANNEL_MAP_3_POINT_1
				}
				{
					in_rate            16000
					in_channels        4
					in_bit_depth       16
					in_valid_bit_depth 16
					in_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					in_ch_map          $CHANNEL_MAP_3_POINT_1
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        4
					out_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					out_ch_map          $CHANNEL_MAP_3_POINT_1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.mixin.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         4
					in_ch_cfg           $CHANNEL_CONFIG_3_POINT_1
					in_ch_map           $CHANNEL_MAP_3_POINT_1
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        4
					out_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					out_ch_map          $CHANNEL_MAP_3_POINT_1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 115 — ECNS DP Pipeline (Core 0, 20ms DP, lp_mode 1)
# Mixout.115.1 -> ECNS.115.1
# Pin 0: Ch 0 mono clean (16k) -> Mixin.115.1 ("KPB mixin")
# Pin 1: Ch 0,1 stereo clean (16k) -> Mixin.115.2 ("Host mixin")
# ---------------------------------------------------------------------------
Object.Pipeline."custom-dp-capture" [
	{
		index      $WOV_ECNS_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.mixout.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         4
					in_ch_cfg           $CHANNEL_CONFIG_3_POINT_1
					in_ch_map           $CHANNEL_MAP_3_POINT_1
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        4
					out_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					out_ch_map          $CHANNEL_MAP_3_POINT_1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.ecns.1 {
			uuid $ECNS_UUID
			num_input_pins  1
			num_output_pins 2
			num_input_audio_formats  1
			num_output_audio_formats 2

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         4
					in_ch_cfg           $CHANNEL_CONFIG_3_POINT_1
					in_ch_map           $CHANNEL_MAP_3_POINT_1
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 2560
				}
			]
			Object.Base.output_audio_format [
				# Pin 0: Ch 0 mono clean to KPB mixin
				{
					output_pin_index    0
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 640
				}
				# Pin 1: Ch 0,1 stereo clean to Host mixin
				{
					output_pin_index    1
					out_rate            16000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 1280
				}
			]
		}

		# Mixin 115.1: Mono clean output (Pin 0) to KPB
		Object.Widget.mixin.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		# Mixin 115.2: Stereo clean output (Pin 1) to Host Copier
		Object.Widget.mixin.2 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   1
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
