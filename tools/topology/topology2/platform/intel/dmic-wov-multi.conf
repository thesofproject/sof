# ---------------------------------------------------------------------------
# Minimal custom pipeline class (no predefined component widgets)
# ---------------------------------------------------------------------------
Class.Pipeline."custom-capture" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  0
	}

	direction        "capture"
	time_domain      "timer"
	dynamic_pipeline 1
}

# ---------------------------------------------------------------------------
# Define UUIDs and tuning constants
# ---------------------------------------------------------------------------
Define {
	KWD_TEST_UUID  "1f:d5:a8:eb:27:78:b5:47:82:ee:de:6e:77:43:af:67"
	WOV_UUID       "1f:d5:a8:eb:27:78:b5:47:ee:82:de:6e:77:43:af:67"
	WOV_ARB_UUID   "7d:6c:5b:4a:9f:8e:1b:4a:2c:3d:4e:5f:60:71:82:93"
	VAD_GATE_UUID  "5f:6e:7d:8c:3b:4a:1d:2c:0e:9f:8a:7b:6c:5d:4e:3f"

	DMIC_DAI_INDEX  1
	DMIC_PCM_ID    11
	DMIC_NAME      "dmic16k"
	DMIC_PCM_CAPS  "Gain Capture 11"
	FORMAT         "s16le"

	KWD_CPC        100000
	WOV_ARB_CPC    20000
	VAD_GATE_CPC   5000
}

# ---------------------------------------------------------------------------
# Pipeline 100 — DAI (Core 0): DMIC copier → VAD Gate → KPB → Mixin
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index  100
		format $FORMAT
		rate   16000

		Object.Widget."dai-copier"."1" {
			dai_index   $DMIC_DAI_INDEX
			type        "dai_out"
			dai_type    "DMIC"
			copier_type "DMIC"
			stream_name $DMIC_NAME
			direction   "capture"
			node_type   $DMIC_LINK_INPUT_CLASS
			num_output_pins 1

			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate            16000
					in_channels        1
					in_ch_cfg          $CHANNEL_CONFIG_MONO
					in_ch_map          $CHANNEL_MAP_MONO
					in_bit_depth       16
					in_valid_bit_depth 16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget."vad-gate"."1" {
			uuid $VAD_GATE_UUID
			cpc  $VAD_GATE_CPC

			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate            16000
					in_channels        1
					in_bit_depth       16
					in_valid_bit_depth 16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.kpb."1" {
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate            16000
					in_channels        1
					in_bit_depth       16
					in_valid_bit_depth 16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "mixin.100.1"
			}
		}

		Object.Widget.mixin."1" {
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate            16000
					in_channels        1
					in_bit_depth       16
					in_valid_bit_depth 16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget."pipeline"."1" {
			core_id 0
		}
	}
]

