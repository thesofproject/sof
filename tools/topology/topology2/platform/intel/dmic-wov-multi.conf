#
# Multi-Slot Wake-on-Voice (WoV) feature module with PDM DMIC input.
#
# Hardware PDM DMIC (16kHz 4ch) -> 20ms DP ECNS -> 2000ms dual-sink KPB ->
# Mixin fanout to 3 concurrent MWW detector slots (MFCC + MicroWakeWord) ->
# 4-pin WOV Arbiter -> Host Copier PCM 11 (D0i3-compatible) & ECNS Host PCM 10.
#
# Requires:
#   CONFIG_COMP_KPB=y
#   CONFIG_COMP_WOV_ARBITER=y
#   CONFIG_COMP_MFCC=y
#   CONFIG_COMP_MICROWAKEWORD=y
#   CONFIG_COMP_ECNS=y
#

# ---------------------------------------------------------------------------
# Component and control class definitions
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Custom pipeline classes
# ---------------------------------------------------------------------------
Class.Pipeline."custom-capture" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  0
	}

	direction        "capture"
	time_domain      "timer"
	dynamic_pipeline 1
}

Class.Pipeline."custom-dp-capture" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  1
	}

	direction        "capture"
	time_domain      "timer"
	period           20000
	dynamic_pipeline 1
}

# ---------------------------------------------------------------------------
# Default parameters
# ---------------------------------------------------------------------------
Define {
	WOV_ARBITER_UUID        "7d:6c:5b:4a:9f:8e:1b:4a:2c:3d:4e:5f:60:71:82:93"
	ECNS_UUID               "6c:8a:4f:21:3a:49:1e:4b:8b:1e:0d:3b:6f:8a:2c:15"

	DMIC_WOV_DAI_INDEX      0
	DMIC_WOV_DAI_NAME       "dmic01"
	DMIC16K_DAI_INDEX       1
	DMIC16K_DAI_NAME        "dmic16k"
	# DMIC_RAW_PCM_ID         10
	# DMIC_RAW_PCM_CAPS       "Gain Capture 10"
	DMIC_ECNS_PCM_ID        11
	DMIC_ECNS_PCM_CAPS      "Gain Capture 11"
	DMIC_WOV_PCM_ID         12
	DMIC_WOV_PCM_CAPS       "Gain Capture 12"
	DMIC0_PCM_CAPS          "Gain Capture 10"
	DMIC_WOV_FORMAT         "s16le"

	KWD_CPC                 100000
	WOV_ARB_CPC             20000
	KPB_BUFF_TIME_MS        "2000"

	WOV_DAI_PIPELINE_ID     110
	WOV_SLOT0_PIPELINE_ID   111
	WOV_SLOT1_PIPELINE_ID   112
	WOV_SLOT2_PIPELINE_ID   113
	WOV_ARB_PIPELINE_ID     114
	WOV_ECNS_PIPELINE_ID    115
	WOV_KPB_PIPELINE_ID     116
	WOV_ECNS_HOST_PIPELINE_ID 117
	# WOV_RAW_HOST_PIPELINE_ID 118
	WOV_DAI16K_PIPELINE_ID  119

	WOV_CORE_ID             0
	WOV_SLOT2_CORE_ID       0
	MWW_PCAN                "true"

	# 16k detection-path channel count into eqiir and ECNS pin0. Overridden
	# to 4ch by IncludeByKey.DMIC_WOV_DAI_CHANNELS below so ECNS can select
	# the good mic pair in firmware.
	DET16K_CHANNELS         2
	DET16K_CH_CFG           $CHANNEL_CONFIG_STEREO
	DET16K_CH_MAP           $CHANNEL_MAP_STEREO
	ECNS_PIN0_IBS           2560

	# 48k host-path channel count: dmic01 -> ECNS pin1 -> host PCM 11.
	# Overridden to 4ch below to allow raw 4ch capture for mic diagnostics.
	WOVHOST_CHANNELS        2
	WOVHOST_CH_CFG          $CHANNEL_CONFIG_STEREO
	WOVHOST_CH_MAP          $CHANNEL_MAP_STEREO
	ECNS_PIN1_IBS           3840
	ECNS_PIN1_OBS           3840
}

IncludeByKey.DMIC_WOV_DAI_CHANNELS {
	"2" {
		Define {
			DET16K_CHANNELS 2
			DET16K_CH_CFG   $CHANNEL_CONFIG_STEREO
			DET16K_CH_MAP   $CHANNEL_MAP_STEREO
			ECNS_PIN0_IBS   2560
			WOVHOST_CHANNELS 2
			WOVHOST_CH_CFG   $CHANNEL_CONFIG_STEREO
			WOVHOST_CH_MAP   $CHANNEL_MAP_STEREO
			ECNS_PIN1_IBS    3840
			ECNS_PIN1_OBS    3840
		}
	}
	"4" {
		Define {
			DET16K_CHANNELS 4
			DET16K_CH_CFG   $CHANNEL_CONFIG_3_POINT_1
			DET16K_CH_MAP   $CHANNEL_MAP_3_POINT_1
			ECNS_PIN0_IBS   5120
			WOVHOST_CHANNELS 4
			WOVHOST_CH_CFG   $CHANNEL_CONFIG_3_POINT_1
			WOVHOST_CH_MAP   $CHANNEL_MAP_3_POINT_1
			ECNS_PIN1_IBS    7680
			ECNS_PIN1_OBS    7680
		}
	}
}

IncludeByKey.MWW_PCAN {
	"true" {
		Define {
			MFCC_FRAME_BYTES 64
			MWW_INPUT_BYTES 64
		}
	}
	"false" {
		Define {
			MFCC_FRAME_BYTES 184
			MWW_INPUT_BYTES 184
		}
	}
}

# ---------------------------------------------------------------------------
# Pipeline 110 — DAI Capture for dmic01 (Core 0, LL 1ms)
# Hardware PDM DMIC Copier (48k) -> ECNS.115.1 Pin 1
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $WOV_DAI_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       48000

		# dmic01 DAI copier. Only the 4ch/32bit input format is offered: it is
		# the sole DMIC NHLT blob, so any pipeline that drags in this copier as a
		# dangling branch (e.g. the KPB PCM 12 path) still resolves to a format
		# the firmware has a blob for.
		Object.Widget.dai-copier.1 {
			dai_index	$DMIC_WOV_DAI_INDEX
			dai_type	"DMIC"
			copier_type	"DMIC"
			type		dai_out
			stream_name	$DMIC_WOV_DAI_NAME
			node_type $DMIC_LINK_INPUT_CLASS
			num_output_pins 1
			num_input_audio_formats	1
			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_channels		4
					in_bit_depth		32
					in_valid_bit_depth	32
					in_ch_cfg	$CHANNEL_CONFIG_3_POINT_1
					in_ch_map	$CHANNEL_MAP_3_POINT_1
				}
			]
			num_output_audio_formats	1
			Object.Base.output_audio_format [
				{
					out_rate		48000
					out_channels		4
					out_bit_depth		32
					out_valid_bit_depth	32
					out_ch_cfg	$CHANNEL_CONFIG_3_POINT_1
					out_ch_map	$CHANNEL_MAP_3_POINT_1
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 119 — DAI Capture for dmic16k (Core 0, LL 1ms)
# Hardware PDM DMIC Copier (16k) -> EQIIR.119.1 (100 Hz HPF, +20 dB) -> ECNS.115.1 Pin 0
# Pipeline 119 feeds ECNS directly, like pipeline 110: a source widget in
# pipeline 115 besides ECNS would never be copied, the LL walk only starts from
# one source per pipeline.
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $WOV_DAI16K_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.dai-copier.1 {
			dai_index   $DMIC16K_DAI_INDEX
			type        "dai_out"
			dai_type    "DMIC"
			copier_type "DMIC"
			stream_name $DMIC16K_DAI_NAME
			direction   "capture"
			node_type   $DMIC_LINK_INPUT_CLASS

			num_input_pins           1
			num_output_pins          1
			num_input_audio_formats  2
			num_output_audio_formats 1

			# 4ch DMIC is remapped to stereo by the copier
			IncludeByKey.DMIC_WOV_DAI_CHANNELS {
				"2" {
					Object.Base.input_audio_format [
						{
							in_rate            16000
							in_channels        2
							in_bit_depth       32
							in_valid_bit_depth 32
							in_ch_cfg          $CHANNEL_CONFIG_STEREO
							in_ch_map          $CHANNEL_MAP_STEREO
						}
						{
							in_rate            16000
							in_channels        2
							in_bit_depth       16
							in_valid_bit_depth 16
							in_ch_cfg          $CHANNEL_CONFIG_STEREO
							in_ch_map          $CHANNEL_MAP_STEREO
						}
					]
				}
				"4" {
					Object.Base.input_audio_format [
						{
							in_rate            16000
							in_channels        4
							in_bit_depth       32
							in_valid_bit_depth 32
							in_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
							in_ch_map          $CHANNEL_MAP_3_POINT_1
						}
						{
							in_rate            16000
							in_channels        4
							in_bit_depth       16
							in_valid_bit_depth 16
							in_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
							in_ch_map          $CHANNEL_MAP_3_POINT_1
						}
					]
				}
			}
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        $DET16K_CHANNELS
					out_ch_cfg          $DET16K_CH_CFG
					out_ch_map          $DET16K_CH_MAP
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		# The raw DMIC level is ~20 dB below what the keyword models expect
		Object.Widget.eqiir.1 {
			Object.Control.bytes."1" {
				name 'WoV DMIC 16k Capture IIR Eq'
				<include/components/eqiir/highpass_100hz_20db_16khz.conf>
			}
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         $DET16K_CHANNELS
					in_ch_cfg           $DET16K_CH_CFG
					in_ch_map           $DET16K_CH_MAP
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        $DET16K_CHANNELS
					out_ch_cfg          $DET16K_CH_CFG
					out_ch_map          $DET16K_CH_MAP
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 115 — ECNS DP Pipeline (Core 0, 20ms DP, lp_mode 1)
# DAI-Copier dmic01 (pipeline 110, 48k) -> ECNS.115.1 Pin 1
# EQIIR.119.1 (pipeline 119, 16k dmic16k) -> ECNS.115.1 Pin 0
# Pin 0: averaged mono clean (16k) -> KPB.116.1
# Pin 1: Ch 0,1 stereo clean (48k) -> Host-Copier.11 (ALSA PCM 11)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-dp-capture" [
	{
		index      $WOV_ECNS_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       48000

		Object.Widget.ecns.1 {
			uuid $ECNS_UUID
			num_input_pins  2
			num_output_pins 2
			num_input_audio_formats  2
			num_output_audio_formats 2

			Object.Base.input_pin_binding.1 {
				input_pin_binding_name "eqiir.119.1"
			}
			Object.Base.input_pin_binding.2 {
				input_pin_binding_name "dai-copier.DMIC.$DMIC_WOV_DAI_NAME.capture"
			}

			Object.Base.input_audio_format [
				# Pin 0: 16 kHz detection path from dmic16k (2 or 4ch per Kconfig)
				{
					input_pin_index     0
					in_rate             16000
					in_channels         $DET16K_CHANNELS
					in_ch_cfg           $DET16K_CH_CFG
					in_ch_map           $DET16K_CH_MAP
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $ECNS_PIN0_IBS
				}
				# Pin 1: 48 kHz from dmic01 (2 or 4ch per DMIC_WOV_DAI_CHANNELS)
				{
					input_pin_index     1
					in_rate             48000
					in_channels         $WOVHOST_CHANNELS
					in_ch_cfg           $WOVHOST_CH_CFG
					in_ch_map           $WOVHOST_CH_MAP
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 15360
				}
			]
			Object.Base.output_audio_format [
				# Pin 0: averaged mono clean to KPB mixin (16 kHz mono)
				{
					output_pin_index    0
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 640
				}
				# Pin 1: clean to Host mixin (48 kHz, 2 or 4ch per DMIC_WOV_DAI_CHANNELS)
				{
					output_pin_index    1
					out_rate            48000
					out_channels        $WOVHOST_CHANNELS
					out_ch_cfg          $WOVHOST_CH_CFG
					out_ch_map          $WOVHOST_CH_MAP
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 $ECNS_PIN1_OBS
				}
			]

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "kpb.116.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "host-copier.$DMIC_ECNS_PCM_ID.capture"
			}
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   1
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 117 — ECNS Host Capture Pipeline (Core 0, LL 1ms)
# ECNS.115.1 Pin 1 (2ch stereo clean) -> Host-Copier.11 (ALSA PCM 11)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $WOV_ECNS_HOST_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       48000

		Object.Widget.host-copier.1 {
			stream_name $DMIC_ECNS_PCM_CAPS
			pcm_id      $DMIC_ECNS_PCM_ID
			node_type   $HDA_HOST_INPUT_CLASS
			direction   "capture"
			type        "aif_out"
			num_input_pins 1
			capture_compatible_d0i3 true

			num_input_audio_formats  1
			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         $WOVHOST_CHANNELS
					in_ch_cfg           $WOVHOST_CH_CFG
					in_ch_map           $WOVHOST_CH_MAP
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]

			num_output_audio_formats 2
			Object.Base.output_audio_format [
				{
					out_rate            48000
					out_channels        $WOVHOST_CHANNELS
					out_ch_cfg          $WOVHOST_CH_CFG
					out_ch_map          $WOVHOST_CH_MAP
					out_bit_depth       16
					out_valid_bit_depth 16
				}
				{
					out_rate            48000
					out_channels        $WOVHOST_CHANNELS
					out_ch_cfg          $WOVHOST_CH_CFG
					out_ch_map          $WOVHOST_CH_MAP
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]


# ---------------------------------------------------------------------------
# Pipeline 116 — KPB & WOV Fanout (Core 0, LL 1ms)
# ECNS.115.1 Pin 0 (1ch mono clean) -> KPB.116.1 (2000ms) -> Mixin.116.1 (fanout 1 -> 3)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $WOV_KPB_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.kpb.1 {
			history_depth_ms $KPB_BUFF_TIME_MS
			num_input_pins  1
			num_output_pins 2
			num_input_audio_formats  1
			num_output_audio_formats 2

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 32
				}
			]
			Object.Base.output_audio_format [
				# Pin 0: real-time feed to the detector slots
				{
					output_pin_index    0
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 32
				}
				# Pin 1: drain path to the WOV arbiter and the host PCM
				{
					output_pin_index    1
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 32
				}
			]

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "mixin.116.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "wov-arbiter.114.1"
			}
		}

		Object.Widget.mixin.1 {
			num_input_pins  1
			num_output_pins 3
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 111 — WOV slot 0 (Core 0, 1ch mono)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $WOV_SLOT0_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.mixout.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.mfcc.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1
			scheduler_domain "DP"

			Object.Control {
				bytes."1" {
					name "MFCC 101 bytes"
					IncludeByKey.MWW_PCAN {
						"true"  "include/components/mfcc/mel40_10ms_pcan_compress.conf"
						"false" "include/components/mfcc/mel40_10ms_compress.conf"
					}
				}
				mixer."1" {
					name "MFCC 101 VAD"
					invert "true"
				}
			}

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 320
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 $MFCC_FRAME_BYTES
				}
			]
		}

		Object.Widget.mww.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1
			scheduler_domain "DP"

			Object.Control {
				bytes."1" {
					name "MWW 101 bytes"
					max 65536
				}
				enum."1" {
					name "MWW 101 Score"
					<include/components/mww/score_enum.conf>
				}
				mixer."1" {
					name "wovdebug_$index"
				}
			}

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $MWW_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 $MWW_INPUT_BYTES
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 112 — WOV slot 1 (Core 0, 1ch mono)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $WOV_SLOT1_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.mixout.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
