# ---------------------------------------------------------------------------
# Pipeline 114 — WOV Arbiter & Host Copier 11 (Core 0, Mono Output)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $WOV_ARB_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.wov-arbiter.1 {
			uuid $WOV_ARBITER_UUID
			num_input_pins  4
			num_output_pins 1
			num_input_audio_formats  4
			num_output_audio_formats 1

			Object.Base.input_pin_binding.1 {
				input_pin_binding_name "kpb.116.1"
			}
			Object.Base.input_pin_binding.2 {
				input_pin_binding_name "mww.111.1"
			}
			Object.Base.input_pin_binding.3 {
				input_pin_binding_name "mww.112.1"
			}
			Object.Base.input_pin_binding.4 {
				input_pin_binding_name "mww.113.1"
			}

			Object.Base.input_audio_format [
				# Pin 0: Audio from KPB host_sink (16-bit PCM, 16kHz mono)
				{
					input_pin_index     0
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 32
				}
				# Pin 1: Features from MWW slot 0 (8-bit PCAN, 16kHz mono)
				{
					input_pin_index     1
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $MWW_INPUT_BYTES
				}
				# Pin 2: Features from MWW slot 1 (8-bit PCAN, 16kHz mono)
				{
					input_pin_index     2
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $MWW_INPUT_BYTES
				}
				# Pin 3: Features from MWW slot 2 (8-bit PCAN, 16kHz mono)
				{
					input_pin_index     3
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $MWW_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 32
				}
			]
		}

		Object.Widget.host-copier.1 {
			stream_name $DMIC_WOV_PCM_CAPS
			pcm_id      $DMIC_WOV_PCM_ID
			node_type   $HDA_HOST_INPUT_CLASS
			direction   "capture"
			type        "aif_out"
			num_input_pins 1

			# IPC4 reads SOF_TKN_STREAM_CAPTURE_COMPATIBLE_D0I3 from the
			# host-copier widget tuples for low-power D0i3 WoV capture across S0iX
			capture_compatible_d0i3 true

			num_input_audio_formats  1
			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]

			num_output_audio_formats 2
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------
Object.Base.route [
	# DMIC 48k (dmic01) capture to ECNS Pin 1 (48k)
	{ source "dai-copier.DMIC.$DMIC_WOV_DAI_NAME.capture" sink "ecns.115.1" }

	# DMIC 16k (dmic16k) capture through the HPF/gain IIR to ECNS Pin 0 (16k)
	{ source "dai-copier.DMIC.$DMIC16K_DAI_NAME.capture"  sink "eqiir.119.1" }
	{ source "eqiir.119.1"                                sink "ecns.115.1" }

	# ECNS Output Pin 0 (16k mono) direct to KPB
	{ source "ecns.115.1"                                 sink "kpb.116.1" }
	{ source "kpb.116.1"                                  sink "mixin.116.1" }

	# ECNS Output Pin 1 (48k stereo) direct to Host Copier 11
	{ source "ecns.115.1"                                 sink "host-copier.$DMIC_ECNS_PCM_ID.capture" }

	# Audio path from KPB host_sink (pin 1) to WOV Arbiter audio input (pin 0)
	{ source "kpb.116.1"                                  sink "wov-arbiter.114.1" }

	# KPB mixin fanning out to 3 WOV detector slots (MFCC + MWW -> WOV Arbiter pins 1, 2, 3)
	{ source "mixin.116.1"                                sink "mixout.111.1" }
	{ source "mixout.111.1"                               sink "mfcc.111.1" }
	{ source "mfcc.111.1"                                 sink "mww.111.1" }
	{ source "mww.111.1"                                  sink "wov-arbiter.114.1" }

	{ source "mixin.116.1"                                sink "mixout.112.1" }
	{ source "mixout.112.1"                               sink "mfcc.112.1" }
	{ source "mfcc.112.1"                                 sink "mww.112.1" }
	{ source "mww.112.1"                                  sink "wov-arbiter.114.1" }

	{ source "mixin.116.1"                                sink "mixout.113.1" }
	{ source "mixout.113.1"                               sink "mfcc.113.1" }
	{ source "mfcc.113.1"                                 sink "mww.113.1" }
	{ source "mww.113.1"                                  sink "wov-arbiter.114.1" }

	# WOV Arbiter output to Host Copier 12
	{ source "wov-arbiter.114.1"                          sink "host-copier.$DMIC_WOV_PCM_ID.capture" }
]

# ---------------------------------------------------------------------------
# PCM Definitions:
# PCM 10: DMIC Raw 4ch Capture (48 kHz)
# PCM 11: ECNS Stereo Capture (48 kHz)
# PCM 12: WOV Arbiter Mono Capture (16 kHz)
# ---------------------------------------------------------------------------
Object.PCM.pcm [
	{
		name    "DMIC ECNS Capture"
		id      $DMIC_ECNS_PCM_ID
		direction "capture"
		capture_compatible_d0i3 true

		Object.Base.fe_dai.1 {
			name "$DMIC_ECNS_PCM_CAPS"
		}

		Object.PCM.pcm_caps.1 {
			name       "$DMIC_ECNS_PCM_CAPS"
			formats    "S16_LE"
			rates      "48000"
			channels_min $WOVHOST_CHANNELS
			channels_max $WOVHOST_CHANNELS
		}
	}
	{
		name    "DMIC Multi-WOV"
		id      $DMIC_WOV_PCM_ID
		direction "capture"
		capture_compatible_d0i3 true

		Object.Base.fe_dai.1 {
			name "$DMIC_WOV_PCM_CAPS"
		}

		Object.PCM.pcm_caps.1 {
			name       "$DMIC_WOV_PCM_CAPS"
			formats    "S16_LE,S32_LE"
			rates      "16000"
			channels_min 1
			channels_max 1
		}
	}
]
