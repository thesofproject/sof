# ---------------------------------------------------------------------------
# Pipeline 144 — headset WoV arbiter -> host PCM 14 (16 kHz mono)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $HS_WOV_ARB_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.wov-arbiter.1 {
			uuid $WOV_ARBITER_UUID
			num_input_pins  4
			num_output_pins 1
			num_input_audio_formats  4
			num_output_audio_formats 1

			Object.Base.input_pin_binding.1 {
				input_pin_binding_name "kpb.$HS_WOV_KPB_PIPELINE_ID.1"
			}
			Object.Base.input_pin_binding.2 {
				input_pin_binding_name "mww.$HS_WOV_SLOT0_PIPELINE_ID.1"
			}
			Object.Base.input_pin_binding.3 {
				input_pin_binding_name "mww.$HS_WOV_SLOT1_PIPELINE_ID.1"
			}
			Object.Base.input_pin_binding.4 {
				input_pin_binding_name "mww.$HS_WOV_SLOT2_PIPELINE_ID.1"
			}

			Object.Base.input_audio_format [
				{
					input_pin_index     0
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 32
				}
				{
					input_pin_index     1
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $MWW_INPUT_BYTES
				}
				{
					input_pin_index     2
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $MWW_INPUT_BYTES
				}
				{
					input_pin_index     3
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $MWW_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 32
				}
			]
		}

		Object.Widget.host-copier.1 {
			stream_name $HS_WOV_PCM_CAPS
			pcm_id      $HS_WOV_PCM_ID
			node_type   $HDA_HOST_INPUT_CLASS
			direction   "capture"
			type        "aif_out"
			num_input_pins 1
			capture_compatible_d0i3 $SDW_JACK_WOV_D0I3_COMPATIBLE

			num_input_audio_formats  1
			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]

			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------
Object.Base.route [
	# Jack capture copier fans out to both ECNS input rates. Keep the direct
	# 48 kHz route BEFORE the SRC route: DAPM walks the most recently added
	# sink edge first, and the kernel matches ECNS input params against its
	# pin 0 (16 kHz) formats, so ECNS must first be reached through the SRC.
	{ source "$HS_WOV_SOURCE"            sink "ecns.$HS_WOV_ECNS_PIPELINE_ID.1" }
	{ source "$HS_WOV_SOURCE"            sink "src.$HS_WOV_SRC_PIPELINE_ID.1" }
	{ source "src.$HS_WOV_SRC_PIPELINE_ID.1" sink "ecns.$HS_WOV_ECNS_PIPELINE_ID.1" }

	{ source "ecns.$HS_WOV_ECNS_PIPELINE_ID.1" sink "host-copier.$HS_ECNS_PCM_ID.capture" }
	{ source "ecns.$HS_WOV_ECNS_PIPELINE_ID.1" sink "kpb.$HS_WOV_KPB_PIPELINE_ID.1" }

	{ source "kpb.$HS_WOV_KPB_PIPELINE_ID.1" sink "module-copier.$HS_WOV_MIXIN_PIPELINE_ID.1" }
	{ source "kpb.$HS_WOV_KPB_PIPELINE_ID.1" sink "wov-arbiter.$HS_WOV_ARB_PIPELINE_ID.1" }

	{ source "module-copier.$HS_WOV_MIXIN_PIPELINE_ID.1" sink "module-copier.$HS_WOV_SLOT0_PIPELINE_ID.1" }
	{ source "module-copier.$HS_WOV_SLOT0_PIPELINE_ID.1" sink "mfcc.$HS_WOV_SLOT0_PIPELINE_ID.1" }
	{ source "mfcc.$HS_WOV_SLOT0_PIPELINE_ID.1" sink "mww.$HS_WOV_SLOT0_PIPELINE_ID.1" }
	{ source "mww.$HS_WOV_SLOT0_PIPELINE_ID.1" sink "wov-arbiter.$HS_WOV_ARB_PIPELINE_ID.1" }

	{ source "module-copier.$HS_WOV_MIXIN_PIPELINE_ID.1" sink "module-copier.$HS_WOV_SLOT1_PIPELINE_ID.1" }
	{ source "module-copier.$HS_WOV_SLOT1_PIPELINE_ID.1" sink "mfcc.$HS_WOV_SLOT1_PIPELINE_ID.1" }
	{ source "mfcc.$HS_WOV_SLOT1_PIPELINE_ID.1" sink "mww.$HS_WOV_SLOT1_PIPELINE_ID.1" }
	{ source "mww.$HS_WOV_SLOT1_PIPELINE_ID.1" sink "wov-arbiter.$HS_WOV_ARB_PIPELINE_ID.1" }

	{ source "module-copier.$HS_WOV_MIXIN_PIPELINE_ID.1" sink "module-copier.$HS_WOV_SLOT2_PIPELINE_ID.1" }
	{ source "module-copier.$HS_WOV_SLOT2_PIPELINE_ID.1" sink "mfcc.$HS_WOV_SLOT2_PIPELINE_ID.1" }
	{ source "mfcc.$HS_WOV_SLOT2_PIPELINE_ID.1" sink "mww.$HS_WOV_SLOT2_PIPELINE_ID.1" }
	{ source "mww.$HS_WOV_SLOT2_PIPELINE_ID.1" sink "wov-arbiter.$HS_WOV_ARB_PIPELINE_ID.1" }

	{ source "wov-arbiter.$HS_WOV_ARB_PIPELINE_ID.1" sink "host-copier.$HS_WOV_PCM_ID.capture" }
]

# ---------------------------------------------------------------------------
# PCMs
# PCM 13: headset ECNS stereo capture (48 kHz S16_LE)
# PCM 14: headset WoV arbiter mono capture (16 kHz S16_LE)
# ---------------------------------------------------------------------------
Object.PCM.pcm [
	{
		name    $HS_ECNS_PCM_NAME
		id      $HS_ECNS_PCM_ID
		direction "capture"
		capture_compatible_d0i3 $SDW_JACK_WOV_D0I3_COMPATIBLE

		Object.Base.fe_dai.1 {
			name "$HS_ECNS_PCM_CAPS"
		}

		Object.PCM.pcm_caps.1 {
			name       "$HS_ECNS_PCM_CAPS"
			formats    "S16_LE"
			rates      "48000"
			channels_min 2
			channels_max 2
		}
	}
	{
		name    $HS_WOV_PCM_NAME
		id      $HS_WOV_PCM_ID
		direction "capture"
		capture_compatible_d0i3 $SDW_JACK_WOV_D0I3_COMPATIBLE

		Object.Base.fe_dai.1 {
			name "$HS_WOV_PCM_CAPS"
		}

		Object.PCM.pcm_caps.1 {
			name       "$HS_WOV_PCM_CAPS"
			formats    "S16_LE"
			rates      "16000"
			channels_min 1
			channels_max 1
		}
	}
]
