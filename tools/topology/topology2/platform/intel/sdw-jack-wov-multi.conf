# ---------------------------------------------------------------------------
# Pipeline 141 — headset WoV slot 0 (MFCC + MWW)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $HS_WOV_SLOT0_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.module-copier.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.mfcc.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1
			scheduler_domain "DP"

			Object.Control {
				bytes."1" {
					name "MFCC 201 bytes"
					IncludeByKey.MWW_PCAN {
						"true"  "include/components/mfcc/mel40_10ms_pcan_compress.conf"
						"false" "include/components/mfcc/mel40_10ms_compress.conf"
					}
				}
				mixer."1" {
					name "MFCC 201 VAD"
					invert "true"
				}
			}

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 320
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 $MFCC_FRAME_BYTES
				}
			]
		}

		Object.Widget.mww.1 {
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1
			scheduler_domain "DP"

			Object.Control {
				bytes."1" {
					name "MWW 201 bytes"
					max 65536
				}
				enum."1" {
					name "MWW 201 Score"
					<include/components/mww/score_enum.conf>
				}
				mixer."1" {
					name "wovdebug_$index"
				}
			}

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         1
					in_ch_cfg           $CHANNEL_CONFIG_MONO
					in_ch_map           $CHANNEL_MAP_MONO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $MWW_INPUT_BYTES
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 $MWW_INPUT_BYTES
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

