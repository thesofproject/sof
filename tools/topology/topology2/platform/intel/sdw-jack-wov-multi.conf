#
# Multi-Slot Wake-on-Voice (WoV) for the RT722 SoundWire headset microphone.
#
# Second, independent WoV instance that coexists with the DMIC WoV graph in
# dmic-wov-multi.conf (which defines the custom pipeline classes and UUIDs
# used here, so this file must be included from it).
#
# module-copier.11.0 (Jack In, 48 kHz 2ch 32-bit) fans out to:
#   -> host-copier.1 (PCM 1 "Jack In", raw, unchanged)
#   -> ECNS pin 1 (48 kHz 2ch)
#   -> SRC 48k->16k (2ch) -> ECNS pin 0
# ECNS pin 0 (16 kHz mono) -> KPB -> copier fanout -> 3 x (MFCC + MWW) ->
#   WoV arbiter -> host PCM 14 "Headset Multi-WOV"
# ECNS pin 1 (48 kHz 2ch 16-bit) -> host PCM 13 "Headset ECNS Capture"
#
# Enabled with INCLUDE_WOV=multi and INCLUDE_SDW_JACK_WOV=true.
#

Define {
	HS_ECNS_PCM_ID           13
	HS_ECNS_PCM_CAPS         "Gain Capture 13"
	HS_ECNS_PCM_NAME         "Headset ECNS Capture"
	HS_WOV_PCM_ID            14
	HS_WOV_PCM_CAPS          "Gain Capture 14"
	HS_WOV_PCM_NAME          "Headset Multi-WOV"
	HS_WOV_SOURCE            "module-copier.11.0"
	SDW_JACK_WOV_D0I3_COMPATIBLE "true"

	HS_WOV_SRC_PIPELINE_ID       140
	HS_WOV_SLOT0_PIPELINE_ID     141
	HS_WOV_SLOT1_PIPELINE_ID     142
	HS_WOV_SLOT2_PIPELINE_ID     143
	HS_WOV_ARB_PIPELINE_ID       144
	HS_WOV_ECNS_PIPELINE_ID      145
	HS_WOV_KPB_PIPELINE_ID       146
	HS_WOV_ECNS_HOST_PIPELINE_ID 147
	HS_WOV_MIXIN_PIPELINE_ID     148
}

# ---------------------------------------------------------------------------
# Pipeline 140 — SRC 48 kHz -> 16 kHz (2ch 32-bit) for ECNS pin 0
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $HS_WOV_SRC_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       16000

		Object.Widget.src.1 {
			rate_in  48000
			rate_out 16000
			num_input_pins           1
			num_output_pins          1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 145 — headset ECNS (DP 20 ms)
# Pin 0 in: 16 kHz 2ch from SRC; pin 1 in: 48 kHz 2ch from the jack copier.
# Pin 0 out: 16 kHz mono -> KPB; pin 1 out: 48 kHz 2ch 16-bit -> PCM 13.
# ---------------------------------------------------------------------------
Object.Pipeline."custom-dp-capture" [
	{
		index      $HS_WOV_ECNS_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       48000

		Object.Widget.ecns.1 {
			uuid $ECNS_UUID
			num_input_pins  2
			num_output_pins 2
			num_input_audio_formats  2
			num_output_audio_formats 2

			Object.Base.input_pin_binding.1 {
				input_pin_binding_name "src.$HS_WOV_SRC_PIPELINE_ID.1"
			}
			Object.Base.input_pin_binding.2 {
				input_pin_binding_name "$HS_WOV_SOURCE"
			}

			Object.Base.input_audio_format [
				{
					input_pin_index     0
					in_rate             16000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 2560
				}
				{
					input_pin_index     1
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 7680
				}
			]
			Object.Base.output_audio_format [
				{
					output_pin_index    0
					out_rate            16000
					out_channels        1
					out_ch_cfg          $CHANNEL_CONFIG_MONO
					out_ch_map          $CHANNEL_MAP_MONO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 640
				}
				{
					output_pin_index    1
					out_rate            48000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 3840
				}
			]

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "kpb.$HS_WOV_KPB_PIPELINE_ID.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "host-copier.$HS_ECNS_PCM_ID.capture"
			}
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   1
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 147 — headset ECNS host capture (PCM 13, 48 kHz 2ch S16_LE)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $HS_WOV_ECNS_HOST_PIPELINE_ID
		format     $DMIC_WOV_FORMAT
		rate       48000

		Object.Widget.host-copier.1 {
			stream_name $HS_ECNS_PCM_CAPS
			pcm_id      $HS_ECNS_PCM_ID
			node_type   $HDA_HOST_INPUT_CLASS
			direction   "capture"
			type        "aif_out"
			num_input_pins 1
			capture_compatible_d0i3 $SDW_JACK_WOV_D0I3_COMPATIBLE

			num_input_audio_formats  1
			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]

			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_rate            48000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

