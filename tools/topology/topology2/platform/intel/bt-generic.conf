IncludeByKey.BT_LOOPBACK_MODE {
	"true"		"platform/intel/bt-ssp-config-lbm.conf"
}

IncludeByKey.BT_LOOPBACK_MODE {
	"false"	"platform/intel/bt-ssp-config.conf"
}

# Capture pipelines (low-latency SSP -> optional Transparent decoder -> host-copier)
Object.Pipeline {
	host-gateway-capture [
		{
			index	      $BT_CP_HOST_PIPELINE_ID
			Object.Widget.pipeline.1 {
				stream_name "dai-copier.SSP.$BT_NAME.capture"
			}
			Object.Widget.host-copier.1 {
				stream_name $BT_CP_PCM_CAPS
				pcm_id	$BT_PCM_ID
				IncludeByKey.BT_TRANSP_CODEC {
					"none" {
						num_input_audio_formats 3
						num_output_audio_formats 3
						CombineArrays.Object.Base.output_audio_format [
							{
								out_rate [
									8000
									16000
								]
								out_channels [ 1 ]
							}
							{
								out_bit_depth		[ 16 ]
								out_valid_bit_depth	[ 16 ]
								out_channels		[ 2 ]
							}
						]
						CombineArrays.Object.Base.input_audio_format [
							{
								in_rate [
									8000
									16000
								]
								in_channels [ 1 ]
							}
							{
								in_bit_depth		[ 16 ]
								in_valid_bit_depth	[ 16 ]
								in_channels		[ 2 ]
							}
						]
					}
					"(lc3|msbc|g722|sb4)" {
						num_input_audio_formats 2
						num_output_audio_formats 2
						CombineArrays.Object.Base.output_audio_format [
							{
								out_rate [
									8000
									16000
								]
								out_bit_depth		[ 16 ]
								out_valid_bit_depth	[ 16 ]
								out_channels		[ 1 ]
								out_ch_cfg		[ $CHANNEL_CONFIG_MONO ]
								out_ch_map		[ $CHANNEL_MAP_MONO ]
							}
						]
						CombineArrays.Object.Base.input_audio_format [
							{
								in_rate [
									8000
									16000
								]
								in_bit_depth		[ 16 ]
								in_valid_bit_depth	[ 16 ]
								in_channels		[ 1 ]
								in_ch_cfg		[ $CHANNEL_CONFIG_MONO ]
								in_ch_map		[ $CHANNEL_MAP_MONO ]
							}
						]
					}
				}
			}
		}
	]

	io-gateway-capture [
		{
			index		$BT_CP_DAI_PIPELINE_ID
			direction	"capture"
			Object.Widget.pipeline.1 {
				stream_name "dai-copier.SSP.$BT_NAME.capture"
			}

			Object.Widget.dai-copier."1" {
				dai_index	$BT_INDEX
				dai_type	"SSP"
				type		dai_out
				copier_type	"SSP"
				stream_name	$BT_NAME
				node_type	$I2S_LINK_INPUT_CLASS
				IncludeByKey.BT_TRANSP_CODEC {
					"none" {
						num_input_audio_formats 3
						num_output_audio_formats 3
						CombineArrays.Object.Base.output_audio_format [
							{
								out_rate [
									8000
									16000
								]
								out_channels [ 1 ]
							}
							{
								out_bit_depth		[ 16 ]
								out_valid_bit_depth	[ 16 ]
								out_channels		[ 2 ]
							}
						]
						CombineArrays.Object.Base.input_audio_format [
							{
								in_rate [
									8000
									16000
								]
								in_channels [ 1 ]
							}
							{
								in_bit_depth		[ 16 ]
								in_valid_bit_depth	[ 16 ]
								in_channels		[ 2 ]
							}
						]
					}
					"(lc3|msbc|g722|sb4)" {
						num_input_audio_formats 1
						num_output_audio_formats 1
						Object.Base.output_audio_format [
							{
								out_rate		8000
								out_bit_depth		16
								out_valid_bit_depth	16
								out_channels		1
								out_ch_cfg		$CHANNEL_CONFIG_MONO
								out_ch_map		$CHANNEL_MAP_MONO
							}
						]
						Object.Base.input_audio_format [
							{
								in_rate			8000
								in_bit_depth		16
								in_valid_bit_depth	16
								in_channels		1
								in_ch_cfg		$CHANNEL_CONFIG_MONO
								in_ch_map		$CHANNEL_MAP_MONO
							}
						]
					}
				}
			}
		}
	]
}

