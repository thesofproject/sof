		Object.PCM.pcm [
			{
				name		$BT_PCM_NAME
				id 		$BT_PCM_ID
				direction	"duplex"

				Object.Base.fe_dai.1 {
					name "$BT_PCM_NAME"
				}

				IncludeByKey.BT_TRANSP_CODEC {
					"none" {
						Object.PCM.pcm_caps.1 {
							direction   "playback"
							name $BT_PB_PCM_CAPS
							formats	'S16_LE,S24_LE,S32_LE'
							rates '8000,16000,48000'
							rate_min 8000
							rate_max 48000
							channels_min 1
							channels_max 2
						}

						Object.PCM.pcm_caps.2 {
							direction   "capture"
							name	$BT_CP_PCM_CAPS
							formats 'S16_LE'
							rates '8000,16000,48000'
							rate_min 8000
							rate_max 48000
							channels_min 1
							channels_max 2
						}
					}
					"(lc3|msbc|g722|sb4)" {
						Object.PCM.pcm_caps.1 {
							direction   "playback"
							name $BT_PB_PCM_CAPS
							formats	'S16_LE,S24_LE,S32_LE'
							rates '8000,16000'
							rate_min 8000
							rate_max 16000
							channels_min 1
							channels_max 1
						}

						Object.PCM.pcm_caps.2 {
							direction   "capture"
							name	$BT_CP_PCM_CAPS
							formats 'S16_LE'
							rates '8000,16000'
							rate_min 8000
							rate_max 16000
							channels_min 1
							channels_max 1
						}
					}
				}
			}
