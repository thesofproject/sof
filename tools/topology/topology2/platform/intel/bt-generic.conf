		Object.PCM.pcm [
			{
				name		$BT_PCM_NAME
				id 		$BT_PCM_ID
				direction	"duplex"

				Object.Base.fe_dai.1 {
				}

				IncludeByKey.BT_TRANSP_CODEC {
					"none" {
						Object.PCM.pcm_caps.1 {
							direction   "playback"
							name $BT_PB_PCM_CAPS
							formats	'S16_LE'
							rates '8000,16000,48000'
							channels_min 1
							channels_max 2
						}

						Object.PCM.pcm_caps.2 {
							direction   "capture"
							name	$BT_CP_PCM_CAPS
							formats 'S16_LE'
							rates '8000,16000,48000'
							channels_min 1
							channels_max 2
						}
					}
					"(lc3|msbc|g722|sb4)" {
						Object.PCM.pcm_caps.1 {
							direction   "playback"
							name $BT_PB_PCM_CAPS
							formats	'S16_LE'
							rates '8000,16000'
							rate_min 8000
							rate_max 16000
							channels_min 1
							channels_max 1
						}

						Object.PCM.pcm_caps.2 {
							direction   "capture"
							name	$BT_CP_PCM_CAPS
							formats 'S16_LE'
							rates '8000,16000'
							rate_min 8000
							rate_max 16000
							channels_min 1
							channels_max 1
						}
					}
				}
			}
		]
	}

	"true" {
		# Deepbuffer playback FE ($BT_DEEP_BUFFER_PCM_ID -> mixin.$BT_DEEP_BUFFER_PIPELINE_ID.1)
		IncludeByKey.BT_DEEPBUFFER_FW_DMA_MS {
			"([1-9]|[1-9][0-9]|[1-9][0-9][0-9]|1000)" "platform/intel/bt-deep-buffer.conf"
		}

		# Low-latency playback FE ($BT_PCM_ID) + shared S32_LE BE mixer into SSP
		Object.Pipeline {
			host-copier-gain-mixin-playback [
				{
					index $BT_PB_HOST_PIPELINE_ID

					Object.Widget.host-copier.1 {
						stream_name $BT_PB_PCM_CAPS
						pcm_id $BT_PCM_ID
						<include/formats/bt_host_input_audio_formats.conf>
						<include/formats/bt_s32_output_audio_formats.conf>
					}
					Object.Widget.gain.1 {
						Object.Control.mixer.1 {
							name 'Pre Mixer $BT_PCM_NAME Playback Volume'
						}
						<include/formats/bt_s32_input_audio_formats.conf>
						<include/formats/bt_s32_output_audio_formats.conf>
					}
					Object.Widget.mixin.1 {
						<include/formats/bt_s32_input_audio_formats.conf>
						<include/formats/bt_s32_output_audio_formats.conf>
					}
				}
			]

			mixout-gain-dai-copier-playback [
				{
					index $BT_PB_DAI_PIPELINE_ID

					Object.Widget.mixout.1 {
						<include/formats/bt_s32_input_audio_formats.conf>
						<include/formats/bt_s32_output_audio_formats.conf>
					}
					Object.Widget.gain.1 {
						Object.Control.mixer.1 {
							name 'Post Mixer $BT_PCM_NAME Playback Volume'
						}
						<include/formats/bt_s32_input_audio_formats.conf>
						<include/formats/bt_s32_output_audio_formats.conf>
					}
					Object.Widget.dai-copier.1 {
						dai_index      $BT_INDEX
						dai_type       "SSP"
						copier_type    "SSP"
						stream_name    $BT_NAME
						node_type      $I2S_LINK_OUTPUT_CLASS
						IncludeByKey.BT_TRANSP_CODEC {
							"none" {
								<include/formats/bt_s32_input_audio_formats.conf>
							}
							"(lc3|msbc|g722|sb4)" {
								num_input_audio_formats 1
								Object.Base.input_audio_format [
									{
										in_rate 8000
										in_bit_depth 32
										in_valid_bit_depth 32
										in_channels 1
										in_ch_cfg $CHANNEL_CONFIG_MONO
										in_ch_map $CHANNEL_MAP_MONO
									}
								]
							}
						}
						<include/formats/bt_ssp_s16_output_audio_formats.conf>
					}
				}
			]
		}

		Object.Base.route [
			{
				source	"host-copier.$BT_PCM_ID.playback"
				sink	"gain.$BT_PB_HOST_PIPELINE_ID.1"
			}
			{
				source	"mixin.$BT_PB_HOST_PIPELINE_ID.1"
				sink	"mixout.$BT_PB_DAI_PIPELINE_ID.1"
			}
		]

		IncludeByKey.BT_TRANSP_CODEC {
			"none" {
				Object.Base.route [
					{
						source	"gain.$BT_PB_DAI_PIPELINE_ID.1"
						sink	"dai-copier.SSP.$BT_NAME.playback"
					}
					{
						source	"dai-copier.SSP.$BT_NAME.capture"
						sink	"host-copier.$BT_PCM_ID.capture"
					}
				]
			}
			"lc3" {
				Object.Widget.bt_lc3.1 {
					index $BT_PB_DAI_PIPELINE_ID
					<include/formats/bt_s32_input_audio_formats.conf>
					num_output_audio_formats 1
					Object.Base.output_audio_format [
						{
							out_rate 8000
							out_bit_depth 32
							out_valid_bit_depth 32
							out_channels 1
							out_ch_cfg $CHANNEL_CONFIG_MONO
							out_ch_map $CHANNEL_MAP_MONO
						}
					]
				}
				Object.Widget.bt_lc3.2 {
					index $BT_CP_HOST_PIPELINE_ID
					<include/components/bt-codec-formats.conf>
				}
				Object.Base.route [
					{
						source	"gain.$BT_PB_DAI_PIPELINE_ID.1"
						sink	"bt_lc3.$BT_PB_DAI_PIPELINE_ID.1"
					}
					{
						source	"bt_lc3.$BT_PB_DAI_PIPELINE_ID.1"
						sink	"dai-copier.SSP.$BT_NAME.playback"
					}
					{
						source	"dai-copier.SSP.$BT_NAME.capture"
						sink	"bt_lc3.$BT_CP_HOST_PIPELINE_ID.2"
					}
					{
