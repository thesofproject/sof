# Second stream pair of a USB Audio Offload Link (UAOL).
#
# Included by platform/intel/uaol-generic.conf when UAOL_NUM_STREAMS is 2. The
# same paths as the first pair, on the UAOL_*1_* variables, the deep buffer
# from platform/intel/uaol-deep-buffer1.conf on UAOL_DB1_*.
#
#   PCM ---------------> gain ---> mixin ---+
#                                           |
#   Deepbuffer PCM ----> gain ---> mixin ---+--> mixout --> gain --> UAOL0-Play1
#
#   PCM <------------ module-copier <--- eqiir <---------------- UAOL0-Cap1

IncludeByKey.UAOL_DEEP_BUFFER {
	"true" {
		IncludeByKey.DEEPBUFFER_FW_DMA_MS {
			"([1-9]|[1-9][0-9]|[1-9][0-9][0-9]|1000)" "platform/intel/uaol-deep-buffer1.conf"
		}
	}
}

Object.Dai.UAOL [
	{
		name $UAOL_PB1_DAI_NAME
		dai_index $UAOL_DAI_INDEX
		id $UAOL_PB1_BE_ID
		default_hw_conf_id 0
		Object.Base.hw_config.1 {
			name	$UAOL_PB1_DAI_NAME
		}
		direction playback
	}
	{
		name $UAOL_CP1_DAI_NAME
		dai_index $UAOL_DAI_INDEX
		id $UAOL_CP1_BE_ID
		default_hw_conf_id 0
		Object.Base.hw_config.1 {
			name	$UAOL_CP1_DAI_NAME
		}
		direction capture
	}
]

Object.Pipeline {
	host-copier-gain-mixin-playback [
		{
			index $UAOL_PB1_HOST_PIPELINE_ID

			Object.Widget.host-copier.1 {
				stream_name $UAOL_PLAYBACK1_PCM
				pcm_id $UAOL_PCM1_ID
				<include/formats/uaol_input_audio_formats.conf>
				<include/formats/uaol_output_audio_formats_s32.conf>
			}
			Object.Widget.gain.1 {
				Object.Control.mixer.1 {
					name 'Pre Mixer $UAOL_PCM1_NAME Playback Volume'
				}
				<include/formats/uaol_input_audio_formats_s32.conf>
				<include/formats/uaol_output_audio_formats_s32.conf>
			}
			Object.Widget.mixin.1 {
				<include/formats/uaol_input_audio_formats_s32.conf>
				<include/formats/uaol_output_audio_formats_s32.conf>
			}
		}
	]

	mixout-gain-dai-copier-playback [
		{
			index $UAOL_PB1_DAI_PIPELINE_ID

			Object.Widget.mixout.1 {
				<include/formats/uaol_input_audio_formats_s32.conf>
				<include/formats/uaol_output_audio_formats_s32.conf>
			}
			Object.Widget.dai-copier.1 {
				node_type $ALH_UAOL_STREAM_LINK_OUTPUT_CLASS
				stream_name $UAOL_PB1_DAI_NAME
				dai_type "UAOL"
				copier_type "UAOL"
				<include/formats/uaol_input_audio_formats_s32.conf>
				<include/formats/uaol_output_audio_formats_msb.conf>
			}
			Object.Widget.gain.1 {
				Object.Control.mixer.1 {
					name 'Post Mixer $UAOL_PCM1_NAME Playback Volume'
				}
				<include/formats/uaol_input_audio_formats_s32.conf>
				<include/formats/uaol_output_audio_formats_s32.conf>
			}
		}
	]

	host-gateway-capture [
		{
			index $UAOL_CP1_HOST_PIPELINE_ID

			Object.Widget.host-copier.1 {
				stream_name $UAOL_CAPTURE1_PCM
				pcm_id $UAOL_PCM1_ID
				<include/formats/uaol_input_audio_formats_s32.conf>
				<include/formats/uaol_output_audio_formats.conf>
			}
		}
	]

	dai-copier-eqiir-module-copier-capture [
		{
			index $UAOL_CP1_DAI_PIPELINE_ID

			Object.Widget.dai-copier.1 {
				node_type $ALH_UAOL_STREAM_LINK_INPUT_CLASS
				stream_name $UAOL_CP1_DAI_NAME
				dai_type "UAOL"
				type dai_out
				copier_type "UAOL"
				num_output_pins 1
				<include/formats/uaol_input_audio_formats_msb.conf>
				<include/formats/uaol_output_audio_formats_s32.conf>
			}

			# The coefficients are designed for 48 kHz, so the corner
			# frequency scales with the rate the device is run at
			Object.Widget.eqiir.1 {
				Object.Control.bytes.1 {
					name '$UAOL_PCM1_NAME Capture IIR Eq'
					<include/components/eqiir/highpass_40hz_0db_48khz.conf>
				}
				<include/formats/uaol_input_audio_formats_s32.conf>
				<include/formats/uaol_output_audio_formats_s32.conf>
			}

			Object.Widget.module-copier.2 {
				<include/formats/uaol_input_audio_formats_s32.conf>
				<include/formats/uaol_output_audio_formats_s32.conf>
			}
		}
	]
}

Object.PCM.pcm [
	{
		name	$UAOL_PCM1_NAME
		id $UAOL_PCM1_ID
		direction	"duplex"
		Object.Base.fe_dai.1 {
			name	$UAOL_PCM1_NAME
		}
		Object.PCM.pcm_caps.1 {
			direction	"playback"
			name $UAOL_PLAYBACK1_PCM
			formats 'S16_LE,S24_LE,S32_LE'
			channels_min $UAOL_CHANNELS_MIN
			channels_max $UAOL_CHANNELS_MAX
			rates $UAOL_RATES
			rate_min $UAOL_RATE_MIN
			rate_max $UAOL_RATE_MAX
		}
		Object.PCM.pcm_caps.2 {
			direction	"capture"
			name $UAOL_CAPTURE1_PCM
			formats 'S16_LE,S24_LE,S32_LE'
			channels_min $UAOL_CHANNELS_MIN
			channels_max $UAOL_CHANNELS_MAX
			rates $UAOL_RATES
			rate_min $UAOL_RATE_MIN
			rate_max $UAOL_RATE_MAX
		}
	}
]

# top-level pipeline connections
Object.Base.route [
	{
		source "host-copier.$UAOL_PCM1_ID.playback"
		sink "gain.$UAOL_PB1_HOST_PIPELINE_ID.1"
	}
	{
		source "mixin.$UAOL_PB1_HOST_PIPELINE_ID.1"
		sink "mixout.$UAOL_PB1_DAI_PIPELINE_ID.1"
	}
	{
		source "gain.$UAOL_PB1_DAI_PIPELINE_ID.1"
		sink "dai-copier.UAOL.$UAOL_PB1_DAI_NAME.playback"
	}
	{
		source "dai-copier.UAOL.$UAOL_CP1_DAI_NAME.capture"
		sink "eqiir.$UAOL_CP1_DAI_PIPELINE_ID.1"
	}
	{
		source "module-copier.$UAOL_CP1_DAI_PIPELINE_ID.2"
		sink "host-copier.$UAOL_PCM1_ID.capture"
	}
]
