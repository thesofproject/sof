Object.Widget {
	alh-copier [
		{
			index 41
			type dai_out
			stream_name	$SDW_DMIC_STREAM
			type		"dai_out"
			direction	"capture"
			node_type $ALH_LINK_INPUT_CLASS
			num_input_audio_formats 1
			num_output_audio_formats 1
			num_output_pins 1

			# 32-bit 48KHz capture, channel count derived from NUM_DMICS.
			Object.Base.input_audio_format [
				{
					in_channels		$SDW_DMIC_PCM_CHANNELS
					in_bit_depth            32
					in_valid_bit_depth      $SDW_LINK_VALID_BITS
					in_sample_type		$SAMPLE_TYPE_MSB_INTEGER
					in_ch_cfg		$SDW_DMIC_CHANNEL_CFG
					in_ch_map		$SDW_DMIC_CHANNEL_MAP
					in_fmt_cfg		"$[($in_channels | ($in_valid_bit_depth * 256))]"
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels		$SDW_DMIC_PCM_CHANNELS
					out_bit_depth            32
					out_valid_bit_depth      32
					out_ch_cfg		$SDW_DMIC_CHANNEL_CFG
					out_ch_map		$SDW_DMIC_CHANNEL_MAP
				}
			]
		}
	]
	pipeline [
		{
			index		41
			priority	0
			lp_mode	0
			dynamic_pipeline 1

			IncludeByKey.SDW_DMIC_PASSTHROUGH {
				"false" {
					Object.Widget.eqiir [
						{
							num_input_audio_formats 1
							num_output_audio_formats 1
							# index 41 is in	herited from the pipeline definition
							Object.Base.input_audio_format [
								{
									in_channels		$SDW_DMIC_PCM_CHANNELS
									in_bit_depth		32
									in_valid_bit_depth	32
									in_ch_cfg		$SDW_DMIC_CHANNEL_CFG
									in_ch_map		$SDW_DMIC_CHANNEL_MAP
								}
							]
							Object.Base.output_audio_format [
								{
									out_channels		$SDW_DMIC_PCM_CHANNELS
									out_bit_depth		32
									out_valid_bit_depth	32
									out_ch_cfg		$SDW_DMIC_CHANNEL_CFG
									out_ch_map		$SDW_DMIC_CHANNEL_MAP
								}
							]

							Object.Control.bytes."1" {
								<include/components/eqiir/highpass_40hz_0db_48khz.conf>
								name '$SDW_DMIC_CAPTURE_PCM_NAME Capture IIR Eq'
							}
						}
					]
                                        Object.Widget.module-copier [
                                                {
                                                        num_input_audio_formats     1
                                                        num_output_audio_formats    1
                                                        Object.Base.input_audio_format [
                                                                {
									in_channels		$SDW_DMIC_PCM_CHANNELS
                                                                        in_bit_depth		32
                                                                        in_valid_bit_depth	32
									in_ch_cfg		$SDW_DMIC_CHANNEL_CFG
									in_ch_map		$SDW_DMIC_CHANNEL_MAP
                                                                }
                                                        ]
                                                        Object.Base.output_audio_format [
                                                                {
									out_channels		$SDW_DMIC_PCM_CHANNELS
                                                                        out_bit_depth		32
                                                                        out_valid_bit_depth	32
									out_ch_cfg		$SDW_DMIC_CHANNEL_CFG
									out_ch_map		$SDW_DMIC_CHANNEL_MAP
                                                                }
                                                        ]
						}
                                        ]
				}
			}
		}
	]
}

Object.PCM.pcm [
	{
		name	"Microphone"
		id 4
		direction	"capture"
		Object.Base.fe_dai.1 {
			name "SDW DMIC"
		}

		Object.PCM.pcm_caps.1 {
			name "sdw dmic"
			channels_min	$SDW_DMIC_PCM_CHANNELS
			channels_max	$SDW_DMIC_PCM_CHANNELS
			IncludeByKey.PCM_FORMAT_ALL {
				"true" {
					formats 'S16_LE,S24_LE,S32_LE,U8,FLOAT_LE'
				}
				"false" {
					formats 'S16_LE,S24_LE,S32_LE'
				}
			}
		}
	}
]

IncludeByKey.SDW_DMIC_PASSTHROUGH {
	"true" {
		Object.Base.route [
			{
				source	"alh-copier.$SDW_DMIC_STREAM.0"
				sink	"host-copier.4.capture"
			}
		]
	}
	"false" {
		Object.Base.route [
			{
				source	"alh-copier.$SDW_DMIC_STREAM.0"
				sink	"eqiir.41.0"
			}
			{
				source	"eqiir.41.0"
				sink	"module-copier.41.0"
			}
                ]
                IncludeByKey.SDW_DMIC_ENHANCED_CAPTURE {
                        "true" {
                                Object.Base.route [
                                        {
                                                source  "module-copier.41.0"
                                                sink    "tdfb.40.1"
                                        }
                                        {
                                                source  "drc.40.1"
                                                sink	"host-copier.4.capture"
                                        }
                                ]
                        }
                        "false" {
                                Object.Base.route [
                                        {
                                                source "module-copier.41.0"
                                                sink	"host-copier.4.capture"
                                        }
                                ]
                        }
                }
	}
}
