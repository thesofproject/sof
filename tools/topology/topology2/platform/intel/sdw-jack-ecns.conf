#
# 48 kHz ECNS for the SoundWire headset microphone.
#
# module-copier.11.0 (Jack In, 48 kHz 2ch 32-bit) -> ecns.151.1 Pin 0
# module-copier.1.12 (Jack Out) -> siggen.150.1 (48 kHz stereo, silence
#	when the jack playback is not running) -> ecns.151.1 Pin 1
# ecns.151.1 (48 kHz 2ch s32) -> host-copier PCM 13 "Jack In ECNS"
#
# There is only one Loopback_Virtual DAI, alh-copier.Loopback_Virtual.25 of
# cavs-sdw.conf. It is routed also to siggen.150.1 so that it is the dai_out
# widget that starts the setup of the jack echo reference pipeline with the
# PCM 13 capture, as it does for the speaker echo reference pipeline of
# dmic-wov-multi.conf.
#
# Included from dmic-wov-multi.conf because it reuses the pipeline classes and
# UUIDs defined there. Enabled with INCLUDE_WOV=multi and
# INCLUDE_SDW_JACK_ECNS=true. Requires SDW_ECHO_REF_DAI=true, JACK_RATE 48000
# and SDW_JACK_CAPTURE_CH 2.
#

Define {
	SDW_JACK_ECNS_PCM_ID            13
	SDW_JACK_ECNS_PCM_CAPS          "ECNS Capture 13"
	SDW_JACK_ECNS_PCM_NAME          "Jack In ECNS"

	SDW_JACK_ECNS_REF_PIPELINE_ID   150
	SDW_JACK_ECNS_PIPELINE_ID       151
	SDW_JACK_ECNS_HOST_PIPELINE_ID  152

	# 20 ms of 48 kHz stereo s32 for the microphones, the echo reference
	# and the output
	SDW_JACK_ECNS_IBS               7680
	SDW_JACK_ECNS_OBS               7680
}

# ---------------------------------------------------------------------------
# Pipeline 150 — Jack echo reference (Core 0, LL 1ms)
# module-copier.1.12 (Jack Out 48k stereo) and Loopback_Virtual.25 ->
# siggen.150.1 (48k stereo s32) -> ECNS.151.1 Pin 1
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $SDW_JACK_ECNS_REF_PIPELINE_ID
		format     "s32le"
		rate       48000

		# the 48 kHz stereo 32-bit output format is the siggen class default
		Object.Widget.siggen.1 {
			num_input_pins 1
			num_output_pins 1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 151 — 48 kHz Jack ECNS DP Pipeline (Core 0, 20ms DP, lp_mode 1)
# module-copier.11.0 (Jack In 48k 2ch) -> ECNS.151.1 Pin 0
# siggen.150.1 (48k stereo) -> ECNS.151.1 Pin 1
# Pin 0 out: 48k 2ch s32 -> host-copier PCM 13 (pipeline 152)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-dp-capture" [
	{
		index      $SDW_JACK_ECNS_PIPELINE_ID
		format     "s32le"
		rate       48000

		Object.Widget.ecns.1 {
			uuid $ECNS_UUID
			num_input_pins  2
			num_output_pins 1
			num_input_audio_formats  2
			num_output_audio_formats 1

			Object.Control.mixer."1" {
				name "Jack ECNS boost"
			}
			Object.Control.mixer."2" {
				name "Jack ECNS AEC switch"
			}
			Object.Control.mixer."3" {
				name "Jack ECNS NS switch"
			}
			Object.Control.enum."1" {
				name "Jack ECNS mic channel"
				<include/components/ecns/mic_sel_2ch.conf>
			}

			Object.Base.input_pin_binding.1 {
				input_pin_binding_name "module-copier.11.0"
			}
			Object.Base.input_pin_binding.2 {
				input_pin_binding_name "siggen.$SDW_JACK_ECNS_REF_PIPELINE_ID.1"
			}

			Object.Base.input_audio_format [
				# Pin 0: 48 kHz headset microphone
				{
					input_pin_index     0
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $SDW_JACK_ECNS_IBS
				}
				# Pin 1: 48 kHz stereo jack echo reference
				{
					input_pin_index     1
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        32
					in_valid_bit_depth  32
					ibs                 $SDW_JACK_ECNS_IBS
				}
			]

			# Output: stereo s32 to the host copier, the firmware follows
			# the sink format channels and bit depth
			Object.Base.output_audio_format [
				{
					output_pin_index    0
					out_rate            48000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       32
					out_valid_bit_depth 32
					obs                 $SDW_JACK_ECNS_OBS
				}
			]

			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "host-copier.$SDW_JACK_ECNS_PCM_ID.capture"
			}
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   1
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Pipeline 152 — Host Copier 13 (Core 0, LL 1ms)
# ECNS.151.1 (48k 2ch s32) -> host-copier PCM 13 (S16_LE or S32_LE)
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      $SDW_JACK_ECNS_HOST_PIPELINE_ID
		format     "s32le"
		rate       48000

		Object.Widget.host-copier.1 {
			stream_name $SDW_JACK_ECNS_PCM_CAPS
			pcm_id      $SDW_JACK_ECNS_PCM_ID
			node_type   $HDA_HOST_INPUT_CLASS
			direction   "capture"
			type        "aif_out"
			num_input_pins 1

			num_input_audio_formats  1
			Object.Base.input_audio_format [
				{
					in_rate             48000
					in_channels         2
					in_ch_cfg           $CHANNEL_CONFIG_STEREO
					in_ch_map           $CHANNEL_MAP_STEREO
					in_bit_depth        32
					in_valid_bit_depth  32
				}
			]

			num_output_audio_formats 2
			Object.Base.output_audio_format [
				{
					out_rate            48000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       16
					out_valid_bit_depth 16
				}
				{
					out_rate            48000
					out_channels        2
					out_ch_cfg          $CHANNEL_CONFIG_STEREO
					out_ch_map          $CHANNEL_MAP_STEREO
					out_bit_depth       32
					out_valid_bit_depth 32
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   $WOV_CORE_ID
		}
	}
]

# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------
Object.Base.route [
	# Jack echo reference into the siggen, the Loopback_Virtual DAI starts
	# the setup of the pipeline
	{ source "alh-copier.Loopback_Virtual.25"              sink "siggen.$SDW_JACK_ECNS_REF_PIPELINE_ID.1" }
	{ source "module-copier.1.12"                          sink "siggen.$SDW_JACK_ECNS_REF_PIPELINE_ID.1" }

	# Headset microphone to Pin 0, jack echo reference to Pin 1, output to
	# Host Copier 13
	{ source "module-copier.11.0"                          sink "ecns.$SDW_JACK_ECNS_PIPELINE_ID.1" }
	{ source "siggen.$SDW_JACK_ECNS_REF_PIPELINE_ID.1"     sink "ecns.$SDW_JACK_ECNS_PIPELINE_ID.1" }
	{ source "ecns.$SDW_JACK_ECNS_PIPELINE_ID.1"           sink "host-copier.$SDW_JACK_ECNS_PCM_ID.capture" }
]

# ---------------------------------------------------------------------------
# PCM 13: 48 kHz ECNS processed headset microphone stereo capture
# ---------------------------------------------------------------------------
Object.PCM.pcm [
	{
		name    "$SDW_JACK_ECNS_PCM_NAME"
		id      $SDW_JACK_ECNS_PCM_ID
		direction "capture"

		Object.Base.fe_dai.1 {
			name "$SDW_JACK_ECNS_PCM_CAPS"
		}

		Object.PCM.pcm_caps.1 {
			name       "$SDW_JACK_ECNS_PCM_CAPS"
			formats    "S16_LE,S32_LE"
			rates      "48000"
			channels_min 2
			channels_max 2
		}
	}
]
