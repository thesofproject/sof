# SPDX-License-Identifier: BSD-3-Clause
#
# PCH DMIC microWakeWord (MWW)/KPB Wake-on-Voice capture branch.
#
# Layered on top of cavs-rt5682.conf via IncludeByKey.DMIC_MWW_KPB_CAPTURE.
# Taps DMIC1 (16 kHz 4-channel DAI) into:
#
#   dai-copier (16 kHz 4ch)
#     -> micsel (4ch -> 1ch mono with 0.25 coefficients)
#     -> eqiir (1ch 16 kHz highpass)
#     -> KPB (16 kHz mono, dual sinks)
#          pin 0 -> MFCC (PCAN 40 mel 10ms compress) -> MWW -> virtual.detect_sink
#                   ----------------------------------> host-copier: "$MWW_WOV_PCM_NAME" PCM
#          pin 1 -> host-copier: "$MWW_WOV_PCM_NAME" PCM
#
# KPB output_pin_binding names match kernel widget names (see
# sof_ipc4_get_queue_id): host-copier.<pcm_id>.<direction> and
# <widget>.<index>.<queue>.

Define {
	MWW_WOV_PIPELINE_ID		102
	MWW_WOV_PCM_ID			102
	MWW_WOV_PCM_NAME		"DMIC WoV Capture"
	MWW_WOV_STREAM_NAME		"DMIC WoV Capture Stream"
	MWW_DETECT_PIPELINE_ID		103
	MWW_DETECT_PCM_NAME		"DMIC MWW Detect"
	MWW_DETECT_KPB_PIPELINE_ID	19
	MWW_CAPTURE_D0I3		true
}

Object.Pipeline.dai-copier-micsel-eqiir-kpb-be [
	{
		index $DMIC1_DAI_PIPELINE_ID

		Object.Widget.dai-copier.1 {
			dai_index 1
			stream_name $DMIC1_NAME
		}

		Object.Widget.micsel.1 {
			Object.Control {
				bytes."1" {
					name "$MWW_WOV_PCM_NAME Micsel bytes"
					<include/components/micsel/downmix_4ch_to_mono.conf>
				}
			}
		}

		Object.Widget.eqiir.1 {
			Object.Control {
				bytes."1" {
					name "$MWW_WOV_PCM_NAME Capture IIR Eq"
					<include/components/eqiir/highpass_100hz_20db_16khz.conf>
				}
			}
		}

		Object.Widget.kpb.1 {
			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "mfcc.$MWW_DETECT_PIPELINE_ID.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "host-copier.$MWW_WOV_PCM_ID.capture"
			}
		}
	}
]

Object.Base.route [
	{
		source "dai-copier.DMIC.$DMIC1_NAME.capture"
		sink "micsel.$DMIC1_DAI_PIPELINE_ID.1"
	}
	{
		source "micsel.$DMIC1_DAI_PIPELINE_ID.1"
		sink "eqiir.$DMIC1_DAI_PIPELINE_ID.1"
	}
	{
		source "eqiir.$DMIC1_DAI_PIPELINE_ID.1"
		sink "kpb.$DMIC1_DAI_PIPELINE_ID.1"
	}
]

<platform/intel/mww-kpb-fe.conf>
