# SPDX-License-Identifier: BSD-3-Clause
#
# PCH DMIC microWakeWord (MWW)/KPB Wake-on-Voice capture branch.
#
# Layered on top of cavs-rt5682.conf via IncludeByKey.DMIC_MWW_KPB_CAPTURE.
# Taps DMIC1 (16 kHz 4-channel DAI) into:
#
#   dai-copier (16 kHz 4ch)
#     -> micsel (4ch -> 1ch mono with 0.25 coefficients)
#     -> eqiir (1ch 16 kHz highpass)
#     -> KPB (16 kHz mono, dual sinks)
#          pin 0 -> micsel (1ch -> 2ch dual-mono) -> MFCC (PCAN 40 mel 10ms compress)
#                   -> MWW keyword spotter -> host-copier: "DMIC MWW Detect" PCM
#          pin 1 -> host-copier: "DMIC16k" PCM (DMIC1 PCM 11, 1ch mono)
#
# KPB output_pin_binding names match kernel widget names (see
# sof_ipc4_get_queue_id): host-copier.<pcm_id>.<direction> and
# <widget>.<index>.<queue>.

Define {
	DMIC_MWW_WOV_PIPELINE_ID	102
	DMIC_MWW_WOV_PCM_ID		102
	DMIC_MWW_WOV_PCM_NAME		"DMIC WoV Capture"
	DMIC_MWW_WOV_STREAM_NAME	"DMIC WoV Capture Stream"
	DMIC_MWW_DETECT_PIPELINE_ID	103
	DMIC_MWW_DETECT_PCM_ID		103
	DMIC_MWW_DETECT_PCM_NAME	"DMIC MWW Detect"
	DMIC_MWW_DETECT_STREAM_NAME	"DMIC MWW Detect Stream"
}

Object.Pipeline.dai-copier-micsel-eqiir-kpb-be [
	{
		index $DMIC1_DAI_PIPELINE_ID

		Object.Widget.dai-copier.1 {
			dai_index 1
			stream_name $DMIC1_NAME
		}

		Object.Widget.micsel.1 {
			Object.Control {
				bytes."1" {
					name "$DMIC_MWW_WOV_PCM_NAME Micsel bytes"
					<include/components/micsel/downmix_4ch_to_mono.conf>
				}
			}
		}

		Object.Widget.eqiir.1 {
			Object.Control {
				bytes."1" {
					name "$DMIC_MWW_WOV_PCM_NAME Capture IIR Eq"
					<include/components/eqiir/highpass_100hz_20db_16khz.conf>
				}
			}
		}

		Object.Widget.kpb.1 {
			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "micsel.$DMIC_MWW_DETECT_PIPELINE_ID.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "host-copier.$DMIC_MWW_WOV_PCM_ID.capture"
			}
		}
	}
]

Object.Pipeline.host-gateway-capture [
	{
		index $DMIC_MWW_WOV_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name "$DMIC_MWW_WOV_STREAM_NAME"
			pcm_id $DMIC_MWW_WOV_PCM_ID
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		1
					in_rate 		16000
					in_bit_depth 		32
					in_valid_bit_depth 	32
					in_ch_cfg 		$CHANNEL_CONFIG_MONO
					in_ch_map 		$CHANNEL_MAP_MONO
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		1
					out_rate 		16000
					out_bit_depth 		32
					out_valid_bit_depth 	32
					out_ch_cfg 		$CHANNEL_CONFIG_MONO
					out_ch_map 		$CHANNEL_MAP_MONO
				}
			]
		}
	}
]

Object.Pipeline.host-gateway-micsel-mfcc-mww-capture [
	{
		index $DMIC_MWW_DETECT_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name "$DMIC_MWW_DETECT_STREAM_NAME"
			pcm_id $DMIC_MWW_DETECT_PCM_ID
		}

		Object.Widget.micsel.1 {
			Object.Control {
				bytes."1" {
					name "$DMIC_MWW_DETECT_PCM_NAME Micsel bytes"
					<include/components/micsel/upmix_mono_to_stereo.conf>
				}
			}
		}

		Object.Widget.mfcc.1 {
			Object.Control {
				bytes."1" {
					name "$DMIC_MWW_DETECT_PCM_NAME MFCC bytes"
					IncludeByKey.MWW_PCAN {
						"true"	"include/components/mfcc/mel40_10ms_pcan_compress.conf"
						"false"	"include/components/mfcc/mel40_10ms_compress.conf"
					}
				}
				mixer."1" {
					name "$DMIC_MWW_DETECT_PCM_NAME MFCC switch"
				}
			}
		}

		Object.Widget.mww.1 {
			Object.Control {
				bytes."1" {
					name "$DMIC_MWW_DETECT_PCM_NAME MWW bytes"
					max 65536
				}
			}
		}
	}
]

Object.Base.route [
	{
		source "dai-copier.DMIC.$DMIC1_NAME.capture"
		sink "micsel.$DMIC1_DAI_PIPELINE_ID.1"
	}
	{
		source "micsel.$DMIC1_DAI_PIPELINE_ID.1"
		sink "eqiir.$DMIC1_DAI_PIPELINE_ID.1"
	}
	{
		source "eqiir.$DMIC1_DAI_PIPELINE_ID.1"
		sink "kpb.$DMIC1_DAI_PIPELINE_ID.1"
	}
	{
		source "kpb.$DMIC1_DAI_PIPELINE_ID.1"
		sink "host-copier.$DMIC_MWW_WOV_PCM_ID.capture"
	}
	{
		source "kpb.$DMIC1_DAI_PIPELINE_ID.1"
		sink "micsel.$DMIC_MWW_DETECT_PIPELINE_ID.1"
	}
]

Object.PCM.pcm [
	{
		name "$DMIC_MWW_WOV_PCM_NAME"
		id $DMIC_MWW_WOV_PCM_ID
		direction "capture"

		Object.Base.fe_dai.1 {
			name "$DMIC_MWW_WOV_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name "$DMIC_MWW_WOV_STREAM_NAME"
			formats 'S32_LE'
			rates '16000'
			channels_min 1
			channels_max 1
		}
	}
	{
		name "$DMIC_MWW_DETECT_PCM_NAME"
		id $DMIC_MWW_DETECT_PCM_ID
		direction "capture"

		Object.Base.fe_dai.1 {
			name "$DMIC_MWW_DETECT_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name "$DMIC_MWW_DETECT_STREAM_NAME"
			formats 'S32_LE'
			rates '16000'
			channels_min 2
			channels_max 2
		}
	}
]
