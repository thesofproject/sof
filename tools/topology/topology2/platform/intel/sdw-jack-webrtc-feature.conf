<include/common/input_pin_binding.conf>
<include/components/webrtc-hpf.conf>
<include/components/webrtc-vad.conf>
<include/components/webrtc-ns.conf>
<include/components/webrtc-agc.conf>
<include/components/webrtc-ns2.conf>
<include/components/webrtc-aec.conf>

Define {
	SDW_JACK_MODULE_COPIER_ID 11
	SDW_JACK_REF_COPIER "module-copier.1.12"
	SDW_JACK_WEBRTC_CAPTURE_PCM_NAME "Jack In WebRTC"
	SDW_JACK_WEBRTC_CAPTURE_PCM_ID 45
	SDW_JACK_WEBRTC_CAPTURE_STREAM_NAME "Jack In WebRTC Stream"
	SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID 133
}

IncludeByKey.SDW_JACK_WEBRTC_CAPTURE {
	"^ns$" {
		Object.Pipeline.host-gateway-capture [
			{
				index $SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID

				Object.Widget.host-copier.1 {
					stream_name "$SDW_JACK_WEBRTC_CAPTURE_STREAM_NAME"
					pcm_id $SDW_JACK_WEBRTC_CAPTURE_PCM_ID
					num_input_audio_formats 1
					num_output_audio_formats 1
					Object.Base.input_audio_format [
						{
							in_rate			16000
							in_bit_depth		16
							in_valid_bit_depth	16
						}
					]
					Object.Base.output_audio_format [
						{
							out_rate		16000
							out_bit_depth		16
							out_valid_bit_depth	16
						}
					]
				}
			}
		]

		Object.Widget {
			src."1" {
				index $SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID
				rate_in 48000
				rate_out 16000
				num_input_audio_formats 1
				num_output_audio_formats 1
				Object.Base.input_audio_format [
					{
						in_rate			48000
						in_bit_depth		32
						in_valid_bit_depth	32
					}
				]
				Object.Base.output_audio_format [
					{
						out_rate		16000
						out_bit_depth		16
						out_valid_bit_depth	16
					}
				]
			}
			webrtc-hpf."1" {
				index $SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID
				Object.Control.mixer."1" {
					name 'Jack In WebRTC HPF Switch'
				}
			}
			webrtc-vad."1" {
				index $SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID
			}
			webrtc-ns."1" {
				index $SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID
			}
			webrtc-agc."1" {
				index $SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID
				Object.Control.mixer."1" {
					name 'Jack In WebRTC AGC Switch'
				}
			}
		}

		Object.Base.route [
			{
				source "module-copier.$SDW_JACK_MODULE_COPIER_ID.0"
				sink "src.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
			}
			{
				source "src.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
				sink "webrtc-hpf.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
			}
			{
				source "webrtc-hpf.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
				sink "webrtc-vad.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
			}
			{
				source "webrtc-vad.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
				sink "webrtc-ns.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
			}
			{
				source "webrtc-ns.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
				sink "webrtc-agc.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
			}
			{
				source "webrtc-agc.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
				sink "host-copier.$SDW_JACK_WEBRTC_CAPTURE_PCM_ID.capture"
			}
		]

		Object.PCM.pcm [
			{
				name "$SDW_JACK_WEBRTC_CAPTURE_PCM_NAME"
				id $SDW_JACK_WEBRTC_CAPTURE_PCM_ID
				direction "capture"
				Object.Base.fe_dai.1 {
					name "$SDW_JACK_WEBRTC_CAPTURE_PCM_NAME"
				}

				Object.PCM.pcm_caps.1 {
					name "$SDW_JACK_WEBRTC_CAPTURE_STREAM_NAME"
					formats 'S16_LE'
					rates '16000'
					channels_min 2
					channels_max 2
				}
			}
		]
	}
	"^ns2$" {
		Object.Pipeline.host-gateway-capture [
			{
				index $SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID

				Object.Widget.host-copier.1 {
					stream_name "$SDW_JACK_WEBRTC_CAPTURE_STREAM_NAME"
					pcm_id $SDW_JACK_WEBRTC_CAPTURE_PCM_ID
					num_input_audio_formats 1
					num_output_audio_formats 1
					Object.Base.input_audio_format [
						{
							in_rate			48000
							in_bit_depth		32
							in_valid_bit_depth	32
						}
					]
					Object.Base.output_audio_format [
						{
							out_rate		48000
							out_bit_depth		32
							out_valid_bit_depth	32
						}
					]
				}
			}
		]

		Object.Widget {
			webrtc-ns2."1" {
				index $SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID
			}
		}

		Object.Base.route [
			{
				source "module-copier.$SDW_JACK_MODULE_COPIER_ID.0"
				sink "webrtc-ns2.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
			}
			{
				source "webrtc-ns2.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
				sink "host-copier.$SDW_JACK_WEBRTC_CAPTURE_PCM_ID.capture"
			}
		]

		Object.PCM.pcm [
			{
				name "$SDW_JACK_WEBRTC_CAPTURE_PCM_NAME"
				id $SDW_JACK_WEBRTC_CAPTURE_PCM_ID
				direction "capture"
				Object.Base.fe_dai.1 {
					name "$SDW_JACK_WEBRTC_CAPTURE_PCM_NAME"
				}

				Object.PCM.pcm_caps.1 {
					name "$SDW_JACK_WEBRTC_CAPTURE_STREAM_NAME"
					formats 'S32_LE'
					rates '48000'
					channels_min 2
					channels_max 2
				}
			}
		]
	}
	"^aec$" {
		Object.Pipeline.host-gateway-capture [
			{
				index $SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID

				Object.Widget.host-copier.1 {
					stream_name "$SDW_JACK_WEBRTC_CAPTURE_STREAM_NAME"
					pcm_id $SDW_JACK_WEBRTC_CAPTURE_PCM_ID
					num_input_audio_formats 1
					num_output_audio_formats 1
					Object.Base.input_audio_format [
						{
							in_rate			48000
							in_bit_depth		32
							in_valid_bit_depth	32
						}
					]
					Object.Base.output_audio_format [
						{
							out_rate		48000
							out_bit_depth		32
							out_valid_bit_depth	32
						}
					]
				}
			}
		]

		Object.Widget.webrtc-aec [
			{
				index $SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID
				name "webrtc-aec.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
				num_input_pins 2
				num_input_audio_formats 2
				num_output_audio_formats 1

				Object.Base.input_audio_format [
					{
						input_pin_index		0
						in_rate			48000
						in_bit_depth		32
						in_valid_bit_depth	32
						ibs "$[(($in_channels * ($[($in_rate + 999)] / 1000)) * ($in_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
					}
					{
						input_pin_index		1
						in_rate			48000
						in_bit_depth		32
						in_valid_bit_depth	32
						ibs "$[(($in_channels * ($[($in_rate + 999)] / 1000)) * ($in_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
					}
				]

				Object.Base.output_audio_format [
					{
						out_rate		48000
						out_bit_depth		32
						out_valid_bit_depth	32
						obs "$[(($out_channels * ($[($out_rate + 999)] / 1000)) * ($out_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
					}
				]

				Object.Base.input_pin_binding.1 {
					input_pin_binding_name "module-copier.$SDW_JACK_MODULE_COPIER_ID.0"
				}
				Object.Base.input_pin_binding.2 {
					input_pin_binding_name $SDW_JACK_REF_COPIER
				}

				Object.Control {
					mixer."1" {
						name 'Jack In WebRTC AEC Switch'
					}
					mixer."2" {
						name 'Jack In WebRTC AEC Suppression Switch'
					}
				}
			}
		]

		Object.Base.route [
			{
				source "module-copier.$SDW_JACK_MODULE_COPIER_ID.0"
				sink "webrtc-aec.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
			}
			{
				source $SDW_JACK_REF_COPIER
				sink "webrtc-aec.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
			}
			{
				source "webrtc-aec.$SDW_JACK_WEBRTC_CAPTURE_PIPELINE_ID.1"
				sink "host-copier.$SDW_JACK_WEBRTC_CAPTURE_PCM_ID.capture"
			}
		]

		Object.PCM.pcm [
			{
				name "$SDW_JACK_WEBRTC_CAPTURE_PCM_NAME"
				id $SDW_JACK_WEBRTC_CAPTURE_PCM_ID
				direction "capture"
				Object.Base.fe_dai.1 {
					name "$SDW_JACK_WEBRTC_CAPTURE_PCM_NAME"
				}

				Object.PCM.pcm_caps.1 {
					name "$SDW_JACK_WEBRTC_CAPTURE_STREAM_NAME"
					formats 'S32_LE'
					rates '48000'
					channels_min 2
					channels_max 2
				}
			}
		]
	}
}
