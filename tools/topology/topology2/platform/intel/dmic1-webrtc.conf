<include/components/webrtc-hpf.conf>
<include/components/webrtc-vad.conf>
<include/components/webrtc-ns.conf>
<include/components/webrtc-agc.conf>
<include/components/webrtc-ns2.conf>

Define {
	DMIC1_PCM_NAME		"DMIC WebRTC"
	WEBRTC_DMIC1_MODE	"ns"
}

Object.Pipeline.host-gateway-capture [
	{
		index		$DMIC1_HOST_PIPELINE_ID
		Object.Widget.host-copier.1 {
			stream_name $DMIC1_PCM_CAPS
			pcm_id $DMIC1_PCM_ID
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			$DMIC1_RATE
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		$DMIC1_RATE
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

Object.Pipeline.io-gateway-capture [
	{
		index		$DMIC1_DAI_PIPELINE_ID
		Object.Widget.dai-copier.1 {
			dai_index	1
			dai_type	"DMIC"
			copier_type	"DMIC"
			type		dai_out
			stream_name	$DMIC1_NAME
			node_type	$DMIC_LINK_INPUT_CLASS
			num_input_audio_formats 3
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			$DMIC1_RATE
					in_bit_depth		16
					in_valid_bit_depth	16
				}
				{
					in_rate			$DMIC1_RATE
					in_bit_depth		32
					in_valid_bit_depth	24
					in_sample_type		$SAMPLE_TYPE_MSB_INTEGER
				}
				{
					in_rate			$DMIC1_RATE
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		$DMIC1_RATE
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

IncludeByKey.WEBRTC_DMIC1_MODE {
	"^ns$" {
		Object.Widget {
			module-copier."2" {
				index $DMIC1_HOST_PIPELINE_ID
				num_input_audio_formats 1
				num_output_audio_formats 1
				Object.Base.input_audio_format [
					{
						in_rate			$DMIC1_RATE
						in_bit_depth		32
						in_valid_bit_depth	32
					}
				]
				Object.Base.output_audio_format [
					{
						out_rate		$DMIC1_RATE
						out_bit_depth		16
						out_valid_bit_depth	16
					}
				]
			}
			webrtc-hpf."1" {
				index $DMIC1_HOST_PIPELINE_ID
				Object.Control.mixer."1" {
					name 'DMIC1 Capture HPF Switch'
				}
			}
			webrtc-vad."1" {
				index $DMIC1_HOST_PIPELINE_ID
				num_input_audio_formats 4
				num_output_audio_formats 4
				Object.Base.input_audio_format [
					{
						in_rate			$DMIC1_RATE
						in_bit_depth		16
						in_valid_bit_depth	16
					}
					{
						in_rate			$DMIC1_RATE
						in_bit_depth		32
						in_valid_bit_depth	32
					}
					{
						in_rate			$DMIC1_RATE
						in_bit_depth		16
						in_valid_bit_depth	16
						in_channels		1
						in_ch_cfg		$CHANNEL_CONFIG_MONO
						in_ch_map		$CHANNEL_MAP_MONO
					}
					{
						in_rate			$DMIC1_RATE
						in_bit_depth		32
						in_valid_bit_depth	32
						in_channels		1
						in_ch_cfg		$CHANNEL_CONFIG_MONO
						in_ch_map		$CHANNEL_MAP_MONO
					}
				]
				Object.Base.output_audio_format [
					{
						out_rate		$DMIC1_RATE
						out_bit_depth		16
						out_valid_bit_depth	16
					}
					{
						out_rate		$DMIC1_RATE
						out_bit_depth		32
						out_valid_bit_depth	32
					}
					{
						out_rate		$DMIC1_RATE
						out_bit_depth		16
						out_valid_bit_depth	16
						out_channels		1
						out_ch_cfg		$CHANNEL_CONFIG_MONO
						out_ch_map		$CHANNEL_MAP_MONO
					}
					{
						out_rate		$DMIC1_RATE
						out_bit_depth		32
						out_valid_bit_depth	32
						out_channels		1
						out_ch_cfg		$CHANNEL_CONFIG_MONO
						out_ch_map		$CHANNEL_MAP_MONO
					}
				]
			}
			webrtc-ns."1" {
				index $DMIC1_HOST_PIPELINE_ID
			}
			webrtc-agc."1" {
				index $DMIC1_HOST_PIPELINE_ID
				Object.Control.mixer."1" {
					name 'DMIC1 Capture AGC Switch'
				}
			}
			module-copier."3" {
				index $DMIC1_HOST_PIPELINE_ID
				num_input_audio_formats 1
				num_output_audio_formats 1
				Object.Base.input_audio_format [
					{
						in_rate			$DMIC1_RATE
						in_bit_depth		16
						in_valid_bit_depth	16
					}
				]
				Object.Base.output_audio_format [
					{
						out_rate		$DMIC1_RATE
						out_bit_depth		32
						out_valid_bit_depth	32
					}
				]
			}
		}

		Object.Base.route [
			{
				source "dai-copier.DMIC.$DMIC1_NAME.capture"
				sink "module-copier.$DMIC1_HOST_PIPELINE_ID.2"
			}
			{
				source "module-copier.$DMIC1_HOST_PIPELINE_ID.2"
				sink "webrtc-hpf.$DMIC1_HOST_PIPELINE_ID.1"
			}
			{
				source "webrtc-hpf.$DMIC1_HOST_PIPELINE_ID.1"
				sink "webrtc-vad.$DMIC1_HOST_PIPELINE_ID.1"
			}
			{
				source "webrtc-vad.$DMIC1_HOST_PIPELINE_ID.1"
				sink "webrtc-ns.$DMIC1_HOST_PIPELINE_ID.1"
			}
			{
				source "webrtc-ns.$DMIC1_HOST_PIPELINE_ID.1"
				sink "webrtc-agc.$DMIC1_HOST_PIPELINE_ID.1"
			}
			{
				source "webrtc-agc.$DMIC1_HOST_PIPELINE_ID.1"
				sink "module-copier.$DMIC1_HOST_PIPELINE_ID.3"
			}
			{
				source "module-copier.$DMIC1_HOST_PIPELINE_ID.3"
				sink "host-copier.$DMIC1_PCM_ID.capture"
			}
		]
	}
	"^ns2$" {
		Object.Widget {
			webrtc-ns2."1" {
				index $DMIC1_HOST_PIPELINE_ID
			}
		}

		Object.Base.route [
			{
				source "dai-copier.DMIC.$DMIC1_NAME.capture"
				sink "webrtc-ns2.$DMIC1_HOST_PIPELINE_ID.1"
			}
			{
				source "webrtc-ns2.$DMIC1_HOST_PIPELINE_ID.1"
				sink "host-copier.$DMIC1_PCM_ID.capture"
			}
		]
	}
}

Object.PCM.pcm [
	{
		name		"$DMIC1_PCM_NAME"
		id		$DMIC1_PCM_ID
		direction	"capture"
		Object.Base.fe_dai.1 {
			name "$DMIC1_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name $DMIC1_PCM_CAPS
			formats 'S32_LE'
			channels_min 2
			channels_max 2
			rate_min $DMIC1_RATE
			rate_max $DMIC1_RATE
		}
	}
]
