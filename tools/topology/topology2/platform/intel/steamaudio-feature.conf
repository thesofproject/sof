# Steam Audio Feature Platform Configuration
#

Define {
	STEAMAUDIO_PCM_NAME "SteamAudio Spatial Playback"
	STEAMAUDIO_STREAM_NAME "SteamAudio Spatial Stream"
	STEAMAUDIO_PCM_ID 60
	STEAMAUDIO_PIPELINE_ID 160

	STEAMAUDIO_COMPR_PCM_NAME "SteamAudio Metadata"
	STEAMAUDIO_COMPR_STREAM_NAME "SteamAudio Metadata Stream"
	STEAMAUDIO_COMPR_PCM_ID 61
	STEAMAUDIO_COMPR_PIPELINE_ID 161

	STEAMAUDIO_SINK_MIXOUT "mixout.1.1"
}

Object.Pipeline {
	steamaudio-playback [
		{
			index $STEAMAUDIO_PIPELINE_ID

			Object.Widget.host-copier.1 {
				stream_name "$STEAMAUDIO_STREAM_NAME"
				pcm_id $STEAMAUDIO_PCM_ID
			}
		}
	]

	host-gateway-playback [
		{
			index $STEAMAUDIO_COMPR_PIPELINE_ID

			Object.Widget.host-copier.1 {
				stream_name "$STEAMAUDIO_COMPR_STREAM_NAME"
				pcm_id $STEAMAUDIO_COMPR_PCM_ID
			}
		}
	]
}

Object.PCM.pcm [
	{
		name "$STEAMAUDIO_PCM_NAME"
		id $STEAMAUDIO_PCM_ID
		direction "playback"
		Object.Base.fe_dai.1 {
			name "$STEAMAUDIO_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name "$STEAMAUDIO_STREAM_NAME"
			formats 'S16_LE,S24_LE,S32_LE'
			rates '48000'
			channels_min 2
			channels_max 64
		}
	}
	{
		name "$STEAMAUDIO_COMPR_PCM_NAME"
		id $STEAMAUDIO_COMPR_PCM_ID
		direction "playback"
		compress "true"
		Object.Base.fe_dai.1 {
			name "$STEAMAUDIO_COMPR_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name "$STEAMAUDIO_COMPR_STREAM_NAME"
			formats 'S32_LE'
			rates '48000'
			channels_min 1
			channels_max 2
		}
	}
]

Object.Base.route [
	{
		source "host-copier.$STEAMAUDIO_PCM_ID.playback"
		sink "steamaudio.$STEAMAUDIO_PIPELINE_ID.1"
	}
	{
		source "host-copier.$STEAMAUDIO_COMPR_PCM_ID.playback"
		sink "steamaudio.$STEAMAUDIO_PIPELINE_ID.1"
	}
	{
		source "mixin.$STEAMAUDIO_PIPELINE_ID.1"
		sink "$STEAMAUDIO_SINK_MIXOUT"
	}
]
