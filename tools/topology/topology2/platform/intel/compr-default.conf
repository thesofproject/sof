# default settings for Compressed Audio Playback
Define {
	COMPRESSED		false
	COMPR_DEEPBUFFER_MS	100 # 100 ms copier dma size

	COMPRESSED_1		true
	COMPR_PCM_NAME		'Compress Playback'
	COMPR_PCM_ID		50
	COMPR_PIPELINE_ID	90

	# Core for the compress decoder (DP) widget (Cadence or FFmpeg). The
	# decoder is offloaded to core 1, while the host-copier and the rest of
	# the compress pipeline run on the pipeline core (0). This makes the
	# bind between them a cross-core bind, which requires
	# CONFIG_CROSS_CORE_STREAM in firmware. Set to 0 for firmware without
	# cross-core stream support.
	COMPR_DECODER_CORE_ID	1

	# When true, the compress PCM is driven by the FFmpeg (libavcodec)
	# decoder widget (ffmpeg_dec) instead of the Cadence decoder. Enable
	# instead of COMPRESSED_1 (they share the COMPR_* pcm/pipeline defines).
	COMPR_FFMPEG		false
	COMPR_FFMPEG_DEC_STACK	65536
	# Modular heap requirement (mod_alloc): up to 192 KiB DP output ring +
	# 64 KiB PCM staging buffer + 4 KiB input bounce buffer + 4 KiB
	# extradata + 32 KiB packet scratch + FLAC/MP3/Opus decoder working set
	# fit within 512 KiB; AAC-LC requires 880 KiB (av_tx float MDCT tables
	# ~541 KiB).
	COMPR_FFMPEG_DEC_HEAP	524288

	# When true, adds a compress *capture* PCM driven by the FFmpeg encoder
	# (ffmpeg_enc, PCM -> MP3 via libshine or AAC-LC via vo-aacenc).
	# Independent of the decode COMPR_FFMPEG path above; uses its own
	# pcm/pipeline ids so both may be built into one topology. The
	# platform-specific capture-BE tap source (COMPR_ENC_SOURCE) and the
	# HDA-specific PCM name are set where the BE is defined
	# (cavs-mixin-mixout-hda.conf).
	COMPR_FFMPEG_ENC	false
	COMPR_ENC_PCM_NAME	'Compress Capture'
	COMPR_ENC_PCM_ID	51
	COMPR_ENC_PIPELINE_ID	91
	# LL mixout that taps the capture-BE mixin fan-out and feeds the DP
	# encoder pipeline (COMPR_ENC_PIPELINE_ID) across a pipeline boundary.
	COMPR_ENC_MIXOUT_PIPELINE_ID	93
	COMPR_ENCODER_CORE_ID	0
	COMPR_FFMPEG_ENC_STACK	65536
	# Modular heap requirement (mod_alloc): 48 KiB DP output ring (3x 16 KiB) +
	# 48 KiB LL->DP input ring (3x 16 KiB) + 80 KiB FFmpeg libshine packet buffer +
	# ~32 KiB staging (pcm_in, out_stage, pcm_s16 / AVFrame) + ~48 KiB libshine /
	# vo-aacenc state + AVCodecContext/AVPacket/AVFrame and allocator overhead
	# fits within 384 KiB.
	COMPR_FFMPEG_ENC_HEAP	393216


	COMPRESSED_2		false
	COMPR_2_PCM_NAME	'Compress Playback 2'
	COMPR_2_PCM_ID		52
	COMPR_2_PIPELINE_ID	92
}
