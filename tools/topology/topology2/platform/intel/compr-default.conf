# default settings for Compressed Audio Playback
Define {
	COMPRESSED		false
	COMPR_DEEPBUFFER_MS	100 # 100 ms copier dma size

	COMPRESSED_1		true
	COMPR_PCM_NAME		'Compress Playback'
	COMPR_PCM_ID		50
	COMPR_PIPELINE_ID	90

	# Core for the Cadence decoder (DP) widget. The decoder is offloaded
	# to core 1, while the host-copier and the rest of the compress
	# pipeline run on the pipeline core (0). This makes the bind between
	# them a cross-core bind, which requires CONFIG_CROSS_CORE_STREAM in
	# firmware. Set to 0 for firmware without cross-core stream support.
	COMPR_DECODER_CORE_ID	1

	# When true, the compress PCM is driven by the FFmpeg (libavcodec)
	# decoder widget (ffmpeg_dec) instead of the Cadence decoder. Enable
	# instead of COMPRESSED_1 (they share the COMPR_* pcm/pipeline defines).
	COMPR_FFMPEG		false
	COMPR_FFMPEG_DEC_STACK	65536
	# Modular LLEXT heap requirement (mod_alloc): FLAC/MP3/Opus fit within
	# 48-64 KiB; AAC-LC requires 880 KiB (av_tx float MDCT tables ~541 KiB).
	COMPR_FFMPEG_DEC_HEAP	49152


	COMPRESSED_2		false
	COMPR_2_PCM_NAME	'Compress Playback 2'
	COMPR_2_PCM_ID		52
	COMPR_2_PIPELINE_ID	92
}
