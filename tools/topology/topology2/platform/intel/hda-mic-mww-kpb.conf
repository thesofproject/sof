# SPDX-License-Identifier: BSD-3-Clause
#
# HDA analog capture microWakeWord (MWW)/KPB Wake-on-Voice branch.
#
# Layered on top of sof-hda-generic.conf via
# IncludeByKey.HDA_MIC_MWW_KPB_CAPTURE. Taps the Analog Capture DAI
# endpoint (module-copier.4.2) into:
#
#   SRC (48 -> 16 kHz stereo) -> KPB (16 kHz stereo, dual sinks)
#     pin 0 -> micsel -> MFCC (40 mel 10ms compress) -> MWW keyword spotter
#              -> host-copier: "HDA Mic MWW Detect" PCM
#     pin 1 -> host-copier: "HDA Mic WoV Capture"  PCM
#
# KPB is used in a Linux-compatible configuration (ibs == obs, no
# micselector mode); the topology-side micsel widget performs channel
# reduction on the detection path. The MWW Detect PCM is exposed as
# stereo double-mono to work around HDA capture's mono restriction.
#
# KPB output_pin_binding names must match kernel widget names (see
# sof_ipc4_get_queue_id): host-copier.<pcm_id>.<direction> and
# <widget>.<index>.<queue>.

Define {
	HDA_MWW_KPB_PIPELINE_ID		102
	HDA_MWW_WOV_PIPELINE_ID		100
	HDA_MWW_WOV_PCM_ID		100
	HDA_MWW_DETECT_PIPELINE_ID	101
	HDA_MWW_DETECT_PCM_ID		101
}

Object.Pipeline.src-kpb-be [
	{
		index $HDA_MWW_KPB_PIPELINE_ID

		# KPB requires pin 0 (binding.1) to feed the detect/selector sink
		# and pin 1+ (binding.2) to feed the host drain; see kpb_bind().
		Object.Widget.kpb.1 {
			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "micsel.$HDA_MWW_DETECT_PIPELINE_ID.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "host-copier.$HDA_MWW_WOV_PCM_ID.capture"
			}
		}
	}
]

Object.Pipeline.host-gateway-capture [
	{
		index $HDA_MWW_WOV_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name "HDA Mic WoV Capture"
			pcm_id $HDA_MWW_WOV_PCM_ID
			capture_compatible_d0i3 1
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels 		2
					in_rate 		16000
					in_bit_depth 		32
					in_valid_bit_depth 	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels 		2
					out_rate 		16000
					out_bit_depth 		32
					out_valid_bit_depth 	32
				}
			]
		}
	}
]

Object.Pipeline.host-gateway-micsel-mfcc-mww-capture [
	{
		index $HDA_MWW_DETECT_PIPELINE_ID
		core 1
		core_id 1

		Object.Widget.pipeline.1 {
			core 1
		}

		Object.Widget.host-copier.1 {
			stream_name "HDA Mic MWW Detect"
			pcm_id $HDA_MWW_DETECT_PCM_ID
			capture_compatible_d0i3 1
		}

		Object.Widget.micsel.1 {
			Object.Control {
				bytes."1" {
					name "HDA Mic MWW Micsel bytes"
					<include/components/micsel/downmix_stereo_to_doublemono.conf>
				}
			}
		}

		Object.Widget.mfcc.1 {
			Object.Control {
				bytes."1" {
					name "HDA Mic MWW MFCC bytes"
					<include/components/mfcc/mel40_10ms_compress.conf>
				}
				mixer."1" {
					name "HDA Mic MWW MFCC VAD"
				}
			}
		}

		Object.Widget.mww.1 {
			Object.Control {
				bytes."1" {
					name "HDA Mic MWW bytes"
					max 65536
				}
			}
		}
	}
]

Object.Base.route [
	{
		source "module-copier.4.2"
		sink "src.$HDA_MWW_KPB_PIPELINE_ID.1"
	}
	{
		source "kpb.$HDA_MWW_KPB_PIPELINE_ID.1"
		sink "host-copier.$HDA_MWW_WOV_PCM_ID.capture"
	}
	{
		source "kpb.$HDA_MWW_KPB_PIPELINE_ID.1"
		sink "micsel.$HDA_MWW_DETECT_PIPELINE_ID.1"
	}
]

Object.PCM.pcm [
	{
		name "HDA Mic WoV Capture"
		id $HDA_MWW_WOV_PCM_ID
		direction "capture"

		Object.Base.fe_dai.1 {
			name "HDA Mic WoV Capture"
		}

		Object.PCM.pcm_caps.1 {
			name "HDA Mic WoV Capture"
			formats 'S32_LE'
			rates '16000'
			channels_min 2
			channels_max 2
		}
	}
	{
		name "HDA Mic MWW Detect"
		id $HDA_MWW_DETECT_PCM_ID
		direction "capture"

		Object.Base.fe_dai.1 {
			name "HDA Mic MWW Detect"
		}

		Object.PCM.pcm_caps.1 {
			name "HDA Mic MWW Detect"
			formats 'S32_LE'
			rates '16000'
			channels_min 2
			channels_max 2
		}
	}
]
