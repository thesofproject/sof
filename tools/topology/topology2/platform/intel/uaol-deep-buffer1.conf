# Deep buffer playback of the second UAOL stream pair.
#
# Included by platform/intel/uaol-stream1.conf under the same conditions as the
# first pair's deep buffer, platform/intel/uaol-deep-buffer.conf, which this
# repeats on the UAOL_DB1_* variables.

Object.Pipeline.deepbuffer-playback [
	{
		index $UAOL_DB1_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name $UAOL_DB1_PCM_NAME
			pcm_id $UAOL_DB1_PCM_ID
		}
		Object.Widget.gain.1 {
			Object.Control.mixer.1 {
				name 'Pre Mixer $UAOL_DB1_PCM_NAME Volume'
			}
		}
	}
]

Object.PCM.pcm [
	{
		name $UAOL_DB1_PCM_NAME
		id $UAOL_DB1_PCM_ID
		direction playback
		playback_compatible_d0i3 $DEEPBUFFER_D0I3_COMPATIBLE

		Object.Base.fe_dai.1 {
			name "$UAOL_DB1_PCM_NAME"
		}
		Object.PCM.pcm_caps.1 {
			name $UAOL_DB1_PCM_NAME
			formats 'S16_LE,S24_LE,S32_LE'
			# To avoid DMA spinning on a buffer we need bigger
			# buffer than the host buffer size, let's say twice as
			# big
			# (S16_LE, Stereo, 48KHz, DEEPBUFFER_FW_DMA_MS) * 2
			#
			# Note: The lower limit for the buffer size is rate
			#       dependent
			buffer_size_min "$[(((2 * $channels_min) * 48) * $DEEPBUFFER_FW_DMA_MS) * 2]"
		}
	}
]

Object.Base.route [
	{
		source	mixin.$UAOL_DB1_PIPELINE_ID.1
		sink	mixout.$UAOL_PB1_DAI_PIPELINE_ID.1
	}
	{
		source	host-copier.$UAOL_DB1_PCM_ID.playback
		sink	gain.$UAOL_DB1_PIPELINE_ID.1
	}
]
