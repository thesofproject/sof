# SPDX-License-Identifier: BSD-3-Clause
#
# SoundWire jack TFLM/KPB Wake-on-Voice capture branch.
#
# Layered on top of cavs-sdw.conf (SDW jack + amps + HDMI) via
# IncludeByKey.SDW_JACK_TFLM_KPB_CAPTURE. Taps the jack DAI-side
# module-copier (module-copier.11.0) into:
#
#   SRC (48 -> 16 kHz stereo) -> KPB (16 kHz stereo, dual sinks)
#     pin 0 -> micsel -> MFCC (40 mel compress) -> TFLM classifier
#              -> host-copier: "Jack In TFLM Detect" PCM
#     pin 1 -> host-copier: "Jack In WoV Capture"  PCM
#
# KPB output_pin_binding names must match kernel widget names (see
# sof_ipc4_get_queue_id): host-copier.<pcm_id>.<direction> and
# <widget>.<index>.<queue>. Detect PCM is stereo double-mono via
# micsel to remain compatible with HDA-style capture pipelines.

Define {
	SDW_JACK_MODULE_COPIER_ID	11
	SDW_JACK_TFLM_KPB_PIPELINE_ID	134
	# host-copier internal routes in host-gateway* pipeline classes
	# reference host-copier.$index.<direction>, so keep
	# pcm_id == pipeline_id for the two host-side PCMs.
	SDW_JACK_TFLM_WOV_PIPELINE_ID	55
	SDW_JACK_TFLM_WOV_PCM_ID	55
	SDW_JACK_TFLM_WOV_PCM_NAME	"Jack In WoV Capture"
	SDW_JACK_TFLM_WOV_STREAM_NAME	"Jack In WoV Capture Stream"
	SDW_JACK_TFLM_DETECT_PIPELINE_ID 56
	SDW_JACK_TFLM_DETECT_PCM_ID	56
	SDW_JACK_TFLM_DETECT_PCM_NAME	"Jack In TFLM Detect"
	SDW_JACK_TFLM_DETECT_STREAM_NAME "Jack In TFLM Detect Stream"
}

Object.Pipeline.src-kpb-be [
	{
		index $SDW_JACK_TFLM_KPB_PIPELINE_ID

		Object.Widget.kpb.1 {
			Object.Base.output_pin_binding.1 {
				output_pin_binding_name "micsel.$SDW_JACK_TFLM_DETECT_PIPELINE_ID.1"
			}
			Object.Base.output_pin_binding.2 {
				output_pin_binding_name "host-copier.$SDW_JACK_TFLM_WOV_PCM_ID.capture"
			}
		}
	}
]

Object.Pipeline.host-gateway-capture [
	{
		index $SDW_JACK_TFLM_WOV_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name "$SDW_JACK_TFLM_WOV_STREAM_NAME"
			pcm_id $SDW_JACK_TFLM_WOV_PCM_ID
			num_input_audio_formats 1
			num_output_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_channels		2
					in_rate			16000
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_channels		2
					out_rate		16000
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

Object.Pipeline.host-gateway-micsel-mfcc-tflm-capture [
	{
		index $SDW_JACK_TFLM_DETECT_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name "$SDW_JACK_TFLM_DETECT_STREAM_NAME"
			pcm_id $SDW_JACK_TFLM_DETECT_PCM_ID
		}

		Object.Widget.micsel.1 {
			Object.Control {
				bytes."1" {
					name "$SDW_JACK_TFLM_DETECT_PCM_NAME Micsel bytes"
					<include/components/micsel/downmix_stereo_to_doublemono.conf>
				}
			}
		}

		Object.Widget.mfcc.1 {
			Object.Control {
				bytes."1" {
					name "$SDW_JACK_TFLM_DETECT_PCM_NAME MFCC bytes"
					<include/components/mfcc/mel40_compress.conf>
				}
				mixer."1" {
					name "$SDW_JACK_TFLM_DETECT_PCM_NAME MFCC VAD"
				}
			}
		}
	}
]

Object.Base.route [
	{
		source "module-copier.$SDW_JACK_MODULE_COPIER_ID.0"
		sink "src.$SDW_JACK_TFLM_KPB_PIPELINE_ID.1"
	}
	{
		source "kpb.$SDW_JACK_TFLM_KPB_PIPELINE_ID.1"
		sink "host-copier.$SDW_JACK_TFLM_WOV_PCM_ID.capture"
	}
	{
		source "kpb.$SDW_JACK_TFLM_KPB_PIPELINE_ID.1"
		sink "micsel.$SDW_JACK_TFLM_DETECT_PIPELINE_ID.1"
	}
]

Object.PCM.pcm [
	{
		name "$SDW_JACK_TFLM_WOV_PCM_NAME"
		id $SDW_JACK_TFLM_WOV_PCM_ID
		direction "capture"

		Object.Base.fe_dai.1 {
			name "$SDW_JACK_TFLM_WOV_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name "$SDW_JACK_TFLM_WOV_STREAM_NAME"
			formats 'S32_LE'
			rates '16000'
			channels_min 2
			channels_max 2
		}
	}
	{
		name "$SDW_JACK_TFLM_DETECT_PCM_NAME"
		id $SDW_JACK_TFLM_DETECT_PCM_ID
		direction "capture"

		Object.Base.fe_dai.1 {
			name "$SDW_JACK_TFLM_DETECT_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name "$SDW_JACK_TFLM_DETECT_STREAM_NAME"
			formats 'S32_LE'
			rates '16000'
			channels_min 2
			channels_max 2
		}
	}
]
