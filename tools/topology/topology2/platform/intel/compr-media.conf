#
# Media decode compress playback configuration with per-format module UUIDs.
# Used by media-decode-feature.conf (standalone feature topology) or included
# from platform topologies.
#

Define {
	COMPR_PIPELINE_SINK		"mixout.1.1"
	MEDIA_DECODE_CADENCE_UUID	"43:84:21:d8:f3:5f:4c:4a:b3:88:6c:fe:07:b9:56:aa"
	MEDIA_DECODE_FFMPEG_UUID	"73:af:07:12:c0:f9:65:4f:92:b4:9d:45:17:8f:c9:a8"
	SND_AUDIOCODEC_PCM		1
	SND_AUDIOCODEC_MP3		2
	SND_AUDIOCODEC_AAC		6
	SND_AUDIOCODEC_VORBIS		9
	SND_AUDIOCODEC_FLAC		10
	SND_AUDIOCODEC_BESPOKE		14
	SND_AUDIOCODEC_ALAC		15
	SND_AUDIOCODEC_OPUS_RAW		17
	SND_AUDIOCODEC_SBC		18
	SND_AUDIOCODEC_G722		19
	SND_AUDIOCODEC_APTX		20
}

Object.Pipeline.compr-playback-media [
	{
		index $COMPR_PIPELINE_ID

		Object.Widget.host-copier.1 {
			stream_name $COMPR_PCM_NAME
			pcm_id $COMPR_PCM_ID
			<include/formats/compr_input_audio_formats.conf>
			<include/formats/compr_output_audio_formats.conf>
		}

		Object.Widget.media_decoder.1 {
			core_id $COMPR_DECODER_CORE_ID
			stack_bytes_requirement $COMPR_FFMPEG_DEC_STACK
			heap_bytes_requirement $COMPR_FFMPEG_DEC_HEAP
			<include/formats/compr_input_audio_formats.conf>
			<include/formats/compr_output_audio_formats.conf>
			CombineArrays.Object.Base.media_format [
				{
					codec_id [ $SND_AUDIOCODEC_MP3 ]
					min_rate [ 8000 ]
					max_rate [ 48000 ]
					channels [ 1 2 ]
					bit_depth [ 16 24 32 ]
					module_uuid [
						$MEDIA_DECODE_FFMPEG_UUID
						$MEDIA_DECODE_CADENCE_UUID
					]
				}
				{
					codec_id [ $SND_AUDIOCODEC_AAC ]
					min_rate [ 8000 ]
					max_rate [ 96000 ]
					channels [ 1 2 6 8 ]
					bit_depth [ 16 24 32 ]
					module_uuid [
						$MEDIA_DECODE_CADENCE_UUID
						$MEDIA_DECODE_FFMPEG_UUID
					]
				}
				{
					codec_id [ $SND_AUDIOCODEC_FLAC ]
					min_rate [ 8000 ]
					max_rate [ 192000 ]
					channels [ 1 2 6 8 ]
					bit_depth [ 16 24 32 ]
					module_uuid [
						$MEDIA_DECODE_FFMPEG_UUID
					]
				}
				{
					codec_id [ $SND_AUDIOCODEC_ALAC ]
					min_rate [ 8000 ]
					max_rate [ 192000 ]
					channels [ 1 2 6 8 ]
					bit_depth [ 16 24 32 ]
					module_uuid [
						$MEDIA_DECODE_FFMPEG_UUID
					]
				}
				{
					codec_id [ $SND_AUDIOCODEC_VORBIS ]
					min_rate [ 8000 ]
					max_rate [ 192000 ]
					channels [ 1 2 ]
					bit_depth [ 16 24 32 ]
					module_uuid [
						$MEDIA_DECODE_CADENCE_UUID
					]
				}
				{
					codec_id [ $SND_AUDIOCODEC_OPUS_RAW ]
					min_rate [ 8000 ]
					max_rate [ 48000 ]
					channels [ 1 2 ]
					bit_depth [ 16 24 32 ]
					module_uuid [
						$MEDIA_DECODE_FFMPEG_UUID
					]
				}
				{
					codec_id [ $SND_AUDIOCODEC_PCM ]
					min_rate [ 8000 ]
					max_rate [ 192000 ]
					channels [ 1 2 ]
					bit_depth [ 16 24 32 ]
					module_uuid [
						$MEDIA_DECODE_CADENCE_UUID
					]
				}
			]
		}

		Object.Widget.module-copier.2 {
			<include/formats/compr_input_audio_formats.conf>
			<include/formats/compr_output_audio_formats_s32.conf>
		}

		Object.Widget.src.1 {
			rate_out 48000
			<include/formats/compr_input_output_formats_src_s32_to_48k.conf>
		}

		Object.Widget.micsel.1 {
			Object.Control.bytes."1" {
				name '$COMPR_PCM_NAME selector bytes'
				<include/components/micsel/stereo_endpoint_playback_updownmix.conf>
			}
			<include/formats/compr_input_audio_formats_s32_48k.conf>
			<include/formats/compr_output_audio_formats_s32_48k_stereo.conf>
		}

		Object.Widget.gain.1 {
			Object.Control.mixer.1 {
				name 'Pre Mixer $COMPR_PCM_NAME Volume'
			}
			num_input_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_rate		48000
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}

		Object.Widget.mixin.1 {
			Object.Base.input_audio_format [
				{
					in_rate			48000
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate		48000
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

Object.PCM.pcm [
	{
		name $COMPR_PCM_NAME
		id $COMPR_PCM_ID
		direction playback
		compress "true"

		Object.Base.fe_dai.1 {
			name "$COMPR_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			name $COMPR_PCM_NAME
			formats 'S32_LE'
			rates '8000'
		}
	}
]

Object.Base.route [
	{
		source	mixin.$COMPR_PIPELINE_ID.1
		sink	$COMPR_PIPELINE_SINK
	}
	{
		source	host-copier.$COMPR_PCM_ID.playback
		sink	media_decoder.$COMPR_PIPELINE_ID.1
	}
]
