Object.Base.manifest.1 {
	nhlt "true"
}

Define {
	DMIC_DRIVER_VERSION 5
	DMIC_WOV_DAI_INDEX  0
	DMIC_WOV_DAI_NAME   "dmic01"
	DMIC_WOV_DAI_ID     6
}

# Override defaults with platform-specific config
IncludeByKey.PLATFORM {
	"tgl"	"platform/intel/tgl.conf"
	"mtl"	"platform/intel/mtl.conf"
	"lnl"	"platform/intel/lnl.conf"
	"ptl"	"platform/intel/ptl.conf"
	"wcl"	"platform/intel/wcl.conf"
}

# PDM DMIC DAI for Wake-on-Voice feature topology
Object.Dai.DMIC [
	{
		name               $DMIC_WOV_DAI_NAME
		dai_index          $DMIC_WOV_DAI_INDEX
		id                 $DMIC_WOV_DAI_ID
		driver_version     $DMIC_DRIVER_VERSION
		io_clk             38400000
		sample_rate        16000
		clk_min            500000
		clk_max            4800000
		unmute_ramp_time_ms 200
		num_pdm_active     2

		Object.Base.hw_config.1 {
			id   0
			name "DMIC0"
		}

		Object.Base.pdm_config.1 {
			ctrl_id       0
			mic_a_enable  1
			mic_b_enable  1
		}
		Object.Base.pdm_config.2 {
			ctrl_id       1
			mic_a_enable  1
			mic_b_enable  1
		}
	}
]

# ---------------------------------------------------------------------------
# Virtual Widgets (required by HDA machine driver for DAPM)
# ---------------------------------------------------------------------------
Object.Widget.virtual [
	{ name "codec0_in"             type input   index 1 }
	{ name "codec1_in"             type input   index 2 }
	{ name "codec0_out"            type output  index 3 }
	{ name "codec1_out"            type output  index 4 }
	{ name "codec2_in"             type input   index 5 }
	{ name "codec2_out"            type output  index 6 }
	{ name "iDisp1_out"            type output  index 7 }
	{ name "iDisp2_out"            type output  index 8 }
	{ name "iDisp3_out"            type output  index 9 }
	{ name "iDisp3 Tx"             type out_drv index 0 }
	{ name "iDisp2 Tx"             type out_drv index 1 }
	{ name "iDisp1 Tx"             type out_drv index 2 }
	{ name "Analog CPU Playback"   type out_drv index 3 }
	{ name "Digital CPU Playback"  type out_drv index 4 }
	{ name "Alt Analog CPU Playback" type out_drv index 5 }
	{ name "Analog CPU Capture"    type input   index 6 }
	{ name "Digital CPU Capture"   type input   index 7 }
	{ name "Alt Analog CPU Capture" type input  index 8 }
]

# Dispatch based on INCLUDE_WOV: "true" for legacy single detector, "multi" for multi-slot WoV
IncludeByKey.INCLUDE_WOV {
	"true"	"platform/intel/dmic-wov.conf"
	"multi"	"platform/intel/dmic-wov-multi.conf"
}
