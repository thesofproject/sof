##
## IPC4 topology for i.MX95 (Cortex-M7) with WM8962 codec - playback only
##
## (source) host-copier.N.playback -> gain.N.1 -> dai-copier.SAI(sink endpoint)
##

# Include paths
<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/controls>
<searchdir:include/dais>
<searchdir:include/pipelines>

# Include class definitions
<vendor-token.conf>
<hw_config_imx.conf>
<tokens.conf>
<dai.conf>
<data.conf>
<pcm.conf>
<pcm_caps.conf>
<fe_dai.conf>
<sai.conf>
<manifest.conf>
<route.conf>
<pipeline.conf>
<gain-playback.conf>
<dai-copier.conf>
<host-copier.conf>
<dai-copier-io.conf>
<common_definitions.conf>

Define {
	HEADSET_PLAYBACK_PCM_STREAM_NAME	"Headset Playback"
	HEADSET_PCM_NAME			"Headset"
	HEADSET_PCM_ID				0
}

#
# Pipeline definitions
#
# (source) host.N.playback -> gain.N.1
#
Object.Pipeline {
	gain-playback [
		{
			index	1

			Object.Widget.host-copier.1 {
				stream_name	$HEADSET_PLAYBACK_PCM_STREAM_NAME
				pcm_id		$HEADSET_PCM_ID
			}

			Object.Widget.gain.1 {
				curve_type	"windows_fade"
				Object.Control.mixer.1 {
					name	'PGA Playback Volume'
				}
			}

			time_domain	"dma"
			format		"s32le"
			num_input_audio_formats		3
			num_output_audio_formats	1
		}
	]
}

#
# DAI pipeline - the dai-copier needs its own pipeline/scheduler
# (dai-copier-io-playback) so sof_complete() actually visits it and
# populates the widget's IPC struct. A bare Object.Widget.dai-copier has no
# pipeline_id and is silently skipped, leaving struct snd_sof_dai::private
# NULL (seen as "No private data found for DAI ..." at PCM hw_params time).
#
Object.Pipeline.dai-copier-io-playback [
	{
		index	2

		Object.Widget.dai-copier.1 {
			dai_index	$SAI_DAI_INDEX
			dai_type	"SAI"
			copier_type	"SAI"
			stream_name	$STREAM_CODEC_NAME
			node_type	$SAI_LINK_OUTPUT_CLASS
		}
	}
]

# BE DAI: hw_config makes the codec the BCLK/FSYNC provider (as in IPC3)
Object.Dai.SAI [
	{
		id		0
		dai_index	$SAI_DAI_INDEX
		direction	"playback"
		name		$STREAM_CODEC_NAME
		sample_bits	32

		Object.Base.hw_config.1 {
			name		"SAI3"
			id		0
			format		"I2S"
			mclk		"codec_mclk_in"
			mclk_freq	12288000
			bclk		"codec_provider"
			bclk_freq	3072000
			fsync		"codec_provider"
			fsync_freq	48000
			tdm_slots	2
			tdm_slot_width	32
			tx_slots	3
			rx_slots	3
		}
	}
]

# PCM Definitions
Object.PCM.pcm [
	{
		name		$HEADSET_PCM_NAME
		direction	"playback"
		id		$HEADSET_PCM_ID

		Object.Base.fe_dai.1 {
			name	"$HEADSET_PCM_NAME"
		}

		Object.PCM.pcm_caps.playback {
			name	$HEADSET_PLAYBACK_PCM_STREAM_NAME
			formats	'S32_LE,S24_LE,S16_LE'
		}
	}
]

# Top-level pipeline connection
# gain.1. -> dai.SAI.1.playback
Object.Base.route [
	{
		source	"host-copier.$HEADSET_PCM_ID.playback"
		sink	"gain.1.1"
	}
	{
		source	"gain.1.1"
		sink	"dai-copier.SAI.$STREAM_CODEC_NAME.playback"
	}
]
