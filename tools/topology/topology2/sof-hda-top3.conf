#
# Top 3 DSP offload topology for Sound Open Firmware (SOF)
#
# Chains the top 3 DSP processing modules in the HDA Analog playback pipeline:
#   host-copier.0.playback -> gain.1.1 -> webrtc-hpf.1.1 -> webrtc-agc.1.1 -> alimiter.1.1 -> mixin.1.1 -> mixout.2.1 -> dai-copier
#
# Modules:
# 1. webrtc_hpf (UUID: 6dfb1bea-d858-4ef7-92abcf5b4ee48159) - IIR High-Pass Filter (<80 Hz)
# 2. webrtc_agc (UUID: 0af7b529-9dc7-4bee-a8b159e8fbe414f3) - Digital Automatic Gain Control (+9 dB)
# 3. alimiter   (UUID: 1207af73-f9c0-4f65-92b49d45178fc9a8) - FFmpeg Lookahead Peak Limiter (0.950)
#

<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/dais>
<searchdir:include/pipelines>
<searchdir:include/pipelines/cavs>
<searchdir:platform>
<searchdir:platform/intel>

Define {
	HDA_CONFIG		"mix"
	TOP3_PROCESSING		"true"
}

<sof-hda-generic.conf>
