#
# Next 3 DSP offload topology for Sound Open Firmware (SOF)
#
# Chains the next 3 DSP processing modules in the HDA Analog playback pipeline:
#   host-copier.0.playback -> gain.1.1 -> equalizer.1.1 -> acompressor.1.1 -> stereowiden.1.1 -> mixin.1.1 -> mixout.2.1 -> dai-copier
#
# Modules:
# 1. equalizer   (UUID: c335390a-6ad4-4f48-b0a9807f6e5d4c32) - Parametric 3-band Biquad EQ
# 2. acompressor (UUID: d4464a1b-7be5-4059-c1ba91807f6e5d43) - Dynamic Range Compressor
# 3. stereowiden (UUID: b22428f9-59c3-4e37-af987f6e5d4c3b21) - Stereo Widener / Spatializer
#

<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/dais>
<searchdir:include/pipelines>
<searchdir:include/pipelines/cavs>
<searchdir:platform>
<searchdir:platform/intel>

Define {
	HDA_CONFIG		"mix"
	NEXT3_PROCESSING	"true"
}

<sof-hda-generic.conf>
