# ---------------------------------------------------------------------------
# Virtual Widgets
# ---------------------------------------------------------------------------
Object.Widget.virtual [
	{ name "virtual.wov0_sink"     type out_drv index 101 }
	{ name "virtual.wov1_sink"     type out_drv index 102 }
	{ name "virtual.wov2_sink"     type out_drv index 103 }
	{ name "codec0_in"             type input   index 1 }
	{ name "codec1_in"             type input   index 2 }
	{ name "codec0_out"            type output  index 3 }
	{ name "codec1_out"            type output  index 4 }
	{ name "codec2_in"             type input   index 5 }
	{ name "codec2_out"            type output  index 6 }
	{ name "iDisp1_out"            type output  index 7 }
	{ name "iDisp2_out"            type output  index 8 }
	{ name "iDisp3_out"            type output  index 9 }
	{ name "iDisp3 Tx"             type out_drv index 0 }
	{ name "iDisp2 Tx"             type out_drv index 1 }
	{ name "iDisp1 Tx"             type out_drv index 2 }
	{ name "Analog CPU Playback"   type out_drv index 3 }
	{ name "Digital CPU Playback"  type out_drv index 4 }
	{ name "Alt Analog CPU Playback" type out_drv index 5 }
	{ name "Analog CPU Capture"    type input   index 6 }
	{ name "Digital CPU Capture"   type input   index 7 }
	{ name "Alt Analog CPU Capture" type input  index 8 }
]

# ---------------------------------------------------------------------------
# Routes
# ---------------------------------------------------------------------------
Object.Base.route [
	{ source "dai-copier.DMIC.$DMIC_NAME.capture" sink "kpb.100.1" }
	{ source "kpb.100.1"                          sink "mixin.100.1" }

	{ source "mixin.100.1"                        sink "mixout.101.1" }
	{ source "mixout.101.1"                       sink "wov.101.1" }
	{ source "wov.101.1"                          sink "virtual.wov0_sink" }
	{ source "virtual.wov0_sink"                  sink "host-copier.$DMIC_PCM_ID.capture" }

	{ source "mixin.100.1"                        sink "mixout.102.1" }
	{ source "mixout.102.1"                       sink "wov.102.1" }
	{ source "wov.102.1"                          sink "virtual.wov1_sink" }
	{ source "virtual.wov1_sink"                  sink "host-copier.$DMIC_PCM_ID.capture" }

	{ source "mixin.100.1"                        sink "mixout.103.1" }
	{ source "mixout.103.1"                       sink "wov.103.1" }
	{ source "wov.103.1"                          sink "virtual.wov2_sink" }
	{ source "virtual.wov2_sink"                  sink "host-copier.$DMIC_PCM_ID.capture" }

	{ source "mixin.100.1"                        sink "mixout.104.1" }
	{ source "mixout.104.1"                       sink "wov-arbiter.104.1" }
	{ source "wov-arbiter.104.1"                  sink "host-copier.$DMIC_PCM_ID.capture" }
]

# ---------------------------------------------------------------------------
# DMIC DAI (16kHz Native 4-Channel)
# ---------------------------------------------------------------------------
Object.Dai.DMIC [
	{
		name               $DMIC_NAME
		dai_index          $DMIC_DAI_INDEX
		id                 6
		driver_version     $DMIC_DRIVER_VERSION
		io_clk             38400000
		sample_rate        16000
		clk_min            500000
		clk_max            4800000
		unmute_ramp_time_ms 200
		num_pdm_active     2

		Object.Base.hw_config.1 {
			id   0
			name "DMIC0"
		}

		Object.Base.pdm_config.1 {
			ctrl_id       0
			mic_a_enable  1
			mic_b_enable  1
		}
		Object.Base.pdm_config.2 {
			ctrl_id       1
			mic_a_enable  1
			mic_b_enable  1
		}
	}
]

# ---------------------------------------------------------------------------
# PCM 11 (4-Channel Capture PCM)
# ---------------------------------------------------------------------------
Object.PCM.pcm."$DMIC_PCM_ID" {
	name    "DMIC Multi-WOV 4CH"
	id      $DMIC_PCM_ID
	direction "capture"
	capture_compatible_d0i3 1

	Object.Base.fe_dai."$DMIC_PCM_CAPS" {}

	Object.PCM.pcm_caps."capture" {
		name       $DMIC_PCM_CAPS
		formats    "S16_LE,S32_LE"
		rates      "16000"
		channels_min 4
		channels_max 4
	}
}

# ---------------------------------------------------------------------------
# Manifest
# ---------------------------------------------------------------------------
Object.Base.manifest.1 {
	name "sof_manifest"
	nhlt "true"
	Object.Base.data.1 {
		name "SOF ABI"
		bytes "0x03,0x00,0x1d,0x00,0x01,0x00"
	}
}
