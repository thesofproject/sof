# ---------------------------------------------------------------------------
# Custom dynamic pipeline class
# ---------------------------------------------------------------------------
Class.Pipeline."custom-capture" {
	<include/pipelines/pipeline-common.conf>

	attributes {
		!constructor [
			"index"
		]
		unique "instance"
	}

	Object.Widget.pipeline."1" {
		priority 0
		lp_mode  0
	}

	direction        "capture"
	time_domain      "timer"
	dynamic_pipeline 1
}

# ---------------------------------------------------------------------------
# Constants
# ---------------------------------------------------------------------------
Define {
	PLATFORM         "wcl"
	PREPROCESS_PLUGINS "nhlt"
	KWD_TEST_UUID    "1f:d5:a8:eb:27:78:b5:47:82:ee:de:6e:77:43:af:67"
	WOV_UUID         "1f:d5:a8:eb:27:78:b5:47:82:ee:de:6e:77:43:af:67"
	WOV_ARBITER_UUID "7d:6c:5b:4a:9f:8e:1b:4a:2c:3d:4e:5f:60:71:82:93"

	DMIC_DAI_INDEX  0
	DMIC_PCM_ID    11
	DMIC_NAME      "dmic01"
	DMIC_PCM_CAPS  "Gain Capture 11"
	FORMAT         "s16le"

	KWD_CPC        100000
	KPB_BUFF_TIME_MS "6000"
}

# Override defaults with platform-specific definitions
IncludeByKey.PLATFORM {
	"tgl"	"platform/intel/tgl.conf"
	"ptl"	"platform/intel/ptl.conf"
	"wcl"	"platform/intel/wcl.conf"
}

# ---------------------------------------------------------------------------
# Pipeline 100 — DAI (Core 0)
# DMIC DAI copier (16k 4ch in -> 16k 4ch out) -> KPB -> Mixin
# No SRC used — DMIC opened natively at 16kHz
# ---------------------------------------------------------------------------
Object.Pipeline."custom-capture" [
	{
		index      100
		format     $FORMAT
		rate       16000

		Object.Widget.dai-copier.1 {
			dai_index   $DMIC_DAI_INDEX
			type        "dai_out"
			dai_type    "DMIC"
			copier_type "DMIC"
			stream_name $DMIC_NAME
			direction   "capture"
			node_type   $DMIC_LINK_INPUT_CLASS

			num_input_pins           1
			num_output_pins          1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate            16000
					in_channels        4
					in_bit_depth       32
					in_valid_bit_depth 32
					in_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					in_ch_map          $CHANNEL_MAP_3_POINT_1
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        4
					out_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					out_ch_map          $CHANNEL_MAP_3_POINT_1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.kpb.1 {
			history_depth_ms 6000
			num_input_pins  1
			num_output_pins 1
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         4
					in_ch_cfg           $CHANNEL_CONFIG_3_POINT_1
					in_ch_map           $CHANNEL_MAP_3_POINT_1
					in_bit_depth        16
					in_valid_bit_depth  16
					ibs                 128
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        4
					out_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					out_ch_map          $CHANNEL_MAP_3_POINT_1
					out_bit_depth       16
					out_valid_bit_depth 16
					obs                 128
				}
			]
		}

		Object.Widget.mixin.1 {
			num_input_pins  1
			num_output_pins 4
			num_input_audio_formats  1
			num_output_audio_formats 1

			Object.Base.input_audio_format [
				{
					in_rate             16000
					in_channels         4
					in_ch_cfg           $CHANNEL_CONFIG_3_POINT_1
					in_ch_map           $CHANNEL_MAP_3_POINT_1
					in_bit_depth        16
					in_valid_bit_depth  16
				}
			]
			Object.Base.output_audio_format [
				{
					out_rate            16000
					out_channels        4
					out_ch_cfg          $CHANNEL_CONFIG_3_POINT_1
					out_ch_map          $CHANNEL_MAP_3_POINT_1
					out_bit_depth       16
					out_valid_bit_depth 16
				}
			]
		}

		Object.Widget.pipeline.1 {
			priority  0
			lp_mode   0
			core_id   0
		}
	}
]

