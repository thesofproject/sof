#
# cAVS hybrid DMIC + SSP2 digital loopback topology for webrtc-aec
#
# Uses onboard DMIC0 (or ESP32-P4 PDM DMIC injector) for microphone capture
# and SSP2 in internal digital loopback (lbm_mode / SSCR1_LBM) for speaker
# playback echo reference:
#
#   PCM2 playback ──(5)──> [SSP2 TX -> lbm_mode -> SSP2 RX] ──(12)──┐
#                                                                   ▼
#   DMIC0 RX ───────(8)──────────────────────────────> WEBRTC-AEC ──(7)──> PCM0 capture
#

<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/dais>
<searchdir:include/pipelines/cavs>
<searchdir:platform>
<searchdir:platform/intel>

<vendor-token.conf>
<manifest.conf>
<tokens.conf>
<virtual.conf>
<host-gateway-capture.conf>
<host-gateway-playback.conf>
<io-gateway-capture.conf>
<io-gateway.conf>
<data.conf>
<pcm.conf>
<pcm_caps.conf>
<fe_dai.conf>
<ssp.conf>
<dmic.conf>
<pdm_config.conf>
<intel/hw_config_cardinal_clk.conf>
<route.conf>
<common_definitions.conf>
<dai-copier.conf>
<module-copier.conf>
<pipeline.conf>
<dai.conf>
<host.conf>
<input_pin_binding.conf>
<output_pin_binding.conf>
<input_audio_format.conf>
<output_audio_format.conf>

<webrtc-aec.conf>

Define {
	MCLK			24576000
	PLATFORM		"none"
	DMIC_DRIVER_VERSION	1
	DMIC_IO_CLK		38400000
	DMIC0_ID		6
	DMIC0_PCM_ID		0
	DMIC0_PCM_NAME		"DMIC0"
	DMIC0_NAME		"dmic01"
	SSP2_PCM_NAME		"Port2"
	AEC_RATE		16000
	AEC_BCLK		1024000
	AEC_BITS		16
	AEC_FMT			"S16_LE"
	MIC_CH			2
	REF_CH			2
}

IncludeByKey.PLATFORM {
	"tgl"	"platform/intel/tgl.conf"
	"adl"	"platform/intel/tgl.conf"
	"mtl"	"platform/intel/mtl.conf"
	"lnl"	"platform/intel/lnl.conf"
	"ptl"	"platform/intel/ptl.conf"
	"nvl"	"platform/intel/ptl.conf" # Note: Assume same configuration as PTL
}

Object.Dai.DMIC [
	{
		dai_index		0
		name			$DMIC0_NAME
		id			$DMIC0_ID
		driver_version		$DMIC_DRIVER_VERSION
		io_clk			$DMIC_IO_CLK
		sample_rate		$AEC_RATE
		clk_min			500000
		clk_max			4800000
		unmute_ramp_time_ms	200
		num_pdm_active		2

		Object.Base.hw_config.1 {
			id	0
			name	"DMIC0"
		}

		Object.Base.pdm_config.1 {
			mic_a_enable	1
			mic_b_enable	1
			ctrl_id		0
		}
	}
]

Object.Dai.SSP [
	{
		id		2
		dai_index	2
		direction	"duplex"
		name		"NoCodec-2"
		default_hw_conf_id	0
		sample_bits		32
		quirks			"lbm_mode"
		io_clk		$MCLK
		Object.Base.hw_config.1 {
			name	"SSP2"
			id	0
			bclk_freq	1024000
			fsync_freq	16000
			tdm_slot_width	32
			Object.Base.link_config.1 { clock_source 1 }
		}
	}
]

Object.Pipeline.io-gateway [
	{
		index	6
		direction	playback
		Object.Widget.dai-copier.1 {
			dai_index 2  dai_type "SSP"  copier_type "SSP"
			stream_name "NoCodec-2"  node_type $I2S_LINK_OUTPUT_CLASS
			num_input_pins 1
			num_input_audio_formats 1
			Object.Base.input_audio_format [{
				in_rate $AEC_RATE in_bit_depth $AEC_BITS in_valid_bit_depth $AEC_BITS
				in_channels $REF_CH
			}]
			num_output_audio_formats 1
			Object.Base.output_audio_format [{
				out_rate $AEC_RATE out_bit_depth 32 out_valid_bit_depth 32
				out_channels $REF_CH
			}]
		}
	}
]

Object.Pipeline.host-gateway-playback [
	{
		index	5
		Object.Widget.host-copier.1 {
			stream_name 'SSP2 Playback'  pcm_id 2
			num_input_audio_formats 1
			Object.Base.input_audio_format [{
				in_rate $AEC_RATE in_bit_depth $AEC_BITS in_valid_bit_depth $AEC_BITS
				in_channels $REF_CH
			}]
			num_output_audio_formats 1
			Object.Base.output_audio_format [{
				out_rate $AEC_RATE out_bit_depth $AEC_BITS out_valid_bit_depth $AEC_BITS
				out_channels $REF_CH
			}]
		}
	}
]

Object.Pipeline.host-gateway-capture [
	{
		index	7
		Object.Widget.host-copier.1 {
			stream_name 'DMIC0 Capture'  pcm_id $DMIC0_PCM_ID
			num_input_audio_formats 1
			Object.Base.input_audio_format [{
				in_rate $AEC_RATE in_bit_depth $AEC_BITS in_valid_bit_depth $AEC_BITS
				in_channels $MIC_CH
			}]
			num_output_audio_formats 1
			Object.Base.output_audio_format [{
				out_rate $AEC_RATE out_bit_depth $AEC_BITS out_valid_bit_depth $AEC_BITS
				out_channels $MIC_CH
			}]
		}
	}
]

Object.Pipeline.io-gateway-capture [
	{
		index		8
		direction	capture
		Object.Widget.dai-copier.1 {
			dai_index 0  dai_type "DMIC"  type dai_out  copier_type "DMIC"
			stream_name $DMIC0_NAME  node_type $DMIC_LINK_INPUT_CLASS
			num_input_audio_formats 1
			Object.Base.input_audio_format [{
				in_rate $AEC_RATE in_bit_depth 32 in_valid_bit_depth 32
				in_channels $MIC_CH
			}]
			num_output_audio_formats 1
			Object.Base.output_audio_format [{
				out_rate $AEC_RATE out_bit_depth $AEC_BITS out_valid_bit_depth $AEC_BITS
				out_channels $MIC_CH
			}]
		}
	}
	{
		index		12
		direction	capture
		Object.Widget.dai-copier.1 {
			dai_index 2  dai_type "SSP"  type dai_out  copier_type "SSP"
			stream_name "NoCodec-2"  node_type $I2S_LINK_INPUT_CLASS
			num_input_audio_formats 1
			Object.Base.input_audio_format [{
				in_rate $AEC_RATE in_bit_depth 32 in_valid_bit_depth 32
				in_channels $REF_CH
			}]
			num_output_audio_formats 1
			Object.Base.output_audio_format [{
				out_rate $AEC_RATE out_bit_depth $AEC_BITS out_valid_bit_depth $AEC_BITS
				out_channels $REF_CH
			}]
		}
	}
]

Object.Widget.webrtc-aec [
	{
		index 7
		name "webrtc-aec.7.1"
		num_input_pins 2
		num_input_audio_formats 2
		num_output_audio_formats 1

		Object.Base.input_audio_format [
			{
				input_pin_index		0
				in_rate			$AEC_RATE
				in_bit_depth		$AEC_BITS
				in_valid_bit_depth	$AEC_BITS
				in_channels		$MIC_CH
				ibs "$[(($in_channels * ($[($in_rate + 999)] / 1000)) * ($in_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
			}
			{
				input_pin_index		1
				in_rate			$AEC_RATE
				in_bit_depth		$AEC_BITS
				in_valid_bit_depth	$AEC_BITS
				in_channels		$REF_CH
				ibs "$[(($in_channels * ($[($in_rate + 999)] / 1000)) * ($in_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
			}
		]

		Object.Base.output_audio_format [
			{
				out_rate		$AEC_RATE
				out_bit_depth		$AEC_BITS
				out_valid_bit_depth	$AEC_BITS
				out_channels		$MIC_CH
				obs "$[(($out_channels * ($[($out_rate + 999)] / 1000)) * ($out_bit_depth / 8)) * $WEBRTC_AEC_PERIOD_MS]"
			}
		]

		Object.Control {
			mixer."1" {
				name 'DMIC0 Capture AEC Switch'
			}
			mixer."2" {
				name 'DMIC0 Capture AEC Suppression Switch'
			}
		}

		Object.Base.input_pin_binding.1 {
			input_pin_binding_name "dai-copier.DMIC.$DMIC0_NAME.capture"
		}
		Object.Base.input_pin_binding.2 {
			input_pin_binding_name "dai-copier.SSP.NoCodec-2.capture"
		}
	}
]

Object.PCM.pcm [
	{
		name	"$DMIC0_PCM_NAME"
		id	$DMIC0_PCM_ID
		direction	"capture"
		Object.Base.fe_dai.1 { name "$DMIC0_PCM_NAME" }
		Object.PCM.pcm_caps.1 {
			direction "capture"  name "DMIC0 Capture"  formats $AEC_FMT
			rate_min $AEC_RATE  rate_max $AEC_RATE  channels_min $MIC_CH  channels_max $MIC_CH
		}
	}
	{
		name	"$SSP2_PCM_NAME"
		id	2
		direction	"playback"
		Object.Base.fe_dai.1 { name "$SSP2_PCM_NAME" }
		Object.PCM.pcm_caps.1 {
			direction "playback"  name "SSP2 Playback"  formats $AEC_FMT
			rate_min $AEC_RATE  rate_max $AEC_RATE  channels_min $REF_CH  channels_max $REF_CH
		}
	}
]

Object.Base.route [
	{ source "host-copier.2.playback"            sink "dai-copier.SSP.NoCodec-2.playback" }
	{ source "dai-copier.DMIC.$DMIC0_NAME.capture" sink "webrtc-aec.7.1" }
	{ source "dai-copier.SSP.NoCodec-2.capture"  sink "webrtc-aec.7.1" }
	{ source "webrtc-aec.7.1"                    sink "host-copier.0.capture" }
]
