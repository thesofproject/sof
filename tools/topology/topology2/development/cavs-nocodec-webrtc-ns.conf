#
# cAVS nocodec topology: webrtc-vad + webrtc-ns capture test
#
# Standalone test topology for validating the webrtc_vad and webrtc_ns
# modules on real hardware using the nocodec (loopback) SSP interface.
#
# Pipeline diagram:
#
#   PCM0 playback ──(1)──────────────(2)──> SSP0 TX
#
#   SSP0 RX ──────(3)──> VAD + NS ──(4)──> PCM0 capture
#
# The VAD module fires NOTIFIER_ID_VAD events; the NS module removes
# stationary background noise. Both run on the same capture pipeline.
#
# Board: any cAVS/ACE platform with a nocodec SSP loopback fixture.
# Compile: alsatplg -c cavs-nocodec-webrtc-ns.conf -o webrtc-ns.tplg

<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/dais>
<searchdir:include/pipelines/cavs>
<searchdir:platform>
<searchdir:platform/intel>

<vendor-token.conf>
<manifest.conf>
<tokens.conf>
<virtual.conf>
<host-gateway-capture.conf>
<host-gateway-playback.conf>
<io-gateway-capture.conf>
<io-gateway.conf>
<data.conf>
<pcm.conf>
<pcm_caps.conf>
<fe_dai.conf>
<ssp.conf>
<intel/hw_config_cardinal_clk.conf>
<manifest.conf>
<route.conf>
<common_definitions.conf>
<dai-copier.conf>
<module-copier.conf>
<pipeline.conf>
<dai.conf>
<host.conf>
<input_audio_format.conf>
<output_audio_format.conf>

<webrtc-vad.conf>
<webrtc-ns.conf>
<webrtc-ns-capture.conf>

Define {
	MCLK			24576000
	PLATFORM		"none"
	SSP0_PCM_ID		0
	SSP0_PCM_NAME		"Port0"
}

IncludeByKey.PLATFORM {
	"tgl"	"platform/intel/tgl.conf"
	"adl"	"platform/intel/tgl.conf"
	"mtl"	"platform/intel/mtl.conf"
	"lnl"	"platform/intel/lnl.conf"
	"ptl"	"platform/intel/lnl.conf"
}

#
# SSP0: duplex nocodec (loopback)
#
Object.Dai.SSP [
	{
		id		0
		dai_index	0
		direction	"duplex"
		name		NoCodec-0
		default_hw_conf_id	0
		sample_bits		32
		quirks			"lbm_mode"
		io_clk		$MCLK

		Object.Base.hw_config.1 {
			name	"SSP0"
			id	0
			bclk_freq	3072000
			tdm_slot_width	32
			Object.Base.link_config.1 {
				clock_source	1
			}
		}
	}
]

#
# Playback: PCM0 → SSP0 TX
#
Object.Pipeline.host-gateway-playback [
	{
		index	1
		Object.Widget.host-copier.1 {
			stream_name 'SSP0 Playback'
			pcm_id 0
			num_input_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		16
					in_valid_bit_depth	16
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_bit_depth		16
					out_valid_bit_depth	16
				}
			]
		}
	}
]

Object.Pipeline.io-gateway [
	{
		index	2
		direction	playback
		Object.Widget.dai-copier.1 {
			dai_index	0
			dai_type	"SSP"
			copier_type	"SSP"
			stream_name	"NoCodec-0"
			node_type	$I2S_LINK_OUTPUT_CLASS
			num_input_pins	1
			num_input_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		16
					in_valid_bit_depth	16
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_bit_depth		32
					out_valid_bit_depth	32
				}
			]
		}
	}
]

#
# Capture: SSP0 RX → webrtc-vad → webrtc-ns → PCM0
#
Object.Pipeline.webrtc-ns-capture [
	{
		index	3
	}
]

Object.Pipeline.host-gateway-capture [
	{
		index	4
		Object.Widget.host-copier.1 {
			stream_name 'SSP0 Capture'
			pcm_id 0
			num_input_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_bit_depth		16
					out_valid_bit_depth	16
				}
			]
		}
	}
]

#
# SSP0 RX DAI → pipeline 3 input
#
Object.Pipeline.io-gateway-capture [
	{
		index		5
		direction	capture
		Object.Widget.dai-copier.1 {
			dai_index	0
			dai_type	"SSP"
			type		dai_out
			copier_type	"SSP"
			stream_name	"NoCodec-0"
			node_type	$I2S_LINK_INPUT_CLASS
			num_input_audio_formats 1
			Object.Base.input_audio_format [
				{
					in_bit_depth		32
					in_valid_bit_depth	32
				}
			]
			num_output_audio_formats 1
			Object.Base.output_audio_format [
				{
					out_bit_depth		16
					out_valid_bit_depth	16
				}
			]
		}
	}
]

Object.PCM.pcm [
	{
		name	"$SSP0_PCM_NAME"
		id	$SSP0_PCM_ID
		direction	"duplex"
		Object.Base.fe_dai.1 {
			name	"$SSP0_PCM_NAME"
		}

		Object.PCM.pcm_caps.1 {
			direction	"playback"
			name "SSP0 Playback"
			formats 'S16_LE'
		}

		Object.PCM.pcm_caps.2 {
			direction	"capture"
			name "SSP0 Capture"
			formats 'S16_LE'
		}
	}
]

Object.Base.route [
	{
		source	"host-copier.0.playback"
		sink	"dai-copier.SSP.NoCodec-0.playback"
	}
	{
		source	"dai-copier.SSP.NoCodec-0.capture"
		sink	"module-copier.3.1"
	}
	{
		source	"module-copier.3.2"
		sink	"host-copier.0.capture"
	}
]
