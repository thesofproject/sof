# HDA generic topology extended with the USB Audio Offload Link (UAOL).
#
# Development topology. The UAOL is not part of sof-hda-generic itself: the
# backend of a function which is not present on the machine makes the whole
# topology fail to load, and the UAOL DAIs only exist on ACE2 and newer
# platforms, with a kernel built for USB audio offload. Keeping it separate
# leaves sof-hda-generic loadable everywhere.
#
# Select it with:
#	options snd_sof tplg_filename=sof-hda-generic-uaol.tplg
#
# The module parameter also stops the machine driver from appending the -idisp
# suffix, so this topology carries the iDisp backends unconditionally, as
# sof-hda-generic does. For a machine without an HDA codec, where the driver
# would have picked sof-hda-generic-idisp, use the sof-hda-generic-idisp-uaol variant
# instead, which is built from this file without the HDA codec paths.
#
# The UAOL function itself lives in platform/intel/uaol-generic.conf, and is
# shared with the cavs-uaol function topology of the sof_sdw card.

<searchdir:include>
<searchdir:include/common>
<searchdir:include/components>
<searchdir:include/dais>
<searchdir:include/pipelines>
<searchdir:include/pipelines/cavs>
<searchdir:platform>
<searchdir:platform/intel>

<sof-hda-generic.conf>

<uaol.conf>
<input_audio_format.conf>
<output_audio_format.conf>

Define {
	UAOL_PLAYBACK_PCM	'UAOL0 Playback'
	UAOL_CAPTURE_PCM	'UAOL0 Capture'
	# The two directions are separate DAI links so that the format fixup of
	# a link is decided by the DAI copier of that direction alone, and the
	# link carries two streams per direction, each with a backend of its
	# own: UAOL<link>-Play<n> and UAOL<link>-Cap<n>. The names are abbreviated
	# because alsa-lib drops widget tuples once the dai-copier name,
	# 'dai-copier.UAOL.<name>.<direction>', exceeds 37 characters
	UAOL_PB_DAI_NAME	'UAOL0-Play0'
	UAOL_CP_DAI_NAME	'UAOL0-Cap0'
	# The BE IDs are the dai link IDs that are matched with the machine
	# driver. skl_hda_dsp_generic assigns fixed IDs, so these are the same
	# whichever other functions the board has. The backends come in the
	# order Play0, Cap0, Play1, Cap1
	UAOL_PB_BE_ID		9
	UAOL_CP_BE_ID		10
	# UAOL_DAI_INDEX is the UAOL link the DSP uses, only link 0 is addressable
	UAOL_DAI_INDEX		0
	UAOL_PCM_NAME		'UAOL0'
	UAOL_PCM_ID		21
	UAOL_PB_HOST_PIPELINE_ID	210
	UAOL_PB_DAI_PIPELINE_ID		211
	UAOL_CP_HOST_PIPELINE_ID	212
	UAOL_CP_DAI_PIPELINE_ID		213

	# Second stream pair of the link, on its own PCM. Each backend offloads
	# the USB PCM its route kcontrol points at; with a single USB device both
	# routes point at it and the second PCM fails with EBUSY while the first
	# one runs, a second device or a second PCM of the first lets both run
	UAOL_NUM_STREAMS	2
	UAOL_PLAYBACK1_PCM	'UAOL1 Playback'
	UAOL_CAPTURE1_PCM	'UAOL1 Capture'
	UAOL_PB1_DAI_NAME	'UAOL0-Play1'
	UAOL_CP1_DAI_NAME	'UAOL0-Cap1'
	UAOL_PB1_BE_ID		11
	UAOL_CP1_BE_ID		12
	UAOL_PCM1_NAME		'UAOL1'
	UAOL_PCM1_ID		22
	UAOL_PB1_HOST_PIPELINE_ID	215
	UAOL_PB1_DAI_PIPELINE_ID	216
	UAOL_CP1_HOST_PIPELINE_ID	217
	UAOL_CP1_DAI_PIPELINE_ID	218
	# Both paths pass through whatever the offloaded USB device asks for, so
	# the PCM advertises everything a USB device may support. 7 channels is
	# left out of the widget formats, it has no channel config and no channel
	# map, so it is the one count in the range which cannot be run.
	UAOL_CHANNELS_MIN	1
	UAOL_CHANNELS_MAX	8
	# UAOL supports up to 384 kHz
	UAOL_RATE_MIN		8000
	UAOL_RATE_MAX		384000
	UAOL_RATES		'8000,11025,12000,16000,22050,24000,32000,44100,48000,64000,88200,96000,128000,176400,192000,384000'

	# The deep buffer PCMs feed the same mixer as the normal playback PCM of
	# their stream, next to the one the HDA playback has
	UAOL_DEEP_BUFFER	'true'
	UAOL_DB_PCM_NAME	'Deepbuffer UAOL0'
	UAOL_DB_PCM_ID		23
	UAOL_DB_PIPELINE_ID	214
	UAOL_DB1_PCM_NAME	'Deepbuffer UAOL1'
	UAOL_DB1_PCM_ID		24
	UAOL_DB1_PIPELINE_ID	219
}

<platform/intel/uaol-generic.conf>
