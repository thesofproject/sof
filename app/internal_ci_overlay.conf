#
# Overlay definitions to build SOF firmware for internal CI
#
# The default SOF build (board config files) targets the Linux SOF
# driver. This overlay restores the configuration that was used
# for non-Linux builds before Linux became the default.
#
# When this overlay is used, app/CMakeLists.txt also:
#  - does not include the Intel ACE3.x+ LL userspace overlay
#    (ll_userspace_overlay.conf)
#  - includes the board specific internal CI overlay from
#    overlays/internal_ci/<board>.conf, if present
#

# Do not restrict firmware to features supported by stable
# Linux SOF driver versions. This also enables the additional
# virtual heap buffers (VIRTUAL_HEAP_EXTENDED) on platforms
# that support them.
CONFIG_SOF_OS_LINUX_COMPAT_PRIORITY=n
