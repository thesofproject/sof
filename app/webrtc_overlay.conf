# WebRTC Audio Processing Modules Kconfig overlay (LLEXT real backends)

# WebRTC NS (classic spectral Wiener filter)
CONFIG_COMP_WEBRTC_NS=m
CONFIG_COMP_WEBRTC_NS_STUB=n
CONFIG_WEBRTC_NS_LEVEL=2
CONFIG_WEBRTC_NS_SAMPLE_RATE_HZ=16000

# WebRTC VAD (libfvad Voice Activity Detector)
CONFIG_COMP_WEBRTC_VAD=m
CONFIG_COMP_WEBRTC_VAD_STUB=n
CONFIG_WEBRTC_VAD_MODE=2
CONFIG_WEBRTC_VAD_FRAME_MS=10

# WebRTC AEC (Acoustic Echo Canceller)
CONFIG_COMP_WEBRTC_AEC=m
CONFIG_WEBRTC_AEC_BACKEND_AECM=y
CONFIG_WEBRTC_AEC_FILTER_LEN_MS=64
CONFIG_WEBRTC_AEC_SUPPRESSION_LEVEL=1
CONFIG_WEBRTC_AEC_SAMPLE_RATE_HZ=16000

# WebRTC NS2 (RNNoise neural network noise suppression)
CONFIG_COMP_WEBRTC_NS2=m
CONFIG_COMP_WEBRTC_NS2_STUB=n
CONFIG_WEBRTC_NS2_CHANNELS_MAX=2
CONFIG_WEBRTC_NS2_VAD_THRESHOLD_PCT=60
CONFIG_WEBRTC_NS2_VAD_NOTIFY=y

# WebRTC HPF (High-Pass Filter 80 Hz biquad)
CONFIG_COMP_WEBRTC_HPF=m
CONFIG_COMP_WEBRTC_HPF_STUB=n

# WebRTC AGC (Automatic Gain Control & Limiter)
CONFIG_COMP_WEBRTC_AGC=m
CONFIG_COMP_WEBRTC_AGC_STUB=n
CONFIG_WEBRTC_AGC_TARGET_DBFS=3
CONFIG_WEBRTC_AGC_COMPRESSION_GAIN_DB=9
CONFIG_WEBRTC_AGC_LIMITER=y

# Heap and stack sizing for full WebRTC suite
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_SOF_ZEPHYR_HEAP_SIZE=0x80000
