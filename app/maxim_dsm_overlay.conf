# ACP7x smart_amp overlay -- enables Maxim DSM in three steps.
#
# Usage:
#   ./scripts/xtensa-build-zephyr.py -p acp_7_x -o app/maxim_dsm_overlay.conf
#
# The three configurations (each step only flips switches in this file,
# opening them up progressively):
#
#   Step 1, PASSTHRU_AMP   : CONFIG_COMP_SMART_AMP=y only
#                            -> the Kconfig choice falls back to PASSTHRU_AMP
#                            -> builds smart_amp.c + smart_amp_generic.c +
#                               smart_amp_passthru.c
#                            -> does not link libdsm.a.  Use this to validate the
#                               smart_amp framework, the topology and the duplex
#                               clocking.
#                            -> SMART_UUID in the topology must be
#                               passthru_smart_amp
#                               (64a794f0-55d3-4bca-9d5b-7b588badd037)
#
#   Step 2, MAXIM_DSM_STUB : adds CONFIG_MAXIM_DSM=y + CONFIG_MAXIM_DSM_STUB=y
#                            -> swaps in smart_amp_maxim_dsm.c + maxim_dsm_stub.c
#                            -> still does not link libdsm.a (NOT STUB is false
#                               in CMakeLists)
#                            -> SMART_UUID in the topology becomes maxim_dsm
#                               (0cd84e80-ebd3-11ea-adc1-0242ac120002)
#
#   Step 3, real libdsm.a  : drops CONFIG_MAXIM_DSM_STUB
#                            -> zephyr_library_import takes effect and links
#                               src/audio/smart_amp/lib/release/dsm_lib/libdsm.a


CONFIG_COMP_SMART_AMP=y
CONFIG_MAXIM_DSM=y
# CONFIG_MAXIM_DSM_STUB=y

