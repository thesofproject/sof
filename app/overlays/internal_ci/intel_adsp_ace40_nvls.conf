# Board specific internal CI settings for nvls. This overlay is
# automatically included by app/CMakeLists.txt when the build uses
# internal_ci_overlay.conf. It is merged before internal_ci_overlay.conf
# and any other user given overlays, so those can still override these
# settings. See internal_ci_overlay.conf.

# Retain FW context in IMR over D3
CONFIG_ADSP_IMR_CONTEXT_SAVE=y

# Default runtime log level ERROR
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=1
