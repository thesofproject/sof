# Target Platform & SOF Core
CONFIG_PLATFORM_RP2350=y
CONFIG_SOF_FULL_ZEPHYR_APPLICATION=y
CONFIG_ZEPHYR_NATIVE_DRIVERS=y
CONFIG_IPC_MAJOR_4=y
CONFIG_COMP_BASEFW_IPC4=n
CONFIG_CROSS_CORE_STREAM=n
CONFIG_STATIC_PIPELINE=y
CONFIG_SYS_HEAP_BIG_ONLY=y
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_BIN=y

# Audio Processing Modules & ARM SIMD Optimizations
CONFIG_COMP_VOLUME=y
CONFIG_VOLUME_ARM_SIMD=y
CONFIG_COMP_IIR=y
CONFIG_EQ_IIR_ARM_SIMD=y
CONFIG_FILTER_ARM_SIMD=y
CONFIG_COMP_FIR=n
CONFIG_COMP_DRC=y
CONFIG_DRC_ARM_SIMD=y
CONFIG_COMP_CROSSOVER=n
CONFIG_COMP_DCBLOCK=n
CONFIG_COMP_MULTIBAND_DRC=n
CONFIG_COMP_TDFB=n
CONFIG_COMP_USB_AUDIO=y
CONFIG_COMP_TONE=n

# USB Device Stack Next & UAC2 Class
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_DRIVER_HIGH_SPEED_SUPPORT_ENABLED=n
CONFIG_USBD_MAX_SPEED_FULL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_AUDIO2_CLASS=y
CONFIG_UDC_ENABLE_SOF=n
CONFIG_UDC_BUF_COUNT=16
CONFIG_UDC_BUF_POOL_SIZE=4096
CONFIG_UDC_RPI_PICO_STACK_SIZE=2048
CONFIG_UDC_RPI_PICO_THREAD_PRIORITY=8
CONFIG_LL_THREAD_PRIORITY=0

# C Library (Picolibc required for Cortex-M33 USB buffer alignment)
CONFIG_PICOLIBC=y
CONFIG_MINIMAL_LIBC=n

# USB Device Identification
CONFIG_SAMPLE_USBD_VID=0x2E8A
CONFIG_SAMPLE_USBD_PID=0x000A
CONFIG_SAMPLE_USBD_MANUFACTURER="Raspberry Pi"
CONFIG_SAMPLE_USBD_PRODUCT="SOF RP2350 Audio"

# System Resources & Memory
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096
CONFIG_HW_STACK_PROTECTION=n
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_TICKLESS_KERNEL=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Logging & Console
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4
CONFIG_SOF_LOG_LEVEL_INF=y
CONFIG_USBD_UAC2_LOG_LEVEL_INF=y
CONFIG_UDC_DRIVER_LOG_LEVEL_INF=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_PRINTK=n
CONFIG_LOG_PRINTK=n
CONFIG_EARLY_CONSOLE=n

# SOF Low Latency Scheduler Statistics Logging
CONFIG_SCHEDULE_LL_STATS_LOG=n
